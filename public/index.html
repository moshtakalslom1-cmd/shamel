<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>رخيص والسوق الشامل — واجهة ذهبية وفضية وألماسية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #06080d;
      --bg-card: rgba(14, 19, 30, 0.92);
      --bg-elevated: rgba(23, 30, 46, 0.95);
      --gold: #f6c453;
      --gold-bright: #ffe599;
      --gold-deep: #a97614;
      --silver: #e2e8f0;
      --silver-muted: #94a3b8;
      --diamond: #67e8f9;
      --diamond-soft: rgba(103, 232, 249, 0.16);
      --border-gold: rgba(246, 196, 83, 0.36);
      --border-diamond: rgba(103, 232, 249, 0.35);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #22c55e;
      --radius-lg: 16px;
      --radius-md: 11px;
      --shadow-lux: 0 12px 30px rgba(0, 0, 0, 0.72);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }

    html, body {
      background:
        radial-gradient(circle at 12% 8%, rgba(246, 196, 83, 0.14), transparent 36%),
        radial-gradient(circle at 88% 12%, rgba(103, 232, 249, 0.13), transparent 38%),
        radial-gradient(circle at 50% 100%, rgba(226, 232, 240, 0.08), transparent 45%),
        var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      font-size: 14px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(8, 11, 18, 0.92);
      backdrop-filter: blur(16px);
      border-bottom: 1.5px solid var(--border-gold);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.65);
      padding: 9px 14px;
    }

    .header-inner {
      max-width: 1440px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .brand-badge {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--gold), var(--silver) 52%, var(--diamond));
      display: grid;
      place-items: center;
      font-weight: 800;
      color: #06080d;
      font-size: 1.25rem;
      box-shadow: 0 0 18px rgba(246, 196, 83, 0.35), 0 0 14px rgba(103, 232, 249, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.45);
    }

    .brand-title {
      font-size: 1.08rem;
      font-weight: 800;
      background: linear-gradient(90deg, var(--gold-bright), var(--silver), var(--diamond));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-sub {
      font-size: 0.72rem;
      color: var(--silver);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
    }

    .btn {
      border: 1px solid rgba(226, 232, 240, 0.22);
      background: linear-gradient(180deg, rgba(28, 36, 54, 0.95), rgba(15, 20, 32, 0.98));
      color: var(--silver);
      padding: 6px 12px;
      border-radius: var(--radius-md);
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.22s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      border-color: var(--gold);
      color: #fff;
      box-shadow: 0 4px 14px rgba(246, 196, 83, 0.2);
    }

    .btn-gold {
      background: linear-gradient(135deg, var(--gold-bright), var(--gold) 55%, var(--gold-deep));
      color: #07090e;
      border: 1px solid rgba(255, 229, 153, 0.7);
      box-shadow: 0 4px 16px rgba(246, 196, 83, 0.3);
    }

    .btn-diamond {
      background: linear-gradient(135deg, rgba(103, 232, 249, 0.22), rgba(226, 232, 240, 0.08));
      border: 1px solid var(--border-diamond);
      color: var(--diamond);
      box-shadow: 0 0 14px rgba(103, 232, 249, 0.14);
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.16);
      border: 1px solid rgba(239, 68, 68, 0.5);
      color: #fca5a5;
    }

    .avatar-mini {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid var(--gold);
    }

    .container {
      max-width: 1440px;
      margin: 0 auto;
      padding: 12px 14px 36px;
    }

    .toolbar {
      background: var(--bg-card);
      border: 1px solid var(--border-gold);
      border-radius: var(--radius-lg);
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 8px;
      margin-bottom: 10px;
      box-shadow: var(--shadow-lux);
    }

    .input, .select, .textarea {
      width: 100%;
      background: rgba(7, 10, 16, 0.92);
      border: 1px solid rgba(226, 232, 240, 0.18);
      color: var(--text-main);
      padding: 7px 11px;
      border-radius: var(--radius-md);
      font-size: 0.84rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .input:focus, .select:focus, .textarea:focus {
      border-color: var(--diamond);
      box-shadow: 0 0 0 2px rgba(103, 232, 249, 0.14);
    }

    /* شريط الأقسام المزخرف والمتحرك أفقياً */
    .categories-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 2px 10px;
      margin-bottom: 8px;
      scrollbar-width: thin;
      scrollbar-color: var(--gold) transparent;
    }

    .categories-strip::-webkit-scrollbar {
      height: 5px;
    }

    .categories-strip::-webkit-scrollbar-thumb {
      background: linear-gradient(90deg, var(--gold), var(--diamond));
      border-radius: 999px;
    }

    .cat-chip {
      flex: 0 0 auto;
      padding: 6px 14px;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(20, 26, 40, 0.95), rgba(11, 15, 24, 0.98));
      border: 1px solid rgba(226, 232, 240, 0.22);
      color: var(--silver);
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.22s ease;
      white-space: nowrap;
    }

    .cat-chip:hover {
      border-color: var(--diamond);
      color: #fff;
      transform: translateY(-1px);
    }

    .cat-chip.active {
      background: linear-gradient(135deg, rgba(246, 196, 83, 0.24), rgba(103, 232, 249, 0.16));
      border-color: var(--gold);
      color: var(--gold-bright);
      box-shadow: 0 0 16px rgba(246, 196, 83, 0.24);
    }

    /* شبكة الإعلانات المرتبة (4 أعمدة على الشاشات الكبيرة) */
    .ads-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 11px;
    }

    @media (max-width: 1180px) {
      .ads-grid { grid-template-columns: repeat(3, 1fr); }
    }

    @media (max-width: 780px) {
      .ads-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    }

    .ad-card {
      position: relative;
      background: linear-gradient(165deg, rgba(22, 29, 46, 0.96) 0%, rgba(10, 13, 21, 0.99) 100%);
      border: 1px solid rgba(226, 232, 240, 0.2);
      border-radius: var(--radius-lg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: var(--shadow-lux);
      transition: transform 0.24s ease, border-color 0.24s ease, box-shadow 0.24s ease;
      cursor: pointer;
    }

    .ad-card:hover {
      transform: translateY(-3px);
      border-color: var(--gold);
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.8), 0 0 16px rgba(246, 196, 83, 0.18);
    }

    .ad-img-wrap {
      position: relative;
      height: 128px;
      background: #06080d;
      overflow: hidden;
      border-bottom: 1px solid rgba(246, 196, 83, 0.2);
    }

    .ad-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .ad-badge-cat {
      position: absolute;
      top: 7px;
      right: 7px;
      background: rgba(6, 8, 13, 0.86);
      border: 1px solid var(--border-diamond);
      color: var(--diamond);
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.68rem;
      font-weight: 700;
      backdrop-filter: blur(6px);
    }

    .ad-badge-owner {
      position: absolute;
      bottom: 7px;
      left: 7px;
      background: rgba(6, 8, 13, 0.85);
      border: 1px solid rgba(246, 196, 83, 0.4);
      color: var(--gold-bright);
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.66rem;
      font-weight: 700;
    }

    .ad-body {
      padding: 9px 11px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
    }

    .ad-title {
      font-size: 0.88rem;
      font-weight: 800;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ad-price {
      font-size: 0.95rem;
      font-weight: 800;
      background: linear-gradient(90deg, var(--gold-bright), var(--gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .ad-meta {
      font-size: 0.72rem;
      color: var(--silver-muted);
      display: flex;
      justify-content: space-between;
      gap: 6px;
    }

    .ad-footer {
      padding: 7px 9px;
      border-top: 1px solid rgba(226, 232, 240, 0.12);
      display: flex;
      gap: 5px;
      background: rgba(8, 11, 18, 0.65);
    }

    .ad-footer .btn {
      flex: 1;
      justify-content: center;
      padding: 4px 7px;
      font-size: 0.73rem;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 44px 18px;
      background: var(--bg-card);
      border: 1px dashed var(--border-gold);
      border-radius: var(--radius-lg);
      color: var(--text-muted);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(4, 6, 10, 0.86);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
      overflow-y: auto;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 780px;
      max-height: 90vh;
      overflow-y: auto;
      background: linear-gradient(180deg, #121826 0%, #0b0f18 100%);
      border: 1px solid var(--border-gold);
      border-radius: var(--radius-lg);
      padding: 18px;
      box-shadow: 0 22px 55px rgba(0, 0, 0, 0.88), 0 0 24px rgba(103, 232, 249, 0.1);
    }

    .modal-box.auth-box {
      max-width: 430px;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(226, 232, 240, 0.16);
      padding-bottom: 10px;
      margin-bottom: 14px;
      gap: 8px;
    }

    .modal-title {
      font-size: 1.05rem;
      font-weight: 800;
      background: linear-gradient(90deg, var(--gold-bright), var(--diamond));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }

    .auth-tab {
      padding: 8px;
      border-radius: var(--radius-md);
      border: 1px solid rgba(226, 232, 240, 0.2);
      background: rgba(7, 10, 16, 0.9);
      color: var(--silver);
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      font-size: 0.84rem;
    }

    .auth-tab.active {
      border-color: var(--gold);
      color: var(--gold-bright);
      background: rgba(246, 196, 83, 0.14);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 10px;
    }

    .form-label {
      font-size: 0.8rem;
      color: var(--silver);
      font-weight: 700;
    }

    .preview-box {
      margin-top: 6px;
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 1px dashed var(--gold);
      max-height: 180px;
      background: #07090e;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
    }

    .preview-box img {
      max-width: 100%;
      max-height: 165px;
      object-fit: contain;
    }

    .chat-container {
      display: grid;
      grid-template-columns: 205px 1fr;
      gap: 12px;
      height: 52vh;
      min-height: 320px;
    }

    @media (max-width: 650px) {
      .chat-container {
        grid-template-columns: 1fr;
        height: auto;
      }
      .chat-user-list {
        max-height: 110px;
      }
      .chat-messages {
        height: 245px;
      }
    }

    .chat-user-list {
      background: rgba(7, 10, 16, 0.92);
      border: 1px solid rgba(226, 232, 240, 0.18);
      border-radius: var(--radius-md);
      padding: 8px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .user-item {
      padding: 7px 10px;
      border-radius: var(--radius-md);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background 0.2s;
      border: 1px solid transparent;
      font-size: 0.84rem;
    }

    .user-item:hover {
      background: rgba(246, 196, 83, 0.08);
    }

    .user-item.active {
      background: linear-gradient(135deg, rgba(246, 196, 83, 0.22), rgba(103, 232, 249, 0.1));
      border-color: var(--gold);
      color: var(--gold-bright);
      font-weight: 700;
    }

    .chat-main {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
    }

    .chat-messages {
      background: rgba(7, 10, 16, 0.92);
      border: 1px solid rgba(226, 232, 240, 0.18);
      border-radius: var(--radius-md);
      padding: 10px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .msg-bubble {
      max-width: 82%;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 0.84rem;
      line-height: 1.4;
      word-break: break-word;
    }

    .msg-me {
      align-self: flex-start;
      background: linear-gradient(135deg, var(--gold-bright), var(--gold));
      color: #07090e;
      font-weight: 700;
    }

    .msg-other {
      align-self: flex-end;
      background: var(--bg-elevated);
      border: 1px solid var(--border-diamond);
      color: var(--text-main);
    }

    .msg-time {
      display: block;
      font-size: 0.65rem;
      opacity: 0.72;
      margin-top: 3px;
      text-align: left;
    }

    .blocked-list {
      margin-top: 12px;
      border-top: 1px solid rgba(226, 232, 240, 0.16);
      padding-top: 10px;
    }

    .blocked-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.5);
      color: #fecaca;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 0.76rem;
    }

    .toast-container {
      position: fixed;
      bottom: 14px;
      left: 14px;
      right: 14px;
      z-index: 200;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .toast {
      pointer-events: auto;
      max-width: 440px;
      width: 100%;
      background: #101624;
      border: 1px solid var(--gold);
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: var(--radius-md);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 0.84rem;
      font-weight: 700;
    }

    .toast.error { border-color: var(--danger); color: #fecaca; }
    .toast.success { border-color: var(--success); color: #bbf7d0; }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="brand" onclick="goHome()">
        <div class="brand-badge">❖</div>
        <div>
          <div class="brand-title">رخيص والسوق الشامل</div>
          <div id="authStatusText" class="brand-sub">إعلانات سريعة • تواصل مباشر</div>
        </div>
      </div>

      <div class="header-actions">
        <button type="button" class="btn btn-gold" onclick="openAdForm()">✦ + إعلان</button>
        <button type="button" class="btn btn-diamond" onclick="openChatModal()">◈ الدردشات</button>
        <button id="authOpenBtn" type="button" class="btn" onclick="openAuthModal('login')">❖ دخول / حساب</button>
        <button id="logoutBtn" type="button" class="btn btn-danger" style="display: none;" onclick="logoutUser()">خروج</button>
        <button type="button" class="btn" onclick="openProfileModal()">
          <img id="headerAvatar" class="avatar-mini" src="https://api.dicebear.com/7.x/avataaars/svg?seed=user" alt="Avatar" />
          <span id="headerUsername">ملفك</span>
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="toolbar">
      <input id="searchInput" class="input" type="search" placeholder="❖ ابحث عن إعلان..." oninput="renderAds()" />
      <select id="cityFilter" class="select" onchange="renderAds()">
        <option value="">◈ كل المدن</option>
        <option value="دمشق">دمشق</option>
        <option value="حلب">حلب</option>
        <option value="حمص">حمص</option>
        <option value="اللاذقية">اللاذقية</option>
        <option value="أنطاليا">أنطاليا</option>
        <option value="إسطنبول">إسطنبول</option>
      </select>
      <select id="conditionFilter" class="select" onchange="renderAds()">
        <option value="">✦ كل الحالات</option>
        <option value="جديد">جديد</option>
        <option value="مستعمل">مستعمل</option>
      </select>
      <select id="sortSelect" class="select" onchange="renderAds()">
        <option value="newest">الأحدث أولاً</option>
        <option value="price-asc">الأقل سعراً</option>
        <option value="price-desc">الأعلى سعراً</option>
      </select>
    </section>

    <section id="categoriesStrip" class="categories-strip"></section>
    <section id="adsGrid" class="ads-grid"></section>
  </main>

  <!-- تسجيل الدخول وإنشاء الحساب (الاسم وكلمة المرور فقط) -->
  <div id="authModal" class="modal-backdrop" onclick="handleBackdropClick(event, 'auth')">
    <div class="modal-box auth-box" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div class="modal-title">❖ الحساب وتسجيل الدخول</div>
        <button type="button" class="btn" onclick="closeActiveModal()">✕</button>
      </div>

      <div class="auth-tabs">
        <button id="tabLogin" type="button" class="auth-tab active" onclick="switchAuthTab('login')">تسجيل الدخول</button>
        <button id="tabRegister" type="button" class="auth-tab" onclick="switchAuthTab('register')">إنشاء حساب</button>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="loginUsername">الاسم</label>
          <input id="loginUsername" class="input" type="text" required placeholder="اكتب اسمك..." />
        </div>
        <div class="form-group">
          <label class="form-label" for="loginPassword">كلمة المرور</label>
          <input id="loginPassword" class="input" type="password" required placeholder="••••••••" />
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px;">
          <button type="button" class="btn" onclick="closeActiveModal()">إلغاء</button>
          <button type="submit" class="btn btn-gold">تسجيل الدخول</button>
        </div>
      </form>

      <form id="registerForm" style="display: none;" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label class="form-label" for="regUsername">الاسم</label>
          <input id="regUsername" class="input" type="text" required placeholder="اكتب اسمك..." />
        </div>
        <div class="form-group">
          <label class="form-label" for="regPassword">كلمة المرور</label>
          <input id="regPassword" class="input" type="password" required placeholder="••••••••" />
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px;">
          <button type="button" class="btn" onclick="closeActiveModal()">إلغاء</button>
          <button type="submit" class="btn btn-gold">إنشاء حساب</button>
        </div>
      </form>
    </div>
  </div>

  <!-- تفاصيل الإعلان -->
  <div id="detailsModal" class="modal-backdrop" onclick="handleBackdropClick(event, 'details')">
    <div class="modal-box" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div id="detailTitle" class="modal-title">تفاصيل الإعلان</div>
        <button type="button" class="btn" onclick="closeActiveModal()">✕</button>
      </div>
      <div id="detailContent"></div>
    </div>
  </div>

  <!-- إضافة وتعديل الإعلان -->
  <div id="adFormModal" class="modal-backdrop" onclick="handleBackdropClick(event, 'adForm')">
    <div class="modal-box" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div id="adFormTitle" class="modal-title">إضافة إعلان جديد</div>
        <button type="button" class="btn" onclick="closeActiveModal()">✕</button>
      </div>
      <form id="adForm" onsubmit="submitAdForm(event)">
        <input type="hidden" id="editAdId" />
        <div class="form-grid">
          <div class="form-group">
            <label class="form-label" for="adTitle">عنوان الإعلان</label>
            <input id="adTitle" class="input" type="text" required placeholder="مثال: هاتف أو سيارة أو شقة..." />
          </div>
          <div class="form-group">
            <label class="form-label" for="adPrice">السعر</label>
            <input id="adPrice" class="input" type="number" min="0" step="any" required placeholder="0" />
          </div>
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label class="form-label" for="adCategory">القسم</label>
            <select id="adCategory" class="select" required></select>
          </div>
          <div class="form-group">
            <label class="form-label" for="adCondition">الحالة</label>
            <select id="adCondition" class="select">
              <option value="مستعمل">مستعمل</option>
              <option value="جديد">جديد</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="adCurrency">العملة</label>
            <select id="adCurrency" class="select">
              <option value="USD">USD ($)</option>
              <option value="TRY">TRY (₺)</option>
              <option value="SYP">SYP</option>
            </select>
          </div>
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label class="form-label" for="adCity">المدينة</label>
            <input id="adCity" class="input" type="text" placeholder="مثال: دمشق أو أنطاليا..." />
          </div>
          <div class="form-group">
            <label class="form-label" for="adNeighbourhood">الحي / المنطقة</label>
            <input id="adNeighbourhood" class="input" type="text" placeholder="اختياري..." />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="adDescription">الوصف والتفاصيل</label>
          <textarea id="adDescription" class="textarea" rows="3" placeholder="اكتب تفاصيل المنتج وحالته..."></textarea>
        </div>

        <div class="form-group">
          <label class="form-label" for="adImageFile">صورة من الجهاز أو رابط صورة</label>
          <input id="adImageFile" class="input" type="file" accept="image/*" onchange="handleImageFile(event, 'ad')" />
          <input id="adImageUrl" class="input" type="url" placeholder="أو رابط صورة مباشر (https://...)" oninput="handleImageUrl(event)" style="margin-top: 6px;" />
          <div id="adImagePreviewBox" class="preview-box" style="display: none;">
            <img id="adImagePreview" src="" alt="معاينة الصورة" />
          </div>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px;">
          <button type="button" class="btn" onclick="closeActiveModal()">إلغاء</button>
          <button type="submit" class="btn btn-gold">حفظ ونشر</button>
        </div>
      </form>
    </div>
  </div>

  <!-- الدردشة والرسائل الصوتية وقائمة الحظر -->
  <div id="chatModal" class="modal-backdrop" onclick="handleBackdropClick(event, 'chat')">
    <div class="modal-box" style="max-width: 860px;" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div id="chatModalTitle" class="modal-title">◈ الدردشة المباشرة</div>
        <div style="display: flex; gap: 6px;">
          <button id="toggleBlockBtn" type="button" class="btn btn-danger" onclick="toggleBlockCurrentPeer()">🚫 حظر</button>
          <button type="button" class="btn" onclick="closeActiveModal()">✕</button>
        </div>
      </div>

      <div class="chat-container">
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <input
            class="input"
            type="text"
            placeholder="اسم مستخدم + Enter..."
            onkeydown="if(event.key==='Enter'){event.preventDefault();addOrSelectPeer(this.value);this.value='';}"
          />
          <div id="chatUserList" class="chat-user-list"></div>
        </div>

        <div class="chat-main">
          <div id="chatMessages" class="chat-messages"></div>

          <div style="display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px;">
            <button type="button" class="btn" style="padding: 3px 9px; font-size: 0.74rem;" onclick="insertQuickPhrase('هل المنتج لا يزال متوفراً؟')">متوفر؟</button>
            <button type="button" class="btn" style="padding: 3px 9px; font-size: 0.74rem;" onclick="insertQuickPhrase('ما هو السعر النهائي؟')">السعر النهائي؟</button>
            <button type="button" class="btn" style="padding: 3px 9px; font-size: 0.74rem;" onclick="insertQuickPhrase('ممكن المعاينة والتسليم اليوم؟')">التسليم اليوم؟</button>
          </div>

          <form onsubmit="sendChatMessage(event)" style="display: flex; gap: 6px; margin-top: 6px;">
            <button id="voiceRecordBtn" type="button" class="btn btn-diamond" onclick="toggleVoiceRecording()" title="تسجيل صوتي">🎙️</button>
            <input id="chatTextInput" class="input" type="text" placeholder="اكتب رسالتك..." required />
            <button type="submit" class="btn btn-gold">إرسال</button>
          </form>
        </div>
      </div>

      <div class="blocked-list">
        <div class="form-label">قائمة المحظورين</div>
        <div id="blockedUsersContainer" style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px;"></div>
      </div>
    </div>
  </div>

  <!-- الملف الشخصي -->
  <div id="profileModal" class="modal-backdrop" onclick="handleBackdropClick(event, 'profile')">
    <div class="modal-box" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div class="modal-title">✦ الملف الشخصي</div>
        <button type="button" class="btn" onclick="closeActiveModal()">✕</button>
      </div>
      <form onsubmit="saveProfile(event)">
        <div class="form-group">
          <label class="form-label" for="profileName">الاسم الظاهر</label>
          <input id="profileName" class="input" type="text" required placeholder="اكتب اسمك..." />
        </div>
        <div class="form-group">
          <label class="form-label" for="profileCity">المدينة</label>
          <input id="profileCity" class="input" type="text" placeholder="مثال: دمشق أو أنطاليا..." />
        </div>
        <div class="form-group">
          <label class="form-label" for="profileBio">نبذة تعريفية</label>
          <textarea id="profileBio" class="textarea" rows="2" placeholder="نبذة قصيرة عنك..."></textarea>
        </div>
        <div class="form-group">
          <label class="form-label" for="profileAvatarFile">صورة رمزية من الجهاز</label>
          <input id="profileAvatarFile" class="input" type="file" accept="image/*" onchange="handleImageFile(event, 'avatar')" />
          <div class="preview-box" style="max-height: 120px;">
            <img id="profileAvatarPreview" src="" alt="الصورة الرمزية" />
          </div>
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px;">
          <button type="button" class="btn" onclick="closeActiveModal()">إلغاء</button>
          <button type="submit" class="btn btn-gold">حفظ الملف</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <script src="app.js"></script>
</body>
</html>
