<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>رخيص - السوق الشامل للإعلانات في سوريا</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap');

    :root {
      --bg-body: #090d16;
      --bg-surface: #111827;
      --bg-card: #162033;
      --bg-input: #0b111e;
      --primary: #0ea5e9;
      --primary-hover: #0284c7;
      --primary-soft: rgba(14, 165, 233, 0.14);
      --accent: #f59e0b;
      --success: #10b981;
      --danger: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(148, 163, 184, 0.18);
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.25);
      --shadow-md: 0 10px 28px rgba(0, 0, 0, 0.42);
      --radius-lg: 18px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 72px;
    }

    /* Header & Location Bar */
    header {
      position: sticky;
      top: 0;
      z-index: 500;
      background: rgba(9, 13, 22, 0.94);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding: 10px 18px;
    }

    .header-inner {
      max-width: 1380px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-logo {
      font-size: 1.55rem;
      font-weight: 900;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      letter-spacing: -0.5px;
    }

    .brand-logo span.badge-dot {
      background: linear-gradient(135deg, #0ea5e9, #38bdf8);
      color: #090d16;
      padding: 2px 9px;
      border-radius: 10px;
      font-size: 1.15rem;
    }

    .location-selector {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 700;
    }

    .location-selector select {
      background: transparent;
      border: none;
      color: var(--text-main);
      font-weight: 700;
      font-size: 0.84rem;
      padding: 0 4px;
      cursor: pointer;
      width: auto;
    }

    .location-selector select option {
      background: var(--bg-surface);
      color: var(--text-main);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      border-radius: var(--radius-md);
      padding: 8px 15px;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: linear-gradient(135deg, #0ea5e9, #0284c7);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(14, 165, 233, 0.28);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #38bdf8, #0ea5e9);
    }

    .btn-surface {
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border);
    }

    .btn-surface:hover {
      border-color: var(--primary);
      background: #1c283f;
    }

    .btn-success {
      background: var(--success);
      color: #06281e;
    }

    .btn-danger {
      background: var(--danger);
      color: #ffffff;
    }

    .user-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--primary-soft);
      border: 1px solid rgba(14, 165, 233, 0.4);
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 800;
      color: #7dd3fc;
      cursor: pointer;
    }

    .user-chip img {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      object-fit: cover;
    }

    /* Main Layout */
    .main-wrapper {
      max-width: 1380px;
      width: 100%;
      margin: 0 auto;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Search & Filter Hero */
    .search-panel {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .search-bar-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .search-input-box {
      position: relative;
      flex-grow: 1;
    }

    .search-input-box input {
      width: 100%;
      padding: 11px 40px 11px 14px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      color: var(--text-main);
      font-size: 0.92rem;
    }

    .search-input-box input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .search-input-box .search-ico {
      position: absolute;
      right: 13px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 1rem;
    }

    .filters-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px;
    }

    input, select, textarea {
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      color: var(--text-main);
      padding: 9px 12px;
      font-size: 0.86rem;
      width: 100%;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
    }

    /* Categories Carousel & Subcategory Drilldown */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .section-title {
      font-size: 1.08rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .categories-rail {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 6px;
      scrollbar-width: thin;
    }

    .cat-tile {
      min-width: 118px;
      flex: 0 0 118px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .cat-tile:hover, .cat-tile.active {
      border-color: var(--primary);
      background: var(--primary-soft);
      transform: translateY(-2px);
    }

    .cat-tile .cat-emoji {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: var(--bg-card);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.55rem;
    }

    .cat-tile .cat-label {
      font-size: 0.8rem;
      font-weight: 700;
      line-height: 1.25;
      color: var(--text-main);
    }

    /* Subcategories Chips Bar (Dynamic on Category Click) */
    .subcat-panel {
      display: none;
      background: var(--bg-surface);
      border: 1px solid rgba(14, 165, 233, 0.35);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      flex-direction: column;
      gap: 10px;
    }

    .subcat-panel.visible {
      display: flex;
    }

    .subcat-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .sub-chip {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 6px 13px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .sub-chip:hover, .sub-chip.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    /* Ads Grid (4 cols desktop, 3 cols mobile) */
    .ads-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }

    @media (max-width: 1150px) {
      .ads-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 680px) {
      header {
        padding: 8px 12px;
      }
      .main-wrapper {
        padding: 12px;
        gap: 14px;
      }
      .ads-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 7px;
      }
      .ad-card {
        border-radius: 10px;
      }
      .ad-media {
        height: 86px !important;
      }
      .ad-info {
        padding: 7px !important;
        gap: 3px !important;
      }
      .ad-price-tag {
        font-size: 0.76rem !important;
      }
      .ad-card-title {
        font-size: 0.72rem !important;
        -webkit-line-clamp: 1 !important;
      }
      .ad-loc-line {
        font-size: 0.64rem !important;
      }
      .ad-seller-row, .ad-cat-pill {
        display: none !important;
      }
      .ad-card-footer {
        padding: 5px !important;
        gap: 4px !important;
      }
      .ad-card-footer .btn {
        padding: 4px 5px !important;
        font-size: 0.64rem !important;
      }
    }

    .ad-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .ad-card:hover {
      transform: translateY(-3px);
      border-color: rgba(14, 165, 233, 0.55);
      box-shadow: var(--shadow-md);
    }

    .ad-media {
      position: relative;
      width: 100%;
      height: 165px;
      background: #0b111e;
      display: none;
    }

    .ad-media.has-img {
      display: block;
    }

    .ad-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      cursor: pointer;
    }

    .fav-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(9, 13, 22, 0.78);
      border: 1px solid var(--border);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .ad-info {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-grow: 1;
    }

    .ad-price-tag {
      font-size: 1.05rem;
      font-weight: 900;
      color: var(--success);
    }

    .ad-card-title {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.35;
      cursor: pointer;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .ad-loc-line {
      font-size: 0.76rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .ad-cat-pill {
      display: inline-block;
      align-self: flex-start;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: #7dd3fc;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
    }

    .ad-seller-row {
      margin-top: auto;
      padding-top: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.76rem;
      color: var(--text-muted);
    }

    .seller-trigger {
      color: var(--primary);
      font-weight: 700;
      cursor: pointer;
      text-decoration: underline;
    }

    .ad-card-footer {
      padding: 8px 12px;
      background: rgba(11, 17, 30, 0.65);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 6px;
    }

    .ad-card-footer .btn {
      flex: 1;
      padding: 6px 8px;
      font-size: 0.76rem;
    }

    /* Native Full-Page In-App Chat View */
    #appChatView {
      display: none;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      flex-direction: column;
      min-height: 560px;
      box-shadow: var(--shadow-md);
    }

    #appChatView.active {
      display: flex;
    }

    .chat-header-bar {
      padding: 12px 16px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .chat-workspace {
      display: grid;
      grid-template-columns: 290px 1fr;
      min-height: 500px;
      max-height: 74vh;
    }

    .chat-sidebar {
      border-left: 1px solid var(--border);
      background: #0d1422;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .chat-peer-card {
      padding: 13px 15px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: background 0.15s ease;
    }

    .chat-peer-card:hover,
    .chat-peer-card.active {
      background: var(--primary-soft);
    }

    .chat-conversation-area {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .chat-active-banner {
      padding: 11px 16px;
      border-bottom: 1px solid var(--border);
      background: rgba(17, 24, 39, 0.9);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .chat-messages-stream {
      flex-grow: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 320px;
    }

    .msg-bubble {
      max-width: 76%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 0.88rem;
      line-height: 1.45;
      word-break: break-word;
    }

    .msg-outgoing {
      align-self: flex-end;
      background: var(--primary);
      color: #ffffff;
      border-bottom-left-radius: 4px;
    }

    .msg-incoming {
      align-self: flex-start;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      border-bottom-right-radius: 4px;
    }

    .chat-compose-bar {
      padding: 12px 14px;
      border-top: 1px solid var(--border);
      background: var(--bg-card);
      display: flex;
      gap: 8px;
    }

    @media (max-width: 768px) {
      .chat-workspace {
        grid-template-columns: 1fr;
        max-height: none;
      }
      .chat-sidebar {
        max-height: 170px;
        border-left: none;
        border-bottom: 1px solid var(--border);
      }
    }

    /* Bottom Navigation Bar (App Style) */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 450;
      background: rgba(11, 17, 30, 0.96);
      backdrop-filter: blur(14px);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 7px 10px;
    }

    .bnav-item {
      background: transparent;
      border: none;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      padding: 4px 10px;
    }

    .bnav-item.active, .bnav-item:hover {
      color: var(--primary);
    }

    .bnav-item .bnav-ico {
      font-size: 1.2rem;
    }

    .bnav-post-btn {
      background: linear-gradient(135deg, #0ea5e9, #0284c7);
      color: #ffffff;
      border-radius: 14px;
      padding: 8px 16px;
      font-size: 0.82rem;
      font-weight: 800;
      box-shadow: 0 4px 14px rgba(14, 165, 233, 0.35);
    }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(3, 7, 18, 0.82);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 14px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 620px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: var(--shadow-md);
    }

    .modal-head {
      padding: 14px 18px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-close {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-main);
      font-size: 1.15rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .modal-content {
      padding: 16px 18px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .profile-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 8px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    .profile-avatar-xl {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--primary);
      background: var(--bg-card);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 900;
    }

    .profile-stats {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 4px;
    }

    .p-stat {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 7px 14px;
      min-width: 105px;
    }

    .p-stat strong {
      display: block;
      font-size: 1.05rem;
      color: var(--primary);
    }

    .p-stat span {
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .tab-strip {
      display: flex;
      gap: 6px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    #toastAlert {
      position: fixed;
      bottom: 76px;
      left: 18px;
      background: var(--bg-card);
      color: var(--text-main);
      padding: 10px 18px;
      border-radius: var(--radius-md);
      border-right: 4px solid var(--primary);
      box-shadow: var(--shadow-md);
      z-index: 2000;
      display: none;
      font-size: 0.84rem;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="brand-group">
        <div class="brand-logo" onclick="showMarketView()">
          <span class="badge-dot">رخيص</span>
          <span>السوق الشامل</span>
        </div>

        <div class="location-selector" title="اختر المحافظة أو المنطقة">
          <span>📍</span>
          <select id="headerCitySelect" onchange="syncCityFromHeader()">
            <option value="">كل سوريا</option>
            <option value="دمشق">دمشق</option>
            <option value="ريف دمشق">ريف دمشق</option>
            <option value="حلب">حلب</option>
            <option value="حمص">حمص</option>
            <option value="حماة">حماة</option>
            <option value="اللاذقية">اللاذقية</option>
            <option value="طرطوس">طرطوس</option>
            <option value="إدلب">إدلب</option>
            <option value="درعا">درعا</option>
            <option value="السويداء">السويداء</option>
            <option value="القنيطرة">القنيطرة</option>
            <option value="دير الزور">دير الزور</option>
            <option value="الرقة">الرقة</option>
            <option value="الحسكة">الحسكة</option>
          </select>
        </div>
      </div>

      <div class="header-actions">
        <button type="button" class="btn btn-primary" onclick="openPublishModal()">+ أضف إعلانك</button>
        <button type="button" class="btn btn-surface" onclick="openCartModal()">🛒 السلة (<span id="cartCountBadge">0</span>)</button>
        <div id="headerAuthSlot"></div>
      </div>
    </div>
  </header>

  <main class="main-wrapper">

    <!-- واجهة الدردشة الكاملة داخل التطبيق -->
    <section id="appChatView">
      <div class="chat-header-bar">
        <div style="display:flex; align-items:center; gap:10px;">
          <button type="button" class="btn btn-surface" onclick="showMarketView()">⬅️ العودة للسوق</button>

  </div><script>
    const CATEGORY_TREE = [
      {

        icon: '🚗',
        subs: ['تويوتا', 'هيونداي', 'كيا', 'مرسيدس', 'بي إم دبليو', 'شيفروليه', 'نيسان', 'سيارات نقل وبيك أب', 'دراجات نارية', 'قطع غيار وإكسسوارات']

      {

        subs: ['سامسونج جالاكسي (Samsung)', 'آيفون (Apple iPhone)', 'شاومي وريدمي (Xiaomi)', 'هواوي وهونر (Huawei)', 'أوبو وريلمي (Oppo)', 'أجهزة لوحية وآيباد', 'ساعات ذكية وإكسسوارات']

      {

        subs: ['شقق للبيع', 'شقق ومنازل للإيجار', 'فيلات ومزارع', 'أراضي سكنية وزراعية', 'محلات ومكاتب تجارية']

      {

        subs: ['لابتوب وكمبيوتر مكتبي', 'شاشات وتلفزيونات', 'بلايستيشن وألعاب فيديو', 'كاميرات وصوتيات', 'طاقة شمسية وبطاريات']
      },
      {
        id: 'furniture',
        name: 'أثاث ومفروشات',
        icon: '🛋️',
        subs: ['غرف نوم', 'صالونات وكنب', 'أدوات كهربائية منزلية', 'مكيفات وتدفئة', 'سجاد وتحف وديكور']
      },
      {
        id: 'animals',
        name: 'حيوانات أليفة وطيور',
        icon: '🐾',
        subs: ['قطط', 'كلاب', 'طيور زينة وببغاوات', 'حمام ودواجن', 'أغنام ومواشي', 'مستلزمات وأعلاف']
      },
      {
        id: 'fashion',
        name: 'أزياء وموضة',
        icon: '👕',
        subs: ['ملابس رجالية', 'ملابس نسائية', 'ملابس أطفال', 'ساعات وعطور', 'أحذية وحقائب']
      }
    ];

    let state = {
      currentUser: null,
      ads: [],
      filteredAds: [],
      selectedCategory: '',
      selectedSubCategory: '',
      favorites: [],
      cart: [],
      messages: [],
      activeChatPeer: '',
      activeChatAdId: '',
      adImageBase64: '',
      avatarBase64: ''
    };

    window.onload = async () => {
      try {
        const savedUser = localStorage.getItem('rakhis_user');
        if (savedUser) state.currentUser = JSON.parse(savedUser);
        state.favorites = JSON.parse(localStorage.getItem('rakhis_favs') || '[]');
        state.cart = JSON.parse(localStorage.getItem('rakhis_cart') || '[]');
      } catch (e) {}

      initCategoryControls();
      renderAuthHeader();
      updateCartBadge();
      await loadAds();
      await loadMessages();
      setInterval(loadMessages, 4000);
    };

    function toast(msg) {
      const el = document.getElementById('toastAlert');
      el.textContent = msg;
      el.style.display = 'block';
      clearTimeout(window.__tTimer);
      window.__tTimer = setTimeout(() => { el.style.display = 'none'; }, 2800);
    }

    function esc(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function formatSYP(val) {
      const digits = String(val || '').replace(/[^\d]/g, '');
      return digits ? `${Number(digits).toLocaleString('en-US')} ل.س` : '0 ل.س';
    }

    function openModal(id) {
      document.getElementById(id).classList.add('open');
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('open');
    }

    /* تهيئة الأقسام والتفرعات */
    function initCategoryControls() {
      const rail = document.getElementById('categoriesRail');
      const filterMain = document.getElementById('filterMainCat');
      const pubMain = document.getElementById('pubMainCat');

      rail.innerHTML = CATEGORY_TREE.map(cat => `
        <div class="cat-tile" id="catTile_${cat.id}" onclick="selectMainCategory('${esc(cat.name)}')">
          <div class="cat-emoji">${cat.icon}</div>
          <div class="cat-label">${esc(cat.name)}</div>
        </div>
      `).join('');

      const optionsHtml = CATEGORY_TREE.map(cat => `<option value="${esc(cat.name)}">${cat.icon} ${esc(cat.name)}</option>`).join('');
      filterMain.innerHTML = `<option value="">جميع الأقسام الرئيسية</option>${optionsHtml}`;
      pubMain.innerHTML = optionsHtml;
      populatePublishSubCats();
    }

    function selectMainCategory(catName) {
      state.selectedCategory = catName;
      state.selectedSubCategory = '';

      document.getElementById('filterMainCat').value = catName;
      updateCategoryUI();
      applyFilters();
    }

    function handleMainCategoryDropdown() {
      state.selectedCategory = document.getElementById('filterMainCat').value;
      state.selectedSubCategory = '';
      updateCategoryUI();
      applyFilters();
    }

    function updateCategoryUI() {
      const catObj = CATEGORY_TREE.find(c => c.name === state.selectedCategory);
      CATEGORY_TREE.forEach(c => {
        const tile = document.getElementById(`catTile_${c.id}`);
        if (tile) tile.classList.toggle('active', c.name === state.selectedCategory);
      });

      const subPanel = document.getElementById('subcatPanel');
      const subChips = document.getElementById('subcatChipsContainer');
      const subDropdown = document.getElementById('filterSubCat');

      if (!catObj) {
        subPanel.classList.remove('visible');
        subDropdown.innerHTML = '<option value="">جميع الفروع والماركات</option>';
        return;
      }

      document.getElementById('subcatPanelTitle').textContent = `${catObj.icon} تفرعات ${catObj.name}:`;
      subPanel.classList.add('visible');

      subChips.innerHTML = `
        <span class="sub-chip ${state.selectedSubCategory === '' ? 'active' : ''}" onclick="selectSubCategory('')">الكل في ${esc(catObj.name)}</span>
        ${catObj.subs.map(sub => `
          <span class="sub-chip ${state.selectedSubCategory === sub ? 'active' : ''}" onclick="selectSubCategory('${esc(sub)}')">${esc(sub)}</span>
        `).join('')}
      `;

      subDropdown.innerHTML = `<option value="">كل فروع ${esc(catObj.name)}</option>` +
        catObj.subs.map(sub => `<option value="${esc(sub)}" ${state.selectedSubCategory === sub ? 'selected' : ''}>${esc(sub)}</option>`).join('');
    }

    function selectSubCategory(subName) {
      state.selectedSubCategory = subName;
      document.getElementById('filterSubCat').value = subName;
      updateCategoryUI();
      applyFilters();
    }

    function clearCategorySelection() {
      state.selectedCategory = '';
      state.selectedSubCategory = '';
      document.getElementById('filterMainCat').value = '';
      document.getElementById('filterSubCat').value = '';
      updateCategoryUI();
      applyFilters();
    }

    function populatePublishSubCats() {
      const mainVal = document.getElementById('pubMainCat').value;
      const catObj = CATEGORY_TREE.find(c => c.name === mainVal) || CATEGORY_TREE[0];
      const pubSub = document.getElementById('pubSubCat');
      pubSub.innerHTML = catObj.subs.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join('');
    }

    function syncCityFromHeader() {
      const val = document.getElementById('headerCitySelect').value;
      document.getElementById('filterCity').value = val;
      applyFilters();
    }

    function syncCityFromFilter() {
      const val = document.getElementById('filterCity').value;
      document.getElementById('headerCitySelect').value = val;
      applyFilters();
    }

    /* التبديل بين السوق والدردشة داخل التطبيق */
    function showMarketView() {
      document.getElementById('appChatView').classList.remove('active');
      document.getElementById('marketMainView').style.display = 'block';
    }

    function openAppChat(peerUsername = '', adId = '') {
      if (!state.currentUser) {
        toast('يرجى تسجيل الدخول أولاً لفتح المراسلات');
        openAuthModal('login');
        return;
      }
      closeModal('profileModal');
      closeModal('detailsModal');
      closeModal('cartModal');

      if (peerUsername && peerUsername.toLowerCase() !== state.currentUser.username.toLowerCase()) {
        state.activeChatPeer = peerUsername;
      }
      state.activeChatAdId = adId || '';

      document.getElementById('marketMainView').style.display = 'none';
      document.getElementById('appChatView').classList.add('active');
      document.getElementById('chatUserTag').textContent = `حسابك: ${state.currentUser.username}`;

      loadMessages().then(() => {
        renderChatUI();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    }

    /* إدارة الرسائل */
    function msgCacheKey() {
      const u = state.currentUser && state.currentUser.username ? state.currentUser.username : 'guest';
      return `rakhis_chat_${u}`;
    }

    function getCachedMessages() {
      try {
        return JSON.parse(localStorage.getItem(msgCacheKey()) || '[]');
      } catch (e) {
        return [];
      }
    }

    function setCachedMessages(arr) {
      try {
        localStorage.setItem(msgCacheKey(), JSON.stringify(arr));
      } catch (e) {}
    }

    async function loadMessages() {
      if (!state.currentUser || !state.currentUser.username) return;
      const me = state.currentUser.username;
      let serverMsgs = [];

      try {
        const res = await fetch(`/api/messages?user=${encodeURIComponent(me)}`, { cache: 'no-store' });
        if (res.ok) {
          const data = await res.json();
          serverMsgs = Array.isArray(data) ? data : (Array.isArray(data.messages) ? data.messages : []);
        }
      } catch (e) {}

      const localMsgs = getCachedMessages();
      const merged = new Map();
      [...serverMsgs, ...localMsgs].forEach((m, i) => {
        const key = m.id || `${m.from || m.sender}_${m.to || m.receiver}_${m.timestamp || i}_${m.text || m.message || ''}`;
        merged.set(key, {
          id: m.id || key,
          from: m.from || m.sender || '',
          to: m.to || m.receiver || '',
          text: m.text || m.message || '',
          adId: m.adId || '',
          timestamp: m.timestamp || new Date().toISOString()
        });
      });

      state.messages = Array.from(merged.values()).sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
      if (document.getElementById('appChatView').classList.contains('active')) {
        renderChatUI();
      }
    }

    function getPeerThreads() {
      if (!state.currentUser) return [];
      const me = state.currentUser.username.toLowerCase();
      const map = new Map();

      state.messages.forEach(m => {
        const f = String(m.from || '').trim();
        const t = String(m.to || '').trim();
        const isMine = f.toLowerCase() === me;
        const isToMe = t.toLowerCase() === me;
        if (!isMine && !isToMe) return;
        const peer = isMine ? t : f;
        if (!peer || peer.toLowerCase() === me) return;
        map.set(peer.toLowerCase(), {
          username: peer,
          lastText: m.text || ''
        });
      });

      if (state.activeChatPeer && state.activeChatPeer.toLowerCase() !== me) {
        const k = state.activeChatPeer.toLowerCase();
        if (!map.has(k)) {
          map.set(k, { username: state.activeChatPeer, lastText: 'ابدأ المحادثة الآن' });
        }
      }

      const list = Array.from(map.values());
      if (!state.activeChatPeer && list.length > 0) {
        state.activeChatPeer = list[0].username;
      }
      return list;
    }

    function renderChatUI() {
      const threads = getPeerThreads();
      const sidebar = document.getElementById('chatPeersSidebar');
      const peerTitle = document.getElementById('chatActivePeerName');
      const adBadge = document.getElementById('chatLinkedAdBadge');
      const stream = document.getElementById('chatMessagesStream');

      if (threads.length === 0) {

        peerTitle.textContent = 'اختر شخصاً للمراسلة';
        adBadge.textContent = '';
        stream.innerHTML = '<div style="text-align:center; color:var(--text-muted); margin-top:40px;">اختر محادثة من القائمة لبدء التواصل.</div>';
        return;
      }

      peerTitle.textContent = `💬 ${state.activeChatPeer}`;
      const linkedAd = state.activeChatAdId ? state.ads.find(a => String(a.id) === String(state.activeChatAdId)) : null;
      adBadge.textContent = linkedAd ? `بخصوص: ${linkedAd.title} (${formatSYP(linkedAd.price)})` : '';

      const me = state.currentUser.username.toLowerCase();
      const peer = state.activeChatPeer.toLowerCase();
      const msgs = state.messages.filter(m => {
        const f = String(m.from || '').toLowerCase();
        const t = String(m.to || '').toLowerCase();
        return (f === me && t === peer) || (f === peer && t === me);
      });

      if (msgs.length === 0) {
        stream.innerHTML = `<div style="text-align:center; color:var(--text-muted); margin-top:40px;">اكتب أول رسالة إلى ${esc(state.activeChatPeer)}</div>`;
      } else {
        stream.innerHTML = msgs.map(m => {
          const outgoing = String(m.from || '').toLowerCase() === me;
          return `<div class="msg-bubble ${outgoing ? 'msg-outgoing' : 'msg-incoming'}">${esc(m.text)}</div>`;
        }).join('');
        stream.scrollTop = stream.scrollHeight;
      }
    }

    async function sendMessage() {
      if (!state.currentUser || !state.activeChatPeer) return;
      const input = document.getElementById('chatMessageInput');
      const text = (input.value || '').trim();
      if (!text) return;

      const payload = {
        id: `${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
        from: state.currentUser.username,
        to: state.activeChatPeer,
        sender: state.currentUser.username,
        receiver: state.activeChatPeer,
        text,
        message: text,
        adId: state.activeChatAdId || '',
        timestamp: new Date().toISOString()
      };

      const cached = getCachedMessages();
      cached.push(payload);
      setCachedMessages(cached);

      input.value = '';
      await loadMessages();
      renderChatUI();

      try {
        await fetch('/api/messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
      } catch (e) {}
    }

    function applyFilters() {
      const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
      const cat = document.getElementById('filterMainCat').value;
      const sub = document.getElementById('filterSubCat').value;
      const city = document.getElementById('filterCity').value;
      const cond = document.getElementById('filterCondition').value;
      const sort = document.getElementById('filterSort').value;

      let list = state.ads.filter(ad => {
        const blob = `${ad.title || ''} ${ad.description || ''} ${ad.category || ''} ${ad.subCategory || ''} ${ad.city || ''} ${ad.neighborhood || ''} ${ad.ownerUsername || ''}`.toLowerCase();
        const matchQ = !q || blob.includes(q);
        const matchCat = !cat || ad.category === cat;
        const matchSub = !sub || ad.subCategory === sub || blob.includes(sub.toLowerCase());
        const matchCity = !city || ad.city === city;
        const matchCond = !cond || ad.condition === cond;
        return matchQ && matchCat && matchSub && matchCity && matchCond;
      });

      if (sort === 'price_asc') {
        list.sort((a, b) => Number(String(a.price || 0).replace(/[^\d]/g, '')) - Number(String(b.price || 0).replace(/[^\d]/g, '')));
      } else if (sort === 'price_desc') {
        list.sort((a, b) => Number(String(b.price || 0).replace(/[^\d]/g, '')) - Number(String(a.price || 0).replace(/[^\d]/g, '')));
      }

      state.filteredAds = list;
      renderAdsGrid();
    }

    async function postReview(adId) {
      const rating = document.getElementById('revStars').value;
      const comment = document.getElementById('revText').value.trim();
      if (!comment) {
        toast('اكتب تعليقك أولاً');
        return;
      }
      const author = state.currentUser ? state.currentUser.username : 'زائر';

      try {
        const res = await fetch(`/api/ads/${encodeURIComponent(adId)}/reviews`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ author, rating, comment })
        });
        if (res.ok) {
          const updated = await res.json();
          state.ads = state.ads.map(a => String(a.id) === String(adId) ? updated : a);
          applyFilters();
          openAdDetails(adId);
          toast('تمت إضافة تقييمك');
          return;
        }
      } catch (e) {}

      const ad = state.ads.find(a => String(a.id) === String(adId));
      if (ad) {
        if (!Array.isArray(ad.reviews)) ad.reviews = [];
        ad.reviews.push({ author, rating, comment });
        applyFilters();
        openAdDetails(adId);
        toast('تمت إضافة تقييمك');
      }
    }

        ` : ''}

        ${isMe && activeTab === 'settings' ? `
          <div style="display:flex; flex-direction:column; gap:9px;">
            <h4 style="color:var(--primary);">⚙️ تعديل بيانات الحساب</h4>
            <div>
              <label style="font-size:0.78rem; color:var(--text-muted);">الصورة الشخصية:</label>
              <input type="file" id="profAvatarInput" accept="image/*">
            </div>
            <input type="text" id="profCityInput" value="${esc(userData.city || 'دمشق')}" placeholder="المدينة">
            <input type="text" id="profPhoneInput" value="${esc(userData.phone || '')}" placeholder="رقم الهاتف">
            <textarea id="profBioInput" rows="2" placeholder="نبذة تعريفية عنك أو عن متجرك">${esc(userData.bio || '')}</textarea>
            <button type="button" class="btn btn-success" style="width:100%;" onclick="saveProfileChanges()">حفظ التغييرات</button>
          </div>
        ` : ''}

        ${(!isMe || activeTab === 'info') ? `
          <h4 style="color:var(--text-main);">الإعلانات المنشورة:</h4>
          <div style="display:flex; flex-direction:column; gap:8px;">
            ${userData.ads && userData.ads.length > 0 ? userData.ads.map(ad => `
              <div style="background:var(--bg-card); border:1px solid var(--border); padding:10px 12px; border-radius:10px; display:flex; justify-content:space-between; align-items:center; gap:8px;">
                <span style="font-weight:700;">${esc(ad.title)}</span>
                <div style="display:flex; align-items:center; gap:8px;">
                  <span style="color:var(--success); font-weight:800;">${formatSYP(ad.price)}</span>
                  ${isMe ? `<button type="button" class="btn btn-danger" style="padding:4px 8px; font-size:0.72rem;" onclick="removeAd('${esc(ad.id)}')">حذف</button>` : ''}
                </div>
              </div>
            `).join('') : '<p style="color:var(--text-muted); font-size:0.84rem;">لا توجد إعلانات منشورة حالياً.</p>'}
          </div>
        ` : ''}
      `;

      const avInput = document.getElementById('profAvatarInput');
      if (avInput) {
        avInput.addEventListener('change', (ev) => {
          const f = ev.target.files[0];
          if (!f) return;
          const r = new FileReader();
          r.onload = (e) => { state.avatarBase64 = e.target.result; };
          r.readAsDataURL(f);
        });
      }

      openModal('profileModal');
    }

    async function saveProfileChanges() {
      if (!state.currentUser) return;
      const city = document.getElementById('profCityInput').value.trim();
      const phone = document.getElementById('profPhoneInput').value.trim();
      const bio = document.getElementById('profBioInput').value.trim();

      try {
        const res = await fetch('/api/profile/settings', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: state.currentUser.username,
            city,
            phone,
            bio,
            avatar: state.avatarBase64
          })
        });
        if (res.ok) {
          const data = await res.json();
          state.currentUser = data.user || { ...state.currentUser, city, phone, bio, avatar: state.avatarBase64 };
          localStorage.setItem('rakhis_user', JSON.stringify(state.currentUser));
          renderAuthHeader();
          toast('تم حفظ إعدادات ملفك الشخصي');
          await openUserProfile(state.currentUser.username, '', 'info');
        }
      } catch (e) {
        toast('تعذر حفظ الإعدادات');
      }
    }

    async function removeAd(adId) {
      try {
        await fetch(`/api/ads/${encodeURIComponent(adId)}`, { method: 'DELETE' });
      } catch (e) {}
      state.ads = state.ads.filter(a => String(a.id) !== String(adId));
      applyFilters();
      if (state.currentUser) await openUserProfile(state.currentUser.username, '', 'info');
      toast('تم حذف الإعلان');
    }

    /* المفضلة والسلة */
    function toggleFav(adId, ev) {
      if (ev) ev.stopPropagation();
      const idx = state.favorites.indexOf(adId);
      if (idx >= 0) {
        state.favorites.splice(idx, 1);
        toast('تمت الإزالة من المفضلة');
      } else {
        state.favorites.push(adId);
        toast('تمت الإضافة إلى المفضلة');
      }
      localStorage.setItem('rakhis_favs', JSON.stringify(state.favorites));
      renderAdsGrid();
    }

    function addToCart(adId) {
      const ad = state.ads.find(a => String(a.id) === String(adId));
      if (!ad) return;
      if (state.cart.some(i => String(i.id) === String(adId))) {
        toast('الإعلان موجود مسبقاً في السلة');
        return;
      }
      state.cart.push(ad);
      localStorage.setItem('rakhis_cart', JSON.stringify(state.cart));
      updateCartBadge();
      toast('تمت الإضافة إلى السلة');
    }

    function removeFromCart(adId) {
      state.cart = state.cart.filter(i => String(i.id) !== String(adId));
      localStorage.setItem('rakhis_cart', JSON.stringify(state.cart));
      updateCartBadge();
      openCartModal();
    }

    function updateCartBadge() {
      const el = document.getElementById('cartCountBadge');
      if (el) el.textContent = String(state.cart.length);
    }

    function openCartModal() {
      const body = document.getElementById('cartModalBody');
      if (state.cart.length === 0) {
        body.innerHTML = '<p style="text-align:center; color:var(--text-muted); padding:28px;">السلة فارغة حالياً.</p>';
        openModal('cartModal');
        return;
      }

      const total = state.cart.reduce((acc, item) => {
        const d = String(item.price || '').replace(/[^\d]/g, '');
        return acc + (d ? Number(d) : 0);
      }, 0);

      body.innerHTML = `
        <div style="display:flex; flex-direction:column; gap:8px;">
          ${state.cart.map(item => `
            <div style="background:var(--bg-card); border:1px solid var(--border); border-radius:10px; padding:10px; display:flex; justify-content:space-between; align-items:center; gap:8px;">
              <div>
                <strong>${esc(item.title)}</strong>
                <div style="font-size:0.75rem; color:var(--text-muted);">${esc(item.ownerUsername)} • ${esc(item.city || 'دمشق')}</div>
                <div style="color:var(--success); font-weight:800;">${formatSYP(item.price)}</div>
              </div>
              <div style="display:flex; gap:6px;">
                <button type="button" class="btn btn-primary" onclick="openAppChat('${esc(item.ownerUsername)}', '${esc(item.id)}')">💬 راسل</button>
                <button type="button" class="btn btn-danger" onclick="removeFromCart('${esc(item.id)}')">حذف</button>
              </div>
            </div>
          `).join('')}
        </div>
        <div style="border-top:1px solid var(--border); padding-top:12px; display:flex; justify-content:space-between; align-items:center;">
          <strong>الإجمالي:</strong>
          <span style="color:var(--accent); font-weight:900; font-size:1.05rem;">${total.toLocaleString('en-US')} ل.س</span>
        </div>
      `;
      openModal('cartModal');
    }
  </script>
</body>
</html>
