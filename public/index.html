<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>رخيص والسوق الشامل — الواجهة العصرية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-page: #f4f6fb;
      --bg-card: #ffffff;
      --bg-soft: #eef2f7;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --accent: #0f766e;
      --accent-soft: #ccfbf1;
      --text-main: #0f172a;
      --text-sub: #475569;
      --text-muted: #64748b;
      --border: #dbe3ee;
      --border-strong: #cbd5e1;
      --danger: #dc2626;
      --danger-soft: #fee2e2;
      --success: #059669;
      --success-soft: #d1fae5;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 9px;
      --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 10px 25px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 48px;
      line-height: 1.5;
    }

    /* الهيدر العلوي */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 80;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      padding: 12px 18px;
    }

    .header-inner {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }

    .brand-box {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #ffffff;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 1.15rem;
      box-shadow: var(--shadow-sm);
    }

    .brand-name {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .brand-tagline {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .header-nav {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      border: 1px solid var(--border);
      background-color: var(--bg-card);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background-color 0.18s ease, border-color 0.18s ease, transform 0.15s ease;
    }

    .btn:hover {
      background-color: var(--bg-soft);
      border-color: var(--border-strong);
      transform: translateY(-1px);
    }

    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }

    .btn-primary {
      background-color: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
      border-color: var(--primary-hover);
    }

    .btn-accent {
      background-color: var(--accent-soft);
      border-color: #99f6e4;
      color: var(--accent);
    }

    .btn-accent:hover {
      background-color: #99f6e4;
    }

    .btn-danger {
      background-color: var(--danger-soft);
      border-color: #fecaca;
      color: var(--danger);
    }

    .btn-danger:hover {
      background-color: var(--danger);
      border-color: var(--danger);
      color: #ffffff;
    }

    .header-avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--border-strong);
    }

    /* الحاوية الرئيسية */
    .page-container {
      max-width: 1280px;
      margin: 18px auto 0;
      padding: 0 18px;
    }

    /* شريط البحث والأزرار العلوية */
    .toolbar-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 12px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
    }

    @media (max-width: 760px) {
      .toolbar-card {
        grid-template-columns: 1fr;
      }
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background-color: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 4px 12px;
    }

    .search-box:focus-within {
      border-color: var(--primary);
      background-color: #ffffff;
    }

    .field-input,
    .field-select,
    .field-textarea {
      width: 100%;
      border: 1px solid var(--border);
      background-color: #ffffff;
      color: var(--text-main);
      padding: 9px 12px;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }

    .search-input-clean {
      width: 100%;
      border: none;
      background: transparent;
      color: var(--text-main);
      padding: 7px 4px;
      font-size: 0.92rem;
      outline: none;
    }

    .field-input:focus,
    .field-select:focus,
    .field-textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .toolbar-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* شريط الفلاتر الأفقي (المدن، الحالات، الترتيب) */
    .filters-row-horizontal {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 10px 14px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 10px;
      overflow-x: auto;
    }

    .filter-slot {
      flex: 1 1 200px;
      min-width: 175px;
      display: flex;
      align-items: center;
      gap: 8px;
      background-color: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 2px 10px;
    }

    .filter-slot .field-select {
      border: none;
      background: transparent;
      padding: 8px 4px;
      box-shadow: none;
      font-weight: 600;
    }

    /* شريط الأقسام الأفقي */
    .categories-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 2px 2px 14px;
      margin-bottom: 8px;
      scrollbar-width: thin;
      scrollbar-color: var(--border-strong) transparent;
    }

    .category-pill {
      flex: 0 0 auto;
      padding: 8px 16px;
      border-radius: 999px;
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-sub);
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.18s ease;
    }

    .category-pill:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .category-pill.active {
      background-color: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
      box-shadow: var(--shadow-sm);
    }

    /* شبكة الإعلانات: 3 إعلانات في كل صف */
    .ads-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    @media (max-width: 980px) {
      .ads-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;
      }
    }

    @media (max-width: 600px) {
      .ads-grid {
        grid-template-columns: 1fr;
        gap: 12px;
      }
    }

    .ad-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      cursor: pointer;
    }

    .ad-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
      border-color: #93c5fd;
    }

    .ad-media {
      position: relative;
      height: 180px;
      background-color: var(--bg-soft);
      border-bottom: 1px solid var(--border);
      overflow: hidden;
    }

    .ad-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .ad-tag-cat {
      position: absolute;
      top: 10px;
      right: 10px;
      background-color: rgba(255, 255, 255, 0.94);
      color: var(--primary);
      border: 1px solid var(--border);
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .ad-tag-owner {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background-color: rgba(15, 23, 42, 0.82);
      color: #ffffff;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 600;
    }

    .ad-body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .ad-title {
      font-size: 1rem;
      font-weight: 800;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ad-price {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--primary);
    }

    .ad-meta {
      margin-top: auto;
      padding-top: 8px;
      border-top: 1px solid var(--bg-soft);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .ad-footer {
      padding: 10px 14px 14px;
      display: flex;
      gap: 8px;
    }

    .ad-footer .btn {
      flex: 1;
      justify-content: center;
      padding: 7px 10px;
      font-size: 0.82rem;
    }

    .empty-box {
      grid-column: 1 / -1;
      text-align: center;
      padding: 48px 20px;
      background-color: var(--bg-card);
      border: 1px dashed var(--border-strong);
      border-radius: var(--radius-lg);
      color: var(--text-muted);
      font-weight: 600;
    }

    /* النوافذ المنبثقة */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 120;
      background-color: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-y: auto;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-dialog {
      width: 100%;
      max-width: 780px;
      max-height: 90vh;
      overflow-y: auto;
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 22px;
      box-shadow: var(--shadow-md);
    }

    .modal-dialog.modal-sm {
      max-width: 440px;
    }

    .modal-dialog.modal-lg {
      max-width: 960px;
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 12px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .modal-heading {
      font-size: 1.08rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .tabs-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }

    .tab-btn {
      padding: 9px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background-color: var(--bg-soft);
      color: var(--text-sub);
      font-weight: 700;
      cursor: pointer;
    }

    .tab-btn.active {
      background-color: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
    }

    .form-row-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 12px;
    }

    .form-field {
      margin-bottom: 12px;
    }

    .form-label {
      display: block;
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--text-sub);
      margin-bottom: 5px;
    }

    .img-preview-wrap {
      margin-top: 8px;
      padding: 8px;
      border: 1px dashed var(--border-strong);
      border-radius: var(--radius-sm);
      background-color: var(--bg-soft);
      display: none;
      justify-content: center;
    }

    .img-preview-wrap img {
      max-height: 170px;
      max-width: 100%;
      object-fit: contain;
      border-radius: 6px;
    }

    /* الملف الشخصي الموسع */
    .profile-layout {
      display: grid;
      grid-template-columns: 270px 1fr;
      gap: 18px;
      align-items: start;
    }

    @media (max-width: 780px) {
      .profile-layout {
        grid-template-columns: 1fr;
      }
    }

    .profile-aside,
    .profile-panel {
      background-color: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px;
    }

    .profile-aside {
      text-align: center;
    }

    .my-ads-grid {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(195px, 1fr));
      gap: 10px;
    }

    .my-ad-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    /* الدردشة */
    .chat-grid {
      display: grid;
      grid-template-columns: 225px 1fr;
      gap: 14px;
      height: 52vh;
      min-height: 320px;
    }

    @media (max-width: 680px) {
      .chat-grid {
        grid-template-columns: 1fr;
        height: auto;
      }
      .chat-peers {
        max-height: 120px;
      }
      .chat-thread {
        height: 250px;
      }
    }

    .chat-peers {
      background-color: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 8px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .peer-item {
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 0.86rem;
      font-weight: 600;
      color: var(--text-sub);
      border: 1px solid transparent;
    }

    .peer-item:hover {
      background-color: #ffffff;
      color: var(--text-main);
    }

    .peer-item.active {
      background-color: var(--primary);
      color: #ffffff;
      font-weight: 700;
    }

    .chat-column {
      display: flex;
      flex-direction: column;
      gap: 8px;
      height: 100%;
    }

    .chat-thread {
      flex: 1;
      background-color: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .msg-item {
      max-width: 80%;
      padding: 9px 12px;
      border-radius: 12px;
      font-size: 0.88rem;
      word-break: break-word;
    }

    .msg-out {
      align-self: flex-start;
      background-color: var(--primary);
      color: #ffffff;
      font-weight: 600;
    }

    .msg-in {
      align-self: flex-end;
      background-color: #ffffff;
      border: 1px solid var(--border);
      color: var(--text-main);
    }

    .msg-meta {
      display: block;
      font-size: 0.68rem;
      opacity: 0.78;
      margin-top: 3px;
    }

    .blocked-bar {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .blocked-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: var(--danger-soft);
      color: var(--danger);
      border: 1px solid #fecaca;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
    }

    /* التنبيهات */
    .toast-stack {
      position: fixed;
      bottom: 16px;
      left: 16px;
      right: 16px;
      z-index: 250;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .toast-msg {
      pointer-events: auto;
      width: 100%;
      max-width: 440px;
      background-color: var(--text-main);
      color: #ffffff;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-md);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 0.86rem;
      font-weight: 700;
    }

    .toast-msg.error {
      background-color: var(--danger);
    }

    .toast-msg.success {
      background-color: var(--success);
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <div class="brand-box" onclick="resetHomeView()">
        <div class="brand-mark">س</div>
        <div>
          <div class="brand-name">رخيص والسوق الشامل</div>
          <div id="authStatusLabel" class="brand-tagline">تصفح حر • نشر ومراسلة فورية</div>
        </div>
      </div>

      <nav class="header-nav">
        <button type="button" class="btn btn-primary" onclick="openAdModal()">+ نشر إعلان</button>
        <button type="button" class="btn btn-accent" onclick="openChatModal()">💬 المحادثات</button>
        <button id="loginModalBtn" type="button" class="btn" onclick="openAuthModal('login')">تسجيل الدخول</button>
        <button id="logoutActionBtn" type="button" class="btn btn-danger" style="display: none;" onclick="logoutAccount()">خروج</button>
        <button type="button" class="btn" onclick="openProfileModal()">
          <img id="headerProfileImg" class="header-avatar" src="https://api.dicebear.com/7.x/avataaars/svg?seed=guest" alt="الصورة الرمزية" />
          <span id="headerProfileName">الملف الشخصي</span>
        </button>
      </nav>
    </div>
  </header>

  <main class="page-container">
    <section class="toolbar-card">
      <div class="search-box">
        <span>🔍</span>
        <input id="searchQueryInput" class="search-input-clean" type="search" placeholder="ابحث عن سيارة، عقار، جهاز، أو أي إعلان..." oninput="renderAdsGrid()" />
      </div>
      <div class="toolbar-actions">
        <button type="button" class="btn btn-primary" onclick="openAdModal()">إضافة إعلان</button>
        <button type="button" class="btn btn-accent" onclick="openChatModal()">الدردشة الصوتية والنصية</button>
        <button type="button" class="btn" onclick="openProfileModal()">إدارة ملفي</button>
      </div>
    </section>

    <section class="filters-row-horizontal">
      <div class="filter-slot">
        <span>📍</span>
        <select id="filterCitySelect" class="field-select" onchange="renderAdsGrid()">
          <option value="">كل المدن</option>
          <option value="دمشق">دمشق</option>
          <option value="حلب">حلب</option>
          <option value="حمص">حمص</option>
          <option value="اللاذقية">اللاذقية</option>
          <option value="أنطاليا">أنطاليا</option>
          <option value="إسطنبول">إسطنبول</option>
        </select>
      </div>

      <div class="filter-slot">
        <span>🏷️</span>
        <select id="filterConditionSelect" class="field-select" onchange="renderAdsGrid()">
          <option value="">كل الحالات</option>
          <option value="جديد">جديد</option>
          <option value="مستعمل">مستعمل</option>
        </select>
      </div>

      <div class="filter-slot">
        <span>↕️</span>
        <select id="sortAdsSelect" class="field-select" onchange="renderAdsGrid()">
          <option value="newest">الأحدث أولاً</option>
          <option value="price-asc">الأقل سعراً</option>
          <option value="price-desc">الأعلى سعراً</option>
        </select>
      </div>
    </section>

    <section id="categoriesStrip" class="categories-strip"></section>
    <section id="adsGridContainer" class="ads-grid"></section>
  </main><!-- نافذة تسجيل الدخول وإنشاء الحساب -->
  <div id="authModalOverlay" class="modal-overlay" onclick="handleModalBackdrop(event)">
    <div class="modal-dialog modal-sm" onclick="event.stopPropagation()">
      <div class="modal-head">
        <div class="modal-heading">تسجيل الدخول وإنشاء الحساب</div>
        <button type="button" class="btn btn-outline" onclick="closeModal()">✕</button>
      </div>

      <div class="tabs-bar">
        <button id="loginTabBtn" type="button" class="tab-btn active" onclick="switchAuthMode('login')">تسجيل الدخول</button>
        <button id="registerTabBtn" type="button" class="tab-btn" onclick="switchAuthMode('register')">إنشاء حساب</button>
      </div>

      <form id="loginAccountForm" onsubmit="submitLogin(event)">
        <div class="form-field">
          <label class="form-label" for="loginUserField">اسم المستخدم</label>
          <input id="loginUserField" class="field-input" type="text" required placeholder="اكتب اسم المستخدم..." />
        </div>
        <div class="form-field">
          <label class="form-label" for="loginPassField">كلمة المرور</label>
          <input id="loginPassField" class="field-input" type="password" required placeholder="••••••••" />
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px;">
          <button type="button" class="btn btn-outline" onclick="closeModal()">إلغاء</button>
          <button type="submit" class="btn btn-primary">دخول</button>
        </div>
      </form>

      <form id="registerAccountForm" style="display: none;" onsubmit="submitRegister(event)">
        <div class="form-field">
          <label class="form-label" for="regUserField">اسم المستخدم</label>
          <input id="regUserField" class="field-input" type="text" required placeholder="اختر اسم مستخدم..." />
        </div>
        <div class="form-field">
          <label class="form-label" for="regPassField">كلمة المرور</label>
          <input id="regPassField" class="field-input" type="password" required placeholder="••••••••" />
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px;">
          <button type="button" class="btn btn-outline" onclick="closeModal()">إلغاء</button>
          <button type="submit" class="btn btn-primary">إنشاء الحساب</button>
        </div>
      </form>
    </div>
  </div>

  <!-- نافذة إضافة وتعديل الإعلان -->
  <div id="adEditorModalOverlay" class="modal-overlay" onclick="handleModalBackdrop(event)">
    <div class="modal-dialog" onclick="event.stopPropagation()">
      <div class="modal-head">
        <div id="adEditorTitle" class="modal-heading">نشر إعلان جديد</div>
        <button type="button" class="btn btn-outline" onclick="closeModal()">✕</button>
      </div>

      <form id="adEditorForm" onsubmit="saveAdItem(event)">
        <input type="hidden" id="editingAdId" />

        <div class="form-row-2">
          <div class="form-field">
            <label class="form-label" for="adTitleInput">عنوان الإعلان</label>
            <input id="adTitleInput" class="field-input" type="text" required placeholder="مثال: سيارة، هاتف، غرفة غسيل..." />
          </div>
          <div class="form-field">
            <label class="form-label" for="adPriceInput">السعر</label>
            <input id="adPriceInput" class="field-input" type="number" min="0" step="any" required placeholder="0" />
          </div>
        </div>

        <div class="form-row-2">
          <div class="form-field">
            <label class="form-label" for="adCategorySelect">القسم</label>
            <select id="adCategorySelect" class="field-select" required></select>
          </div>
          <div class="form-field">
            <label class="form-label" for="adConditionSelect">الحالة</label>
            <select id="adConditionSelect" class="field-select">
              <option value="مستعمل">مستعمل</option>
              <option value="جديد">جديد</option>
            </select>
          </div>
          <div class="form-field">
            <label class="form-label" for="adCurrencySelect">العملة</label>
            <select id="adCurrencySelect" class="field-select">
              <option value="USD">USD ($)</option>
              <option value="TRY">TRY (₺)</option>
              <option value="SYP">SYP</option>
            </select>
          </div>
        </div>

        <div class="form-row-2">
          <div class="form-field">
            <label class="form-label" for="adCityInput">المدينة</label>
            <input id="adCityInput" class="field-input" type="text" placeholder="مثال: دمشق أو أنطاليا..." />
          </div>
          <div class="form-field">
            <label class="form-label" for="adHoodInput">الحي / المنطقة</label>
            <input id="adHoodInput" class="field-input" type="text" placeholder="اختياري..." />
          </div>
        </div>

        <div class="form-field">
          <label class="form-label" for="adDescInput">الوصف والتفاصيل</label>
          <textarea id="adDescInput" class="field-textarea" rows="3" placeholder="اكتب تفاصيل المنتج وحالته ومكان التسليم..."></textarea>
        </div>

        <div class="form-field">
          <label class="form-label" for="adImageFileInput">صورة من الجهاز أو رابط صورة</label>
          <input id="adImageFileInput" class="field-input" type="file" accept="image/*" onchange="onAdImageFileChange(event)" />
          <input id="adImageUrlInput" class="field-input" type="url" placeholder="أو رابط صورة مباشر (https://...)" oninput="onAdImageUrlChange(event)" style="margin-top: 8px;" />
          <div id="adPreviewWrap" class="img-preview-wrap">
            <img id="adPreviewImg" src="" alt="معاينة صورة الإعلان" />
          </div>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px;">
          <button type="button" class="btn btn-outline" onclick="closeModal()">إلغاء</button>
          <button id="saveAdSubmitBtn" type="submit" class="btn btn-primary">حفظ ونشر</button>
        </div>
      </form>
    </div>
  </div>

  <!-- نافذة تفاصيل الإعلان -->
  <div id="adDetailsModalOverlay" class="modal-overlay" onclick="handleModalBackdrop(event)">
    <div class="modal-dialog" onclick="event.stopPropagation()">
      <div class="modal-head">
        <div id="adDetailsTitle" class="modal-heading">تفاصيل الإعلان</div>
        <button type="button" class="btn btn-outline" onclick="closeModal()">✕</button>
      </div>
      <div id="adDetailsBody"></div>
    </div>
  </div>

  <!-- نافذة الدردشة النصية والصوتية وقائمة الحظر -->
  <div id="chatModalOverlay" class="modal-overlay" onclick="handleModalBackdrop(event)">
    <div class="modal-dialog modal-lg" onclick="event.stopPropagation()">
      <div class="modal-head">
        <div id="chatHeaderTitle" class="modal-heading">المحادثات المباشرة</div>
        <div style="display: flex; gap: 8px;">
          <button id="blockPeerBtn" type="button" class="btn btn-danger" onclick="toggleBlockPeer()">🚫 حظر</button>
          <button type="button" class="btn btn-outline" onclick="closeModal()">✕</button>
        </div>
      </div>

      <div class="chat-grid">
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <input
            class="field-input"
            type="text"
            placeholder="اسم مستخدم + Enter..."
            onkeydown="if(event.key==='Enter'){event.preventDefault();selectChatPeer(this.value);this.value='';}"
          />
          <div id="chatPeersList" class="chat-peers"></div>
        </div>

        <div class="chat-column">
          <div id="chatMessagesBox" class="chat-thread"></div>

          <div style="display: flex; flex-wrap: wrap; gap: 6px;">
            <button type="button" class="btn btn-outline" style="padding: 4px 10px; font-size: 0.78rem;" onclick="applyQuickReply('هل المنتج لا يزال متوفراً؟')">متوفر؟</button>
            <button type="button" class="btn btn-outline" style="padding: 4px 10px; font-size: 0.78rem;" onclick="applyQuickReply('ما هو السعر النهائي؟')">السعر النهائي؟</button>
            <button type="button" class="btn btn-outline" style="padding: 4px 10px; font-size: 0.78rem;" onclick="applyQuickReply('ممكن المعاينة والتسليم اليوم؟')">التسليم اليوم؟</button>
          </div>

          <form onsubmit="submitChatMessage(event)" style="display: flex; gap: 8px;">
            <button id="voiceRecBtn" type="button" class="btn btn-accent" onclick="toggleVoiceNote()" title="تسجيل صوتي">🎙️</button>
            <input id="chatMessageInput" class="field-input" type="text" placeholder="اكتب رسالتك..." required />
            <button type="submit" class="btn btn-primary">إرسال</button>
          </form>
        </div>
      </div>

      <div class="blocked-bar">
        <span class="form-label" style="margin: 0;">قائمة المحظورين:</span>
        <div id="blockedUsersList" style="display: flex; flex-wrap: wrap; gap: 6px;"></div>
      </div>
    </div>
  </div>

  <!-- نافذة الملف الشخصي الموسع -->
  <div id="profileModalOverlay" class="modal-overlay" onclick="handleModalBackdrop(event)">
    <div class="modal-dialog modal-lg" onclick="event.stopPropagation()">
      <div class="modal-head">
        <div class="modal-heading">الملف الشخصي الموسع</div>
        <button type="button" class="btn btn-outline" onclick="closeModal()">✕</button>
      </div>

      <div class="profile-layout">
        <aside class="profile-aside">
          <img id="profilePreviewAvatar" src="" alt="الصورة الرمزية" style="width: 104px; height: 104px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary); margin-bottom: 10px;" />
          <div id="profileHandleText" style="font-size: 1rem; font-weight: 800; color: var(--text-main);">زائر</div>
          <div id="profileCityText" style="font-size: 0.82rem; color: var(--primary); margin-top: 3px;">غير محدد</div>
          <div id="profileBioText" style="font-size: 0.82rem; color: var(--text-sub); margin-top: 8px;"></div>
          <div style="margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 0.82rem; color: var(--text-sub);">
            عدد إعلاناتي: <strong id="profileAdsCounter" style="color: var(--primary);">0</strong>
          </div>
        </aside>

        <div class="profile-panel">
          <form onsubmit="saveUserProfile(event)">
            <div class="form-row-2">
              <div class="form-field">
                <label class="form-label" for="profileDisplayNameInput">الاسم الظاهر</label>
                <input id="profileDisplayNameInput" class="field-input" type="text" required placeholder="اكتب اسمك..." />
              </div>
              <div class="form-field">
                <label class="form-label" for="profileCityInput">المدينة</label>
                <input id="profileCityInput" class="field-input" type="text" placeholder="مثال: دمشق أو أنطاليا..." />
              </div>
            </div>

            <div class="form-field">
              <label class="form-label" for="profileBioInput">نبذة تعريفية</label>
              <textarea id="profileBioInput" class="field-textarea" rows="2" placeholder="نبذة قصيرة عنك..."></textarea>
            </div>

            <div class="form-field">
              <label class="form-label" for="profileAvatarFileInput">صورة رمزية من الجهاز</label>
              <input id="profileAvatarFileInput" class="field-input" type="file" accept="image/*" onchange="onProfileAvatarChange(event)" />
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 8px;">
              <button type="button" class="btn btn-outline" onclick="closeModal()">إلغاء</button>
              <button type="submit" class="btn btn-primary">حفظ الملف</button>
            </div>
          </form>

          <div id="profileOwnAdsGrid" class="my-ads-grid"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="toastStack" class="toast-stack"></div>

  <script src="app.js"></script>
</body>
</html>
