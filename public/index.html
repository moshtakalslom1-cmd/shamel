<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رخيص</title>
    <style>
        :root {
            --emerald: #059669;
            --teal: #0d9488;
            --amber: #d97706;
            --coral: #e11d48;
            --indigo: #4f46e5;
            --text-main: #0f172a;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #ecfdf5 0%, #fffbeb 50%, #fff1f2 100%);
            background-size: 250% 250%;
            animation: gradientShift 12s ease infinite;
            color: var(--text-main);
        }

        header {
            background: linear-gradient(270deg, #065f46, #0f766e, #9f1239, #b45309, #065f46);
            background-size: 400% 400%;
            animation: gradientShift 10s ease infinite;
            color: white;
            padding: 0.65rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 16px rgba(15, 23, 42, 0.18);
            position: sticky;
            top: 0;
            z-index: 999;
        }

        .brand-box {
            cursor: pointer;
            padding: 4px 14px;
            border-radius: 999px;
            border: 2px solid #fde68a;
            background: rgba(15, 23, 42, 0.4);
            display: inline-flex;
            align-items: center;
        }

        .brand-name {
            font-size: 1.25rem;
            font-weight: 900;
            background: linear-gradient(90deg, #fef08a, #ffffff, #fda4af, #34d399);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 3s linear infinite;
        }

        .user-section { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .user-badge { font-weight: bold; cursor: pointer; background: rgba(255, 255, 255, 0.2); padding: 4px 9px; border-radius: 6px; font-size: 0.82rem; }

        header button {
            background: linear-gradient(135deg, #f43f5e, #e11d48);
            color: white;
            border: none;
            padding: 0.35rem 0.7rem;
            cursor: pointer;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.8rem;
        }

        .container { max-width: 1200px; margin: 10px auto; padding: 0 10px; }

        .hero-section {
            text-align: center;
            padding: 12px 10px;
            background: rgba(255, 255, 255, 0.94);
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(15, 23, 42, 0.08);
            margin-bottom: 10px;
        }

        .hero-section h1 { margin: 0 0 8px; font-size: 1.1rem; color: #065f46; }

        .search-box { display: flex; flex-wrap: wrap; gap: 6px; max-width: 960px; margin: 0 auto; align-items: center; }
        .search-box input, .search-box select {
            padding: 7px 10px;
            border: 1.5px solid var(--teal);
            border-radius: 7px;
            outline: none;
            background: #fff;
            font-size: 0.85rem;
            box-sizing: border-box;
            flex: 1 1 140px;
        }
        .search-buttons { display: flex; gap: 6px; flex: 0 0 auto; }
        .search-buttons button {
            padding: 7px 12px;
            background: linear-gradient(135deg, #059669, #0d9488);
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
        }
        .search-buttons button.reset-btn { background: linear-gradient(135deg, #f59e0b, #e11d48); }

        .categories-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .categories {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 4px;
            flex: 1 1 auto;
            scrollbar-width: thin;
        }

        .category-card {
            background: rgba(255, 255, 255, 0.96);
            padding: 6px 12px;
            text-align: center;
            border-radius: 8px;
            border-bottom: 3px solid var(--emerald);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
            cursor: pointer;
            flex-shrink: 0;
            transition: transform 0.15s, background 0.15s;
        }
        .category-card:nth-child(2) { border-bottom-color: var(--coral); }
        .category-card:nth-child(3) { border-bottom-color: var(--amber); }
        .category-card:nth-child(4) { border-bottom-color: var(--indigo); }
        .category-card:hover, .category-card.active {
            transform: translateY(-2px);
            background: #ecfdf5;
            font-weight: bold;
        }
        .category-card h3 { margin: 0; font-size: 0.82rem; color: #0f172a; white-space: nowrap; }

        .actions-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
        .actions-bar h2 { margin: 0; font-size: 1rem; color: #0f172a; }
        .btn-primary {
            background: linear-gradient(135deg, #e11d48, #d97706);
            color: white;
            border: none;
            padding: 6px 11px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8rem;
        }

        .profile-banner { display: none; background: #ffffff; border-radius: 10px; padding: 12px; margin-bottom: 12px; border-right: 5px solid var(--emerald); box-shadow: 0 3px 12px rgba(15, 23, 42, 0.1); flex-direction: column; gap: 8px; }
        .profile-banner.visible { display: flex; }

        .ads-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        @media (min-width: 768px) {
            .ads-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 12px;
            }
            .hero-section h1 { font-size: 1.25rem; }
        }

        .ad-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(15, 23, 42, 0.08);
            cursor: pointer;
            transition: transform 0.15s;
            border: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
        }
        .ad-card:hover { transform: translateY(-2px); }
        .ad-img { width: 100%; height: 82px; object-fit: cover; background-color: #e2e8f0; display: block; }
        @media (min-width: 768px) { .ad-img { height: 110px; } }
        .ad-info { padding: 6px 8px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .ad-title { font-size: 0.82rem; font-weight: bold; color: #065f46; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ad-sub { font-size: 0.68rem; color: #64748b; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ad-price { color: #e11d48; font-weight: bold; font-size: 0.84rem; margin: 3px 0; }
        .ad-city { font-size: 0.7rem; color: #334155; border-top: 1px solid #f1f5f9; padding-top: 3px; margin-top: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .toast-container {
            position: fixed;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: calc(100% - 28px);
            max-width: 420px;
            pointer-events: none;
        }

        .toast-item {
            background: #0f172a;
            color: #ffffff;
            padding: 10px 14px;
            border-radius: 10px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.28);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.88rem;
            font-weight: 600;
            border-right: 4px solid var(--emerald);
            pointer-events: auto;
            animation: toastIn 0.2s ease-out;
        }

        .toast-item.warning { border-right-color: var(--amber); }
        .toast-item.error { border-right-color: var(--coral); }

        .toast-badge {
            background: rgba(255, 255, 255, 0.14);
            border-radius: 6px;
            padding: 3px 7px;
            font-size: 0.78rem;
            flex-shrink: 0;
        }

        @keyframes toastIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.7); justify-content: center; align-items: center; overflow-y: auto; z-index: 1000; padding: 10px; }
        .modal-content { background: white; padding: 16px; border-radius: 12px; width: 100%; max-width: 620px; margin: auto; border-top: 5px solid var(--teal); box-shadow: 0 5px 20px rgba(0,0,0,0.3); }
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; margin-bottom: 3px; font-weight: bold; font-size: 0.88rem; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 0.9rem; }
        .modal-buttons { display: flex; justify-content: space-between; gap: 8px; margin-top: 12px; }
        .modal-buttons button { flex: 1; padding: 9px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.9rem; }
        .btn-submit { background: var(--emerald); color: white; }
        .btn-cancel { background: var(--coral); color: white; }

        .ad-details-images { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 10px; padding-bottom: 4px; }
        .ad-details-images img { width: 88px; height: 88px; object-fit: cover; border-radius: 6px; border: 1px solid #cbd5e1; flex-shrink: 0; }

        .comments-section { border-top: 2px solid #e2e8f0; margin-top: 14px; padding-top: 12px; }
        .comment-input-box { display: flex; gap: 6px; margin-bottom: 12px; }
        .comments-list { display: flex; flex-direction: column; gap: 8px; }
        .comment-card { background: #f8fafc; padding: 8px 12px; border-radius: 8px; border-right: 3px solid var(--teal); font-size: 0.88rem; }

        .direct-chat-container { display: flex; flex-direction: column; gap: 10px; height: 100%; }
        .chat-header-info { background: #f1f5f9; padding: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .direct-messages-list { flex-grow: 1; max-height: 280px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 10px; background: #fafafa; border: 1px solid #e2e8f0; border-radius: 8px; }
        .direct-msg { max-width: 80%; padding: 8px 12px; border-radius: 12px; font-size: 0.9rem; line-height: 1.4; }
        .direct-msg.sent { align-self: flex-end; background: var(--emerald); color: white; border-bottom-left-radius: 2px; }
        .direct-msg.received { align-self: flex-start; background: #e2e8f0; color: #0f172a; border-bottom-right-radius: 2px; }
        .chat-input-row { display: flex; gap: 6px; margin-top: 6px; }
    </style>
</head>
<body>

<header>
    <div class="brand-box" onclick="resetFilters()">
        <span class="brand-name">رخيص</span>
    </div>
    <div class="user-section" id="userSection">
        <button type="button" onclick="openModal('loginModal')">تسجيل الدخول</button>
        <button type="button" onclick="openModal('signupModal')">إنشاء حساب</button>
    </div>
</header>

<div class="container">
    <div class="hero-section">
        <h1>اعرض واطلب كل شيء في رخيص بسهولة وأمان</h1>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="ابحث عن منتج أو عنوان...">
            <select id="searchCategory" onchange="updateSearchSubcategories(); applyTopFilter();">
                <option value="الكل">كل الأقسام</option>
                <option value="إلكترونيات">إلكترونيات</option>
                <option value="سيارات">سيارات</option>
                <option value="عقارات">عقارات</option>
                <option value="حيوانات">حيوانات</option>
            </select>
            <select id="searchSubcategory" onchange="applyTopFilter()">
                <option value="الكل">كل الأقسام الفرعية</option>
            </select>
            <select id="searchCity" onchange="applyTopFilter()">
                <option value="الكل">جميع المدن</option>
            </select>
            <div class="search-buttons">
                <button type="button" onclick="applyTopFilter()">بحث</button>
                <button type="button" class="reset-btn" onclick="resetFilters()">الكل</button>
            </div>
        </div>
    </div>

    <div class="categories-row">
        <div class="categories">
            <div class="category-card" data-cat="إلكترونيات" onclick="selectMainCategory('إلكترونيات')">
                <h3>📱 الإلكترونيات</h3>
            </div>
            <div class="category-card" data-cat="سيارات" onclick="selectMainCategory('سيارات')">
                <h3>🚗 السيارات</h3>
            </div>
            <div class="category-card" data-cat="عقارات" onclick="selectMainCategory('عقارات')">
                <h3>🏠 العقارات</h3>
            </div>
            <div class="category-card" data-cat="حيوانات" onclick="selectMainCategory('حيوانات')">
                <h3>🐾 الحيوانات</h3>
            </div>
        </div>

        <div class="actions-bar" style="margin-bottom:0;">
            <div style="display:flex; gap:6px; flex-wrap:wrap;">
                <button type="button" class="btn-primary" onclick="viewMyProfile()" id="profileBtn" style="display:none; background: var(--emerald);">ملفي</button>
                <button type="button" class="btn-primary" onclick="openAllConversationsModal()" id="msgBtn" style="display:none; background: var(--teal);">الرسائل</button>
                <button type="button" class="btn-primary" onclick="checkAuthAndOpenAdModal()">+ إعلان</button>
            </div>
        </div>
    </div>

    <div id="profileBanner" class="profile-banner">
        <div>
            <strong id="profileBannerTitle" style="font-size: 1rem; color: #065f46;"></strong>
            <div id="profileBannerBio" style="font-size: 0.85rem; color: #334155; margin-top: 4px; background: #f8fafc; padding: 6px 10px; border-radius: 6px; border: 1px solid #e2e8f0;"></div>
            <div id="profileBannerSub" style="font-size: 0.78rem; color: #64748b; margin-top: 4px;"></div>
            <div id="editBioBox" style="display:none; margin-top: 8px; gap: 6px;">
                <input type="text" id="bioInput" placeholder="اكتب نبذة تعريفية..." style="padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 6px; flex-grow: 1;">
                <button type="button" class="btn-submit" style="padding: 6px 10px;" onclick="saveBio()">حفظ</button>
            </div>
        </div>
        <div style="display:flex; gap:6px; flex-wrap:wrap;">
            <button type="button" id="editBioBtn" class="btn-primary" style="display:none; background: var(--amber);" onclick="toggleEditBio()">تعديل النبذة</button>
            <button type="button" class="btn-primary" style="background: var(--teal);" onclick="resetFilters()">العودة للكل</button>
        </div>
    </div>

    <div class="actions-bar">
        <h2 id="gridTitle">أحدث الإعلانات</h2>
    </div>
    <div class="ads-grid" id="adsGrid"></div>
</div>

<div id="toastContainer" class="toast-container" aria-live="polite"></div>

<!-- Modals -->
<div id="loginModal" class="modal">
    <div class="modal-content">
        <h2>تسجيل الدخول</h2>
        <form onsubmit="handleLogin(event)">
            <div class="form-group"><label>اسم المستخدم</label><input type="text" id="loginUser" required></div>
            <div class="form-group"><label>كلمة المرور</label><input type="password" id="loginPass" required></div>
            <div class="modal-buttons">
                <button type="submit" class="btn-submit">دخول</button>
                <button type="button" class="btn-cancel" onclick="closeModal('loginModal')">إلغاء</button>
            </div>
        </form>
    </div>
</div>

<div id="signupModal" class="modal">
    <div class="modal-content">
        <h2>إنشاء حساب جديد</h2>
        <form onsubmit="handleSignup(event)">
            <div class="form-group"><label>اسم المستخدم</label><input type="text" id="signupUser" required></div>
            <div class="form-group"><label>كلمة المرور</label><input type="password" id="signupPass" required></div>
            <div class="form-group"><label>نبذة تعريفية</label><input type="text" id="signupBio" placeholder="مثال: تاجر سيارات"></div>
            <div class="modal-buttons">
                <button type="submit" class="btn-submit">تسجيل</button>
                <button type="button" class="btn-cancel" onclick="closeModal('signupModal')">إلغاء</button>
            </div>
        </form>
    </div>
</div>

<div id="adModal" class="modal">
    <div class="modal-content">
        <h2>نشر إعلان جديد</h2>
        <form id="adForm" onsubmit="handleAddAd(event)">
            <div class="form-group">
                <label>القسم الرئيسي</label>
                <select id="adCategory" onchange="populateAdSubcategories()">
                    <option value="إلكترونيات">إلكترونيات</option>
                    <option value="سيارات">سيارات</option>
                    <option value="عقارات">عقارات</option>
                    <option value="حيوانات">حيوانات</option>
                </select>
            </div>
            <div class="form-group"><label>القسم الفرعي</label><select id="adSubcategory"></select></div>
            <div class="form-group"><label>العنوان</label><input type="text" id="adTitle" required></div>
            <div class="form-group"><label>السعر (TL)</label><input type="text" id="adPrice" required></div>
            <div class="form-group"><label>المدينة</label><select id="adCity" required></select></div>
            <div class="form-group"><label>رقم الهاتف</label><input type="text" id="adPhone" required></div>
            <div class="form-group"><label>الصور</label><input type="file" id="adImages" accept="image/*" multiple></div>
            <div class="form-group"><label>الوصف</label><textarea id="adDescription" rows="3"></textarea></div>
            <div class="modal-buttons">
                <button type="submit" class="btn-submit">نشر</button>
                <button type="button" class="btn-cancel" onclick="closeModal('adModal')">إلغاء</button>
            </div>
        </form>
    </div>
</div>

<div id="detailsModal" class="modal">
    <div class="modal-content" style="max-width: 650px;">
        <h2 id="detTitle" style="font-size: 1.35rem; color: #065f46; margin-top:0;"></h2>
        <div class="ad-details-images" id="detImages"></div>
        <div style="font-size: 0.92rem; line-height: 1.5;">
            <p><strong>القسم:</strong> <span id="detCategory"></span> - <span id="detSubcategory"></span></p>
            <p><strong>السعر:</strong> <span id="detPrice" style="color:#e11d48; font-weight:bold; font-size: 1.05rem;"></span></p>
            <p><strong>المدينة:</strong> <span id="detCity"></span></p>
            <p><strong>الهاتف:</strong> <span id="detPhone"></span></p>
            <div style="background: #f1f5f9; padding: 10px; border-radius: 8px; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;">
                <span><strong>المعلن:</strong> <span id="detUser" style="color:var(--emerald); font-weight:bold;"></span></span>
                <div style="display:flex; gap:6px; flex-wrap:wrap;">
                    <button type="button" class="btn-submit" style="background:var(--emerald);" onclick="viewProfileOf(document.getElementById('detUser').innerText)">👤 الملف الشخصي</button>
                    <button type="button" class="btn-submit" style="background:var(--teal);" onclick="openDirectChat(document.getElementById('detUser').innerText)">💬 مراسلة مباشرة</button>
                </div>
            </div>
        </div>
        <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 12px 0;">
        <div>
            <strong>الوصف:</strong>
            <p id="detDesc" style="white-space: pre-wrap; background: #fff5f5; padding: 10px; border-radius: 6px; border-right: 4px solid var(--coral); margin-top: 6px; font-size: 0.92rem;"></p>
        </div>

        <div class="comments-section">
            <h3 style="font-size: 1.1rem; color: #065f46; margin-top:0;">التعليقات</h3>
            <div class="comment-input-box">
                <input type="text" id="commentInput" placeholder="اكتب تعليقاً عاماً على الإعلان..." style="flex-grow: 1; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px;">
                <button type="button" class="btn-submit" style="padding: 8px 16px;" onclick="addComment()">نشر</button>
            </div>
            <div class="comments-list" id="commentsList"></div>
        </div>

        <button type="button" class="btn-cancel" style="width:100%; margin-top:16px; padding: 10px;" onclick="closeModal('detailsModal')">إغلاق</button>
    </div>
</div>

<div id="directChatModal" class="modal">
    <div class="modal-content" style="max-width: 550px; height: 85vh; display: flex; flex-direction: column;">
        <div class="chat-header-info">
            <div>
                <span style="font-size: 0.8rem; color: #64748b;">المحادثة مع</span>
                <h3 id="chatTargetUser" style="margin:0; font-size: 1.2rem; color: #0f766e;"></h3>
            </div>
            <button type="button" class="btn-submit" style="background:var(--emerald); font-size: 0.85rem;" onclick="viewProfileOf(document.getElementById('chatTargetUser').innerText)">زيارة الملف</button>
        </div>

        <div class="direct-messages-list" id="directMessagesList"></div>

        <div class="chat-input-row">
            <input type="text" id="directChatInput" placeholder="اكتب رسالتك هنا..." style="flex-grow: 1; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px;">
            <button type="button" class="btn-submit" style="padding: 10px 20px;" onclick="sendDirectMessage()">إرسال</button>
        </div>
        <button type="button" class="btn-cancel" style="width:100%; margin-top:10px; padding: 8px;" onclick="closeModal('directChatModal')">إنهاء المحادثة</button>
    </div>
</div>

<div id="allConversationsModal" class="modal">
    <div class="modal-content" style="max-width: 600px;">
        <h2 style="margin-top:0; font-size: 1.3rem;">رسائلي ومحادثاتي</h2>
        <div id="conversationsList" style="max-height: 350px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 10px; background: #f8fafc; border-radius: 8px;"></div>
        <button type="button" class="btn-cancel" style="width:100%; margin-top:12px; padding: 10px;" onclick="closeModal('allConversationsModal')">إغلاق</button>
    </div>
</div>

<script>
    const SYRIAN_CITIES = ['دمشق', 'ريف دمشق', 'حلب', 'حمص', 'حماة', 'اللاذقية', 'طرطوس', 'إدلب', 'الرقة', 'دير الزور', 'الحسكة', 'درعا', 'السويداء', 'القنيطرة'];
    const SUBCATEGORIES = {
        'إلكترونيات': ['هواتف', 'حواسيب', 'شاشات', 'أجهزة منزلية', 'إكسسوارات'],
        'سيارات': ['سيارات الركوب', 'دراجات نارية', 'مركبات تجارية وشاحنات', 'قطع غيار'],
        'عقارات': ['شقق', 'فلل ومنازل', 'أراضي', 'محلات ومكاتب'],
        'حيوانات': ['طيور', 'قطط وكلاب', 'أغنام ومواشٍ', 'مستلزمات وأعلاف']
    };

    let currentUser = null;
    let activeCategory = 'الكل';
    let activeSubcategory = 'الكل';
    let activeCity = 'الكل';
    let activeProfileUser = '';
    let currentAdIdForDetails = null;
    let currentChatTarget = '';

    function showToast(message, type = 'success', icon = '✅') {
        const container = document.getElementById('toastContainer');
        if (!container) return;
        const item = document.createElement('div');
        item.className = `toast-item ${type}`;
        item.innerHTML = `<span class="toast-badge">${icon}</span><span>${message}</span>`;
        container.appendChild(item);
        setTimeout(() => {
            item.style.opacity = '0';
            item.style.transform = 'translateY(8px)';
            item.style.transition = 'all 0.2s ease';
            setTimeout(() => item.remove(), 220);
        }, 2800);
    }

    function populateCitiesDropdowns() {
        const searchCityEl = document.getElementById('searchCity');
        const adCityEl = document.getElementById('adCity');
        if (searchCityEl) searchCityEl.innerHTML = '<option value="الكل">جميع المدن</option>';
        if (adCityEl) adCityEl.innerHTML = '<option value="">اختر المدينة...</option>';
        SYRIAN_CITIES.forEach(city => {
            if (searchCityEl) searchCityEl.innerHTML += `<option value="${city}">${city}</option>`;
            if (adCityEl) adCityEl.innerHTML += `<option value="${city}">${city}</option>`;
        });
    }

    function openModal(id) { const el = document.getElementById(id); if (el) el.style.display = 'flex'; }
    function closeModal(id) { const el = document.getElementById(id); if (el) el.style.display = 'none'; }
    window.addEventListener('click', function(event) {
        if (event.target && event.target.classList && event.target.classList.contains('modal')) {
            event.target.style.display = 'none';
        }
    });

    function populateAdSubcategories() {
        const catSelect = document.getElementById('adCategory');
        if (!catSelect) return;
        const cat = catSelect.value;
        const subSelect = document.getElementById('adSubcategory');
        if (!subSelect) return;
        subSelect.innerHTML = '';
        (SUBCATEGORIES[cat] || ['عام']).forEach(sub => subSelect.innerHTML += `<option value="${sub}">${sub}</option>`);
    }

    function updateSearchSubcategories() {
        const catSelect = document.getElementById('searchCategory');
        if (!catSelect) return;
        const cat = catSelect.value;
        const subSelect = document.getElementById('searchSubcategory');
        if (!subSelect) return;
        subSelect.innerHTML = '<option value="الكل">كل الأقسام الفرعية</option>';
        if (SUBCATEGORIES[cat]) {
            SUBCATEGORIES[cat].forEach(sub => subSelect.innerHTML += `<option value="${sub}">${sub}</option>`);
        }
    }

    async function updateProfileBanner(username = '', count = 0) {
        const banner = document.getElementById('profileBanner');
        if (!banner) return;
        if (!username) {
            banner.classList.remove('visible');
            const editBox = document.getElementById('editBioBox');
            if (editBox) editBox.style.display = 'none';
            return;
        }
        banner.classList.add('visible');
        document.getElementById('profileBannerTitle').innerText = `👤 الملف الشخصي لـ: ${username}`;
        document.getElementById('profileBannerSub').innerText = `إجمالي الإعلانات: ${count}`;
        const editBtn = document.getElementById('editBioBtn');
        if (editBtn) editBtn.style.display = (currentUser && currentUser === username) ? 'inline-block' : 'none';

        try {
            const res = await fetch(`/api/users/${encodeURIComponent(username)}`);
            if (res.ok) {
                const info = await res.json();
                document.getElementById('profileBannerBio').innerText = `📝 ${info.bio} • انضم: ${info.joinedAt}`;
                const bioInput = document.getElementById('bioInput');
                if (bioInput) bioInput.value = info.bio;
            }
        } catch (err) {
            document.getElementById('profileBannerBio').innerText = `معلن في منصة رخيص`;
        }
    }

    function toggleEditBio() {
        const box = document.getElementById('editBioBox');
        if (box) box.style.display = box.style.display === 'flex' ? 'none' : 'flex';
    }

    async function saveBio() {
        if (!currentUser || activeProfileUser !== currentUser) return;
        const bioInput = document.getElementById('bioInput');
        if (!bioInput) return;
        const bio = bioInput.value;
        const res = await fetch(`/api/users/${encodeURIComponent(currentUser)}/bio`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ bio })
        });
        const data = await res.json();
        showToast(data.message || 'تم حفظ النبذة بنجاح', res.ok ? 'success' : 'error', res.ok ? '📝' : '⚠️');
        if (res.ok) {
            const editBox = document.getElementById('editBioBox');
            if (editBox) editBox.style.display = 'none';
            const searchInput = document.getElementById('searchInput');
            loadAds(activeCategory, activeSubcategory, searchInput ? searchInput.value : '', activeProfileUser, activeCity);
        }
    }

    function selectMainCategory(cat) {
        activeCategory = cat; activeSubcategory = 'الكل'; activeProfileUser = '';
        updateProfileBanner('');
        const searchCat = document.getElementById('searchCategory');
        if (searchCat) searchCat.value = cat;
        updateSearchSubcategories();
        const searchSub = document.getElementById('searchSubcategory');
        if (searchSub) searchSub.value = 'الكل';
        document.querySelectorAll('.category-card').forEach(card => card.classList.toggle('active', card.dataset.cat === cat));
        applyTopFilter();
    }

    function applyTopFilter() {
        const searchInput = document.getElementById('searchInput');
        const q = searchInput ? searchInput.value : '';
        const searchCat = document.getElementById('searchCategory');
        const cat = searchCat ? searchCat.value : 'الكل';
        const searchSub = document.getElementById('searchSubcategory');
        const sub = searchSub ? searchSub.value : 'الكل';
        const searchCity = document.getElementById('searchCity');
        const city = searchCity ? searchCity.value : 'الكل';

        activeCategory = cat; activeSubcategory = sub; activeCity = city; activeProfileUser = '';
        updateProfileBanner('');

        let titleText = 'أحدث الإعلانات';
        if (cat !== 'الكل' && sub !== 'الكل') titleText = `إعلانات ${cat} - ${sub}`;
        else if (cat !== 'الكل') titleText = `إعلانات قسم ${cat}`;
        if (city !== 'الكل') titleText += ` في ${city}`;
        const gridTitle = document.getElementById('gridTitle');
        if (gridTitle) gridTitle.innerText = titleText;
        document.querySelectorAll('.category-card').forEach(card => card.classList.toggle('active', card.dataset.cat === cat));
        loadAds(activeCategory, activeSubcategory, q, '', activeCity);
    }

    function resetFilters() {
        activeCategory = 'الكل'; activeSubcategory = 'الكل'; activeCity = 'الكل'; activeProfileUser = '';
        updateProfileBanner('');
        const gridTitle = document.getElementById('gridTitle');
        if (gridTitle) gridTitle.innerText = 'أحدث الإعلانات';
        const searchInput = document.getElementById('searchInput');
        if (searchInput) searchInput.value = '';
        const searchCat = document.getElementById('searchCategory');
        if (searchCat) searchCat.value = 'الكل';
        updateSearchSubcategories();
        const searchCity = document.getElementById('searchCity');
        if (searchCity) searchCity.value = 'الكل';
        document.querySelectorAll('.category-card').forEach(card => card.classList.remove('active'));
        loadAds('الكل', 'الكل', '', '', 'الكل');
    }

    async function handleSignup(e) {
        e.preventDefault();
        const signupUser = document.getElementById('signupUser');
        const signupPass = document.getElementById('signupPass');
        const signupBio = document.getElementById('signupBio');
        if (!signupUser || !signupPass) return;
        const res = await fetch('/api/signup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: signupUser.value, password: signupPass.value, bio: signupBio ? signupBio.value : '' })
        });
        const data = await res.json();
        showToast(data.message || (res.ok ? 'تم إنشاء الحساب بنجاح' : 'تعذر الإنشاء'), res.ok ? 'success' : 'error', res.ok ? '🎉' : '⚠️');
        if (res.ok) {
            closeModal('signupModal');
            currentUser = signupUser.value;
            updateUserUI();
        }
    }

    async function handleLogin(e) {
        e.preventDefault();
        const loginUser = document.getElementById('loginUser');
        const loginPass = document.getElementById('loginPass');
        if (!loginUser || !loginPass) return;
        const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: loginUser.value, password: loginPass.value })
        });
        const data = await res.json();
        showToast(data.message || (res.ok ? 'تم تسجيل الدخول' : 'بيانات غير صحيحة'), res.ok ? 'success' : 'error', res.ok ? '🔐' : '⚠️');
        if (res.ok) {
            closeModal('loginModal');
            currentUser = loginUser.value;
            updateUserUI();
        }
    }

    function updateUserUI() {
        const userSection = document.getElementById('userSection');
        const msgBtn = document.getElementById('msgBtn');
        const profileBtn = document.getElementById('profileBtn');
        if (!userSection) return;
        if (currentUser) {
            userSection.innerHTML = `<span class="user-badge" onclick="viewMyProfile()">👤 ${currentUser}</span><button type="button" onclick="logout()">خروج</button>`;
            if (msgBtn) msgBtn.style.display = 'inline-block';
            if (profileBtn) profileBtn.style.display = 'inline-block';
        } else {
            userSection.innerHTML = `<button type="button" onclick="openModal('loginModal')">دخول</button><button type="button" onclick="openModal('signupModal')">حساب</button>`;
            if (msgBtn) msgBtn.style.display = 'none';
            if (profileBtn) profileBtn.style.display = 'none';
        }
    }

    function logout() {
        currentUser = null;
        updateUserUI();
        closeModal('detailsModal');
        closeModal('directChatModal');
        closeModal('allConversationsModal');
        if (activeProfileUser) resetFilters();
        showToast('تم تسجيل الخروج', 'warning', '👋');
    }

    function viewMyProfile() { if (currentUser) viewProfileOf(currentUser); }

    function checkAuthAndOpenAdModal() {
        if (!currentUser) {
            showToast('يرجى تسجيل الدخول أولاً', 'warning', '🔑');
            openModal('loginModal');
            return;
        }
        populateAdSubcategories();
        openModal('adModal');
    }

    async function handleAddAd(e) {
        e.preventDefault();
        const adCategory = document.getElementById('adCategory');
        const adSubcategory = document.getElementById('adSubcategory');
        const adTitle = document.getElementById('adTitle');
        const adPrice = document.getElementById('adPrice');
        const adCity = document.getElementById('adCity');
        const adPhone = document.getElementById('adPhone');
        const adDescription = document.getElementById('adDescription');
        const adImages = document.getElementById('adImages');

        if (!adCategory || !adTitle || !adPrice || !adCity || !adPhone) return;
        const formData = new FormData();
        formData.append('category', adCategory.value);
        formData.append('subcategory', adSubcategory ? adSubcategory.value : 'عام');
        formData.append('title', adTitle.value);
        formData.append('price', adPrice.value);
        formData.append('city', adCity.value);
        formData.append('phone', adPhone.value);
        formData.append('description', adDescription ? adDescription.value : '');
        formData.append('username', currentUser);
        if (adImages && adImages.files) {
            for (let i = 0; i < adImages.files.length; i++) formData.append('images', adImages.files[i]);
        }

        const res = await fetch('/api/ads', { method: 'POST', body: formData });
        const data = await res.json();
        showToast(data.message || (res.ok ? 'تم نشر الإعلان' : 'حدث خطأ'), res.ok ? 'success' : 'error', res.ok ? '📢' : '⚠️');
        if (res.ok) {
            closeModal('adModal');
            document.getElementById('adForm')?.reset();
            populateCitiesDropdowns();
            populateAdSubcategories();
            const searchInput = document.getElementById('searchInput');
            loadAds(activeCategory, activeSubcategory, searchInput ? searchInput.value : '', activeProfileUser, activeCity);
        }
    }

    async function loadAds(category = 'الكل', subcategory = 'الكل', q = '', filterUser = '', city = 'الكل') {
        const url = `/api/ads?category=${encodeURIComponent(category)}&subcategory=${encodeURIComponent(subcategory)}&q=${encodeURIComponent(q)}&username=${encodeURIComponent(filterUser)}&city=${encodeURIComponent(city)}`;
        const res = await fetch(url);
        const ads = await res.json();
        const grid = document.getElementById('adsGrid');
        if (!grid) return;
        grid.innerHTML = '';
        if (filterUser) await updateProfileBanner(filterUser, ads.length);
        else updateProfileBanner('');

        if (!ads.length) {
            grid.innerHTML = '<p style="color:#475569; font-size: 0.9rem; text-align: center; grid-column: 1/-1; padding: 15px;">لا توجد إعلانات مطابقة.</p>';
            return;
        }

        ads.forEach(ad => {
            const firstImage = ad.images && ad.images.length > 0 ? ad.images[0] : '';
            grid.innerHTML += `
                <div class="ad-card" onclick="viewAdDetails('${ad.id}')">
                    <img src="${firstImage}" class="ad-img" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'120\\' height=\\'100\\'><rect width=\\'120\\' height=\\'100\\' fill=\\'%23e2e8f0\\'/><text x=\\'50%\\' y=\\'50%\\' dominant-baseline=\\'middle\\' text-anchor=\\'middle\\' font-size=\\'11\\'>بلا صورة</text></svg>'">
                    <div class="ad-info">
                        <div class="ad-title">${ad.title}</div>
                        <div class="ad-sub">${ad.category} • ${ad.subcategory || ''}</div>
                        <div class="ad-price">${ad.price} TL</div>
                        <div class="ad-city">📍 ${ad.city}</div>
                    </div>
                </div>
            `;
        });
    }

    async function viewAdDetails(id) {
        const res = await fetch(`/api/ads/${id}`);
        const ad = await res.json();
        if (res.ok) {
            currentAdIdForDetails = ad.id;
            document.getElementById('detTitle').innerText = ad.title;
            document.getElementById('detCategory').innerText = ad.category;
            document.getElementById('detSubcategory').innerText = ad.subcategory || 'عام';
            document.getElementById('detPrice').innerText = ad.price + ' TL';
            document.getElementById('detCity').innerText = ad.city;
            document.getElementById('detPhone').innerText = ad.phone;
            document.getElementById('detUser').innerText = ad.username;
            document.getElementById('detDesc').innerText = ad.description;

            const imgsDiv = document.getElementById('detImages');
            if (imgsDiv) {
                imgsDiv.innerHTML = '';
                (ad.images || []).forEach(img => imgsDiv.innerHTML += `<img src="${img}">`);
            }
            loadComments(ad.id);
            openModal('detailsModal');
        }
    }

    async function loadComments(adId) {
        const res = await fetch(`/api/ads/${adId}/comments`);
        const comments = await res.json();
        const list = document.getElementById('commentsList');
        if (!list) return;
        list.innerHTML = '';
        if (!comments.length) {
            list.innerHTML = '<p style="color:#888; font-size: 0.85rem; text-align: center;">لا توجد تعليقات بعد. كن أول من يعلق!</p>';
            return;
        }
        comments.forEach(c => {
            list.innerHTML += `
                <div class="comment-card">
                    <div style="font-weight:bold; color:#0f766e; font-size: 0.85rem; margin-bottom:4px;">👤 ${c.user} <span style="font-weight:normal; font-size: 0.75rem; color:#888;">(${c.timestamp})</span></div>
                    <div>${c.text}</div>
                </div>
            `;
        });
    }

    async function addComment() {
        if (!currentUser) {
            showToast('يرجى تسجيل الدخول لإضافة تعليق', 'warning', '🔑');
            openModal('loginModal');
            return;
        }
        const input = document.getElementById('commentInput');
        if (!input || !currentAdIdForDetails) return;
        const text = input.value.trim();
        if (!text) return;

        const res = await fetch(`/api/ads/${currentAdIdForDetails}/comments`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user: currentUser, text })
        });
        if (res.ok) {
            input.value = '';
            showToast('تمت إضافة التعليق', 'success', '💬');
            loadComments(currentAdIdForDetails);
        }
    }

    function openDirectChat(targetUser) {
        if (!currentUser) {
            showToast('يرجى تسجيل الدخول للمراسلة', 'warning', '🔑');
            openModal('loginModal');
            return;
        }
        if (currentUser === targetUser) {
            showToast('لا يمكنك مراسلة نفسك', 'warning', '⚠️');
            return;
        }
        currentChatTarget = targetUser;
        document.getElementById('chatTargetUser').innerText = targetUser;
        closeModal('detailsModal');
        closeModal('allConversationsModal');
        loadDirectMessages(targetUser);
        openModal('directChatModal');
    }

    async function loadDirectMessages(targetUser) {
        const res = await fetch(`/api/chat/messages?user1=${encodeURIComponent(currentUser)}&user2=${encodeURIComponent(targetUser)}`);
        const msgs = await res.json();
        const list = document.getElementById('directMessagesList');
        if (!list) return;
        list.innerHTML = '';
        if (!msgs.length) {
            list.innerHTML = '<p style="color:#888; font-size: 0.85rem; text-align: center;">ابدأ المحادثة الآن!</p>';
            return;
        }
        msgs.forEach(m => {
            const isMe = m.sender === currentUser;
            list.innerHTML += `
                <div class="direct-msg ${isMe ? 'sent' : 'received'}">
                    <div>${m.text}</div>
                    <div style="font-size: 0.68rem; opacity: 0.8; text-align: left; margin-top:4px;">${m.timestamp}</div>
                </div>
            `;
        });
        list.scrollTop = list.scrollHeight;
    }

    async function sendDirectMessage() {
        const input = document.getElementById('directChatInput');
        if (!input || !currentChatTarget || !currentUser) return;
        const text = input.value.trim();
        if (!text) return;

        const res = await fetch('/api/chat/messages', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sender: currentUser, receiver: currentChatTarget, text })
        });
        if (res.ok) {
            input.value = '';
            loadDirectMessages(currentChatTarget);
        }
    }

    async function openAllConversationsModal() {
        if (!currentUser) return;
        const res = await fetch(`/api/chat/conversations?user=${encodeURIComponent(currentUser)}`);
        const convos = await res.json();
        const list = document.getElementById('conversationsList');
        if (!list) return;
        list.innerHTML = '';
        if (!convos.length) {
            list.innerHTML = '<p style="color:#888; font-size: 0.9rem; text-align: center;">لا توجد محادثات نشطة.</p>';
        } else {
            convos.forEach(c => {
                const otherUser = c.participants.find(p => p !== currentUser);
                list.innerHTML += `
                    <div style="background:white; padding:10px; border-radius:8px; border-right:4px solid var(--teal); display:flex; justify-content:space-between; align-items:center; gap:8px;" onclick="openDirectChat('${otherUser}')">
                        <div>
                            <div style="font-weight:bold; font-size: 1rem; color:#065f46;">👤 ${otherUser}</div>
                            <div style="font-size: 0.85rem; color:#64748b; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width: 250px;">آخر رسالة: ${c.lastMessage}</div>
                        </div>
                        <button type="button" class="btn-submit" style="background:var(--emerald);">فتح المحادثة</button>
                    </div>
                `;
            });
        }
        openModal('allConversationsModal');
    }

    async function viewProfileOf(username) {
        if (!username) return;
        activeProfileUser = username; activeCategory = 'الكل'; activeSubcategory = 'الكل'; activeCity = 'الكل';
        closeModal('detailsModal');
        closeModal('directChatModal');
        closeModal('allConversationsModal');

        document.querySelectorAll('.category-card').forEach(card => card.classList.remove('active'));
        const searchCat = document.getElementById('searchCategory'); if (searchCat) searchCat.value = 'الكل';
        const searchCity = document.getElementById('searchCity'); if (searchCity) searchCity.value = 'الكل';
        updateSearchSubcategories();

        const gridTitle = document.getElementById('gridTitle');
        if (gridTitle) gridTitle.innerText = 'إعلانات ' + username;
        loadAds('الكل', 'الكل', '', username, 'الكل');
    }

    populateCitiesDropdowns();
    populateAdSubcategories();
    loadAds('الكل', 'الكل', '', '', 'الكل');
</script>

</body>
</html>
