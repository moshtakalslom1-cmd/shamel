<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>رخيص - سوق الإعلانات</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <style>
    :root {
      --primary: #14362b;
      --accent: #e11d48;
      --accent-hover: #be123c;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
    }

    body {
      background-color: #eef2f6;
      color: var(--text);
      line-height: 1.45;
    }

    header {
      background: linear-gradient(90deg, #090d16 0%, #132a23 50%, #090d16 100%);
      color: #fff;
      padding: 11px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 200;
      border-bottom: 1px solid rgba(56, 189, 248, 0.35);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
    }

    .brand-logo {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 20px;
      border-radius: 999px;
      background: linear-gradient(135deg, #1a1025 0%, #2b1320 55%, #10242c 100%);
      border: 1.5px solid rgba(56, 189, 248, 0.9);
      cursor: pointer;
      user-select: none;
      box-shadow:
        0 0 14px rgba(56, 189, 248, 0.65),
        0 0 28px rgba(244, 63, 94, 0.4),
        inset 0 0 10px rgba(250, 204, 21, 0.3);
      animation: logoGlow 2.6s infinite alternate ease-in-out;
    }

    .brand-logo .brand-text {
      font-size: 1.32rem;
      font-weight: 900;
      background: linear-gradient(90deg, #ffffff 0%, #fde047 45%, #7dd3fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-logo .brand-spark {
      font-size: 1rem;
      filter: drop-shadow(0 0 8px #facc15);
    }

    @keyframes logoGlow {
      0% {
        box-shadow: 0 0 10px rgba(56, 189, 248, 0.55), 0 0 22px rgba(244, 63, 94, 0.35);
      }
      100% {
        box-shadow: 0 0 18px rgba(56, 189, 248, 0.95), 0 0 36px rgba(250, 204, 21, 0.55);
      }
    }

    .user-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .user-chip {
      background: rgba(56, 189, 248, 0.14);
      border: 1px solid rgba(56, 189, 248, 0.45);
      color: #e0f2fe;
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 0.86rem;
      font-weight: 700;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 7px;
      padding: 7px 13px;
      font-size: 0.86rem;
      font-weight: 700;
      transition: transform 0.12s ease, background 0.15s ease;
    }

    button:active {
      transform: scale(0.97);
    }

    .btn-green { background: #16a34a; color: #fff; }
    .btn-green:hover { background: #15803d; }
    .btn-red { background: var(--accent); color: #fff; }
    .btn-red:hover { background: var(--accent-hover); }
    .btn-blue { background: #0284c7; color: #fff; }
    .btn-blue:hover { background: #0369a1; }
    .btn-outline { background: #fff; color: #0f172a; border: 1px solid var(--border); }
    .btn-outline:hover { background: #f1f5f9; }

    .search-section {
      background: #fff;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }

    .search-grid {
      max-width: 1320px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: center;
    }

    .search-grid input,
    .search-grid select {
      padding: 8px 11px;
      border: 1px solid var(--border);
      border-radius: 7px;
      font-size: 0.88rem;
      background: #fff;
      min-width: 135px;
    }

    .search-grid input[type="text"] {
      flex: 1;
      min-width: 190px;
    }

    .action-bar {
      max-width: 1320px;
      margin: 10px auto 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    .categories-bar {
      max-width: 1320px;
      margin: 12px auto 0;
      padding: 0 16px;
      display: flex;
      gap: 7px;
      overflow-x: auto;
      flex-wrap: wrap;
      justify-content: center;
    }

    .cat-pill {
      background: #fff;
      border: 1px solid var(--border);
      padding: 5px 13px;
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
    }

    .cat-pill.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .container {
      max-width: 1360px;
      margin: 14px auto 40px;
      padding: 0 16px;
    }

    .top-list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }

    /* 4 إعلانات في الصف الواحد على الشاشات الكبيرة */
    .ads-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    @media (max-width: 1100px) {
      .ads-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 820px) {
      .ads-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 520px) {
      .ads-grid {
        grid-template-columns: 1fr;
      }
    }

    .ad-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.05);
    }

    .ad-img-wrap {
      position: relative;
    }

    .ad-img {
      width: 100%;
      height: 145px;
      object-fit: cover;
      background: #e2e8f0;
      display: block;
      cursor: zoom-in;
    }

    .fav-btn {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(255, 255, 255, 0.94);
      color: #e11d48;
      border-radius: 999px;
      width: 30px;
      height: 30px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.92rem;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.16);
    }

    .ad-body {
      padding: 9px 10px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .badges-row {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .badge {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 5px;
      background: #f1f5f9;
      color: #334155;
    }

    .badge-neg {
      background: #fef9c3;
      color: #854d0e;
    }

    .ad-title {
      font-size: 0.94rem;
      font-weight: 800;
      color: #0f172a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ad-price {
      font-size: 0.94rem;
      font-weight: 800;
      color: #15803d;
    }

    .ad-meta {
      font-size: 0.74rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
    }

    .ad-meta:hover {
      color: #0284c7;
      text-decoration: underline;
    }

    .ad-desc {
      font-size: 0.78rem;
      color: #334155;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .preset-msgs {
      padding: 6px 10px;
      background: #f8fafc;
      border-top: 1px dashed #cbd5e1;
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .preset-btn {
      font-size: 0.7rem;
      padding: 4px 7px;
      border-radius: 5px;
      background: #e0f2fe;
      color: #0369a1;
      font-weight: 700;
      text-align: right;
    }

    .preset-btn:hover {
      background: #bae6fd;
    }

    .ad-actions {
      padding: 7px 10px;
      border-top: 1px solid #e2e8f0;
      background: #f1f5f9;
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .ad-actions button {
      padding: 5px 8px;
      font-size: 0.74rem;
    }

    /* أيقونة إشعار داخل التطبيق بدل رسائل المتصفح */
    .toast-banner {
      position: fixed;
      bottom: 18px;
      left: 18px;
      background: #0f172a;
      color: #fff;
      padding: 10px 15px;
      border-radius: 10px;
      font-size: 0.86rem;
      font-weight: 700;
      z-index: 10001;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      display: none;
      align-items: center;
      gap: 8px;
      border-right: 4px solid #38bdf8;
      max-width: 360px;
    }

    .toast-banner.error {
      background: #450a0a;
      border-right-color: #f87171;
      color: #fee2e2;
    }

    .toast-banner.success {
      background: #052e16;
      border-right-color: #4ade80;
      color: #dcfce7;
    }

    .toast-icon {
      font-size: 1.05rem;
      line-height: 1;
      flex-shrink: 0;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.68);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 9999;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      background: #fff;
      border-radius: 12px;
      width: 100%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      display: flex;
      flex-direction: column;
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    .close-x {
      width: 32px;
      height: 32px;
      padding: 0;
      border-radius: 50%;
      background: #e2e8f0;
      color: #0f172a;
      font-size: 1.15rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .field {
      margin-bottom: 11px;
    }

    .field label {
      display: block;
      font-size: 0.86rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 7px;
      font-size: 0.9rem;
    }

    .img-preview {
      max-width: 100%;
      max-height: 150px;
      margin-top: 8px;
      border-radius: 8px;
      display: none;
    }

    .chat-container {
      display: flex;
      flex: 1;
      height: 350px;
      gap: 12px;
      margin-bottom: 14px;
    }

    .partners-sidebar {
      width: 180px;
      border-left: 1px solid var(--border);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-left: 8px;
    }

    .partner-item {
      padding: 8px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f1f5f9;
      font-weight: 600;
    }

    .partner-item.active {
      background: #0284c7;
      color: #fff;
    }

    .chat-main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      background: #f8fafc;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg-bubble {
      max-width: 82%;
      padding: 10px;
      border-radius: 12px;
      font-size: 0.88rem;
      align-self: flex-start;
      background: #fff;
      border: 1px solid #e2e8f0;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    .msg-bubble.mine {
      align-self: flex-end;
      background: #dcf8c6;
      border-color: #a3e08f;
    }

    .ad-context-card {
      background: #e0f2fe;
      border: 1px solid #bae6fd;
      border-radius: 8px;
      padding: 8px;
      margin-bottom: 8px;
      font-size: 0.8rem;
    }

    .tabs-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }

    .lightbox-img {
      max-width: 95vw;
      max-height: 90vh;
      border-radius: 10px;
    }

    .empty-msg {
      text-align: center;
      padding: 36px 16px;
      color: var(--muted);
      grid-column: 1 / -1;
    }

    .profile-view {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .profile-header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    .profile-avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #0284c7;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      font-weight: bold;
    }

    .profile-info h3 {
      font-size: 1.25rem;
    }

    .profile-info p {
      color: var(--muted);
      font-size: 0.88rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-logo" data-action="reset-all" title="رخيص">
      <span class="brand-spark">⚡</span>
      <span class="brand-text">رخيص</span>
    </div>
    <div class="user-controls" id="authBox"></div>
  </header>

  <section class="search-section">
    <div class="search-grid">
      <input type="text" id="searchQ" placeholder="ابحث عن أي غرض أو إعلان..." />

      <select id="filterCity">
        <option value="all">كل مدن سوريا</option>
        <option value="دمشق">دمشق</option>
        <option value="ريف دمشق">ريف دمشق</option>
        <option value="حلب">حلب</option>
        <option value="حمص">حمص</option>
        <option value="حماة">حماة</option>
        <option value="اللاذقية">اللاذقية</option>
        <option value="طرطوس">طرطوس</option>
        <option value="إدلب">إدلب</option>
        <option value="درعا">درعا</option>
        <option value="دير الزور">دير الزور</option>
        <option value="الحسكة">الحسكة</option>
        <option value="الرقة">الرقة</option>
        <option value="السويداء">السويداء</option>
        <option value="القنيطرة">القنيطرة</option>
      </select>

      <select id="filterCategory">
        <option value="all">كل الأقسام</option>
        <option value="سيارات ومركبات">سيارات ومركبات</option>
        <option value="عقارات">عقارات</option>
        <option value="موبايلات وإلكترونيات">موبايلات وإلكترونيات</option>
        <option value="أثاث ومنزل">أثاث ومنزل</option>
        <option value="حيوانات وطيور">حيوانات وطيور</option>
        <option value="أخرى">أخرى</option>
      </select>

      <select id="filterCondition">
        <option value="all">كل الحالات</option>
        <option value="جديد">جديد</option>
        <option value="مستعمل">مستعمل</option>
      </select>

      <button type="button" class="btn-green" data-action="apply-filters">بحث</button>
      <button type="button" class="btn-outline" data-action="reset-all">إعادة ضبط</button>
    </div>

    <div class="action-bar">
      <button type="button" class="btn-red" data-action="open-create-ad">+ نشر إعلان</button>
      <button type="button" class="btn-blue" data-action="open-inbox">💬 صندوق المحادثات</button>
      <button type="button" class="btn-green" data-action="open-my-profile">👤 ملفي الشخصي</button>
      <button type="button" class="btn-outline" data-action="my-favorites">❤️ المفضلة</button>
    </div>
  </section>

  <div class="categories-bar" id="catBar">
    <span class="cat-pill active" data-cat="all">الكل</span>
    <span class="cat-pill" data-cat="سيارات ومركبات">🚗 سيارات ومركبات</span>
    <span class="cat-pill" data-cat="عقارات">🏠 عقارات</span>
    <span class="cat-pill" data-cat="موبايلات وإلكترونيات">📱 موبايلات وإلكترونيات</span>
    <span class="cat-pill" data-cat="أثاث ومنزل">🛋️ أثاث ومنزل</span>
    <span class="cat-pill" data-cat="حيوانات وطيور">🐾 حيوانات وطيور</span>
    <span class="cat-pill" data-cat="أخرى">📦 أخرى</span>
  </div>

  <main class="container">
    <div class="top-list-header">
      <h2 id="listHeading" style="font-size:1.1rem;">أحدث الإعلانات</h2>
      <div style="display:flex; align-items:center; gap:8px;">
        <span id="adsCounter" style="font-size:0.84rem; color:var(--muted);"></span>
        <select id="sortAds" style="padding:6px 10px; border:1px solid var(--border); border-radius:7px; background:#fff; font-size:0.84rem;">
          <option value="newest">الترتيب: الأحدث</option>
          <option value="price_asc">السعر: من الأقل للأعلى</option>
          <option value="price_desc">السعر: من الأعلى للأقل</option>
          <option value="views">الأكثر مشاهدة</option>
        </select>
      </div>
    </div>

    <div class="ads-grid" id="adsGrid"></div>
  </main>

  <!-- إشعار بأيقونة داخل التطبيق -->
  <div class="toast-banner" id="toastBanner" role="status" aria-live="polite">
    <span class="toast-icon" id="toastIcon">ℹ️</span>
    <span id="toastText"></span>
  </div>

  <!-- Auth Modal -->
  <div class="modal-backdrop" id="authModal">
    <div class="modal-card">
      <div class="modal-head">
        <h3 id="authModalHeading">تسجيل الدخول إلى رخيص</h3>
        <button type="button" class="close-x" data-close="authModal">&times;</button>
      </div>
      <div class="tabs-bar">
        <button type="button" class="btn-green" id="tabLoginBtn" data-action="switch-auth-tab" data-tab="login">تسجيل الدخول</button>
        <button type="button" class="btn-outline" id="tabRegisterBtn" data-action="switch-auth-tab" data-tab="register">إنشاء حساب جديد</button>
      </div>
      <form id="authForm">
        <div class="field">
          <label for="authUsername">اسم المستخدم</label>
          <input type="text" id="authUsername" required placeholder="اكتب اسمك" />
        </div>
        <div class="field">
          <label for="authPassword">كلمة المرور</label>
          <input type="password" id="authPassword" required placeholder="اكتب كلمة المرور" />
        </div>
        <button type="submit" class="btn-green" id="authSubmitBtn" style="width:100%;">دخول</button>
      </form>
    </div>
  </div>

  <!-- Profile Modal -->
  <div class="modal-backdrop" id="profileModal">
    <div class="modal-card">
      <div class="modal-head">
        <h3 id="profileHeading">الملف الشخصي</h3>
        <button type="button" class="close-x" data-close="profileModal">&times;</button>
      </div>
      <div id="targetProfileContent" class="profile-view"></div>
    </div>
  </div>

  <!-- Ad Form Modal -->
  <div class="modal-backdrop" id="adFormModal">
    <div class="modal-card">
      <div class="modal-head">
        <h3 id="adFormTitle">نشر إعلان جديد</h3>
        <button type="button" class="close-x" data-close="adFormModal">&times;</button>
      </div>
      <form id="adForm">
        <input type="hidden" id="adEditId" />
        <div class="field">
          <label for="adTitleInput">عنوان الإعلان *</label>
          <input type="text" id="adTitleInput" required placeholder="مثال: سيارة هيونداي أفانتي" />
        </div>
        <div class="field">
          <label for="adPriceInput">السعر</label>
          <input type="text" id="adPriceInput" placeholder="مثال: 5500$" />
        </div>
        <div class="field">
          <label for="adCityInput">المدينة (سوريا)</label>
          <select id="adCityInput">
            <option value="دمشق">دمشق</option>
            <option value="ريف دمشق">ريف دمشق</option>
            <option value="حلب">حلب</option>
            <option value="حمص">حمص</option>
            <option value="حماة">حماة</option>
            <option value="اللاذقية">اللاذقية</option>
            <option value="طرطوس">طرطوس</option>
            <option value="إدلب">إدلب</option>
            <option value="درعا">درعا</option>
            <option value="دير الزور">دير الزور</option>
            <option value="الحسكة">الحسكة</option>
            <option value="الرقة">الرقة</option>
            <option value="السويداء">السويداء</option>
            <option value="القنيطرة">القنيطرة</option>
          </select>
        </div>
        <div class="field">
          <label for="adCategoryInput">القسم</label>
          <select id="adCategoryInput">
            <option value="سيارات ومركبات">سيارات ومركبات</option>
            <option value="عقارات">عقارات</option>
            <option value="موبايلات وإلكترونيات">موبايلات وإلكترونيات</option>
            <option value="أثاث ومنزل">أثاث ومنزل</option>
            <option value="حيوانات وطيور">حيوانات وطيور</option>
            <option value="أخرى">أخرى</option>
          </select>
        </div>
        <div class="field">
          <label for="adConditionInput">حالة المنتج</label>
          <select id="adConditionInput">
            <option value="مستعمل">مستعمل</option>
            <option value="جديد">جديد</option>
          </select>
        </div>
        <div class="field">
          <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
            <input type="checkbox" id="adNegotiableInput" style="width:auto;" />
            <span>قابل للتفاوض</span>
          </label>
        </div>
        <div class="field">
          <label for="adDescInput">الوصف والتفاصيل</label>
          <textarea id="adDescInput" rows="3" placeholder="اكتب التفاصيل الكاملة..."></textarea>
        </div>
        <div class="field">
          <label for="adImgFile">صورة الإعلان</label>
          <input type="file" id="adImgFile" accept="image/*" />
          <img id="adImgPreview" class="img-preview" alt="معاينة" />
        </div>
        <div style="display:flex; gap:8px;">
          <button type="submit" class="btn-green" id="adSubmitBtn" style="flex:1;">نشر الإعلان</button>
          <button type="button" class="btn-outline" data-close="adFormModal">إلغاء</button>

  </div>

  <!-- Standalone Inbox/Chat Modal -->
  <div class="modal-backdrop" id="chatModal">
    <div class="modal-card" style="max-width: 800px;">
      <div class="modal-head">
        <h3 id="chatModalHeading">صندوق المحادثات</h3>
        <button type="button" class="close-x" data-close="chatModal">&times;</button>
      </div>
      <div class="chat-container">
        <div class="partners-sidebar" id="partnersSidebar"></div>
        <div class="chat-main-area">
          <div id="activeAdContextArea"></div>
          <div class="chat-messages" id="chatMessagesArea"></div>
          <form id="standaloneMsgForm" style="display:flex; gap:8px; margin-top:8px;">
            <input type="text" id="standaloneMsgInput" placeholder="اكتب رسالتك هنا..." required style="flex:1; padding:8px; border:1px solid var(--border); border-radius:7px;" />
            <button type="submit" class="btn-blue">إرسال</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Comments Modal -->
  <div class="modal-backdrop" id="commentsModal">
    <div class="modal-card">
      <div class="modal-head">
        <h3 id="commentsHeading">التعليقات</h3>
        <button type="button" class="close-x" data-close="commentsModal">&times;</button>
      </div>
      <div class="chat-messages" id="commentsBox" style="height:250px;"></div>
      <form id="commentSendForm" style="display:flex; gap:8px; margin-top:8px;">
        <input type="hidden" id="commentAdIdInput" />
        <input type="text" id="commentTextInput" placeholder="اكتب تعليقاً..." required style="flex:1; padding:8px; border:1px solid var(--border); border-radius:7px;" />
        <button type="submit" class="btn-green">إرسال</button>
      </form>
    </div>
  </div>

  <!-- Lightbox -->
  <div class="modal-backdrop" id="lightboxModal" data-close="lightboxModal">
    <img id="lightboxTarget" class="lightbox-img" alt="صورة مكبرة" />
  </div>

  <script>
    (function () {
      'use strict';

      let currentUser = null;
      let allAds = [];
      let currentMode = 'all';
      let authMode = 'login';
      let selectedImageData = '';
      let activePartner = null;
      let activeAdContext = null;
      let toastTimer = null;

      function showToast(msg, type = 'info') {
        const el = document.getElementById('toastBanner');
        const iconEl = document.getElementById('toastIcon');
        const textEl = document.getElementById('toastText');
        if (!el || !iconEl || !textEl) return;

        el.classList.remove('error', 'success');
        if (type === 'error') {
          el.classList.add('error');
          iconEl.textContent = '⚠️';
        } else if (type === 'success') {
          el.classList.add('success');
          iconEl.textContent = '✅';
        } else {
          iconEl.textContent = 'ℹ️';
        }

        textEl.textContent = msg;
        el.style.display = 'flex';
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          el.style.display = 'none';
        }, 3000);
      }

      function escapeHtml(text) {
        return String(text || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function openModal(id) { document.getElementById(id)?.classList.add('open'); }
      function closeModal(id) { document.getElementById(id)?.classList.remove('open'); }

      function loadUser() {
        try {
          currentUser = JSON.parse(localStorage.getItem('rakhis_user') || 'null');
        } catch (e) {
          currentUser = null;
        }
        renderAuth();
      }

      function saveUser() {
        if (currentUser) {
          localStorage.setItem('rakhis_user', JSON.stringify(currentUser));
        } else {
          localStorage.removeItem('rakhis_user');
        }
        renderAuth();
      }

      function renderAuth() {
        const box = document.getElementById('authBox');
        if (!box) return;
        if (currentUser && currentUser.username) {
          box.innerHTML = `
            <span class="user-chip" data-action="view-profile" data-username="${escapeHtml(currentUser.username)}" style="cursor:pointer;">👤 ${escapeHtml(currentUser.username)}</span>
            <button type="button" class="btn-red" data-action="logout">خروج</button>
          `;
        } else {
          box.innerHTML = `
            <button type="button" class="btn-green" data-action="open-auth" data-type="login">تسجيل الدخول</button>
            <button type="button" class="btn-outline" data-action="open-auth" data-type="register">إنشاء حساب</button>
          `;
        }
      }

      function switchAuthTab(type) {
        authMode = type;
        document.getElementById('tabLoginBtn').className = type === 'login' ? 'btn-green' : 'btn-outline';
        document.getElementById('tabRegisterBtn').className = type === 'register' ? 'btn-green' : 'btn-outline';
        document.getElementById('authModalHeading').textContent = type === 'register' ? 'إنشاء حساب جديد في رخيص' : 'تسجيل الدخول إلى رخيص';
        document.getElementById('authSubmitBtn').textContent = type === 'register' ? 'إنشاء الحساب' : 'دخول';
      }

      async function fetchAds() {
        const q = document.getElementById('searchQ').value.trim();
        const city = document.getElementById('filterCity').value;
        const category = document.getElementById('filterCategory').value;
        const condition = document.getElementById('filterCondition').value;
        const sort = document.getElementById('sortAds').value;

        const params = new URLSearchParams();
        if (q) params.set('q', q);
        if (city && city !== 'all') params.set('city', city);
        if (category && category !== 'all') params.set('category', category);
        if (condition && condition !== 'all') params.set('condition', condition);
        if (sort) params.set('sort', sort);

        try {
          const res = await fetch('/api/ads?' + params.toString(), { cache: 'no-store' });
          if (!res.ok) throw new Error('تعذر جلب الإعلانات من الخادم');
          allAds = await res.json();
          filterAndRenderAds();
        } catch (err) {
          document.getElementById('adsGrid').innerHTML = '<div class="empty-msg">فشل تحميل البيانات.</div>';
          showToast(err.message || 'تعذر تحميل الإعلانات', 'error');
        }
      }

      function filterAndRenderAds() {
        let list = [...allAds];
        const favIds = currentUser?.favorites || [];

        if (currentMode === 'favorites') {
          list = list.filter(a => favIds.includes(a.id));
        }

        const grid = document.getElementById('adsGrid');
        document.getElementById('adsCounter').textContent = `(${list.length} إعلان)`;

        if (!list.length) {
          grid.innerHTML = '<div class="empty-msg">لا توجد إعلانات مطابقة.</div>';
          return;
        }

        grid.innerHTML = list.map(ad => {
          const isOwner = currentUser && currentUser.username.toLowerCase() === (ad.ownerUsername || '').toLowerCase();
          const isFav = favIds.includes(ad.id);
          const imgSrc = ad.image || 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="220"><rect width="100%" height="100%" fill="%23e2e8f0"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="%2364748b" font-size="16">بدون صورة</text></svg>';

          return `
            <div class="ad-card">
              <div class="ad-img-wrap">
                <img src="${imgSrc}" class="ad-img" data-action="zoom" data-id="${escapeHtml(ad.id)}" data-src="${escapeHtml(ad.image)}" alt="${escapeHtml(ad.title)}" />
                <button type="button" class="fav-btn" data-action="toggle-fav" data-id="${escapeHtml(ad.id)}">${isFav ? '❤️' : '🤍'}</button>
              </div>
              <div class="ad-body">
                <div class="badges-row">
                  <span class="badge">${escapeHtml(ad.city)}</span>
                  <span class="badge">${escapeHtml(ad.condition)}</span>
                  ${ad.negotiable ? '<span class="badge badge-neg">قابل للتفاوض</span>' : ''}
                  <span class="badge">👁️ ${ad.views || 0}</span>
                </div>
                <div class="ad-title">${escapeHtml(ad.title)}</div>
                <div class="ad-price">${escapeHtml(ad.price)}</div>
                <div class="ad-meta" data-action="view-profile" data-username="${escapeHtml(ad.ownerUsername)}">
                  ${escapeHtml(ad.category)} • <strong>${escapeHtml(ad.ownerUsername)}</strong>
                </div>
                <div class="ad-desc">${escapeHtml(ad.description)}</div>
              </div>

              ${!isOwner ? `
                <div class="preset-msgs">
                  <button type="button" class="preset-btn" data-action="send-preset" data-id="${escapeHtml(ad.id)}" data-text="هل هذا المنتج متاح؟">هل هذا المنتج متاح؟</button>
                  <button type="button" class="preset-btn" data-action="send-preset" data-id="${escapeHtml(ad.id)}" data-text="مهتم، يرجى التواصل">مهتم بالتواصل</button>
                </div>
              ` : `
                <div class="ad-actions">
                  <button type="button" class="btn-green" data-action="open-edit" data-id="${escapeHtml(ad.id)}">✏️ تعديل</button>
                  <button type="button" class="btn-red" data-action="delete-ad" data-id="${escapeHtml(ad.id)}">🗑️ حذف</button>
                </div>
              `}

              <div class="ad-actions">
                <button type="button" class="btn-outline" data-action="open-comments" data-id="${escapeHtml(ad.id)}">💬 (${ad.comments?.length || 0})</button>
                ${!isOwner ? `
                  <button type="button" class="btn-blue" style="flex:1;" data-action="chat-user" data-username="${escapeHtml(ad.ownerUsername)}" data-ad-id="${escapeHtml(ad.id)}">✉️ محادثة</button>
                ` : ''}
              </div>
            </div>
          `;
        }).join('');
      }

      async function openProfile(username) {
        try {
          const res = await fetch(`/api/users/${encodeURIComponent(username)}`, { cache: 'no-store' });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.message || 'تعذر جلب بيانات المستخدم');
          const isMe = currentUser && currentUser.username.toLowerCase() === data.username.toLowerCase();

          const container = document.getElementById('targetProfileContent');
          container.innerHTML = `
            <div class="profile-header">
              <div class="profile-avatar">${escapeHtml((data.username || 'م')[0].toUpperCase())}</div>
              <div class="profile-info">
                <h3>${escapeHtml(data.username)}</h3>
                <p>المدينة: ${escapeHtml(data.city)} | عضو منذ: ${escapeHtml(data.joinedAt)}</p>
                ${data.phone ? `<p>📞 ${escapeHtml(data.phone)}</p>` : ''}
              </div>
            </div>
            <div>
              <strong>النبذة:</strong>
              <p style="margin-top:4px; color:var(--text);">${escapeHtml(data.bio || 'لا توجد نبذة.')}</p>
            </div>
            ${!isMe && currentUser ? `
              <button type="button" class="btn-blue" data-action="chat-user" data-username="${escapeHtml(data.username)}" style="width:100%; margin-top:10px;">إرسال رسالة مباشرة</button>
            ` : ''}
            ${isMe ? `
              <div style="border-top:1px solid var(--border); padding-top:14px; margin-top:14px;">
                <h4>تعديل بيانات الحساب</h4>
                <form id="profileUpdateForm" style="display:flex; flex-direction:column; gap:8px; margin-top:8px;">
                  <div class="field"><label for="upCity">المدينة</label><input type="text" id="upCity" value="${escapeHtml(currentUser.city)}" /></div>
                  <div class="field"><label for="upPhone">رقم الهاتف</label><input type="text" id="upPhone" value="${escapeHtml(currentUser.phone || '')}" /></div>
                  <div class="field"><label for="upBio">النبذة</label><textarea id="upBio">${escapeHtml(currentUser.bio || '')}</textarea></div>
                  <button type="submit" class="btn-green">حفظ التغييرات</button>
                </form>
              </div>
            ` : ''}
          `;
          openModal('profileModal');
        } catch (err) {
          showToast(err.message || 'تعذر جلب بيانات المستخدم', 'error');
        }
      }

      function openEditAd(adId) {
        const ad = allAds.find(a => a.id === adId);
        if (!ad) {
          showToast('الإعلان غير موجود', 'error');
          return;
        }
        document.getElementById('adForm').reset();
        document.getElementById('adEditId').value = ad.id;
        document.getElementById('adFormTitle').textContent = 'تعديل الإعلان';
        document.getElementById('adSubmitBtn').textContent = 'حفظ التعديلات';
        document.getElementById('adTitleInput').value = ad.title || '';
        document.getElementById('adPriceInput').value = ad.price || '';
        document.getElementById('adCityInput').value = ad.city || 'دمشق';
        document.getElementById('adCategoryInput').value = ad.category || 'أخرى';
        document.getElementById('adConditionInput').value = ad.condition || 'مستعمل';
        document.getElementById('adNegotiableInput').checked = Boolean(ad.negotiable);
        document.getElementById('adDescInput').value = ad.description || '';
        selectedImageData = ad.image || '';
        const preview = document.getElementById('adImgPreview');
        if (ad.image) {
          preview.src = ad.image;
          preview.style.display = 'block';
        } else {
          preview.style.display = 'none';
        }
        openModal('adFormModal');
      }

      async function openStandaloneInbox(targetPartner = null, contextAdId = null) {
        if (!currentUser) {
          showToast('سجل دخولك أولاً لاستخدام المحادثات', 'error');
          openModal('authModal');
          return;
        }
        activePartner = targetPartner;
        activeAdContext = contextAdId ? (allAds.find(a => a.id === contextAdId) || null) : null;
        openModal('chatModal');
        await refreshMessages();
      }

      async function refreshMessages() {
        const sidebar = document.getElementById('partnersSidebar');
        const msgArea = document.getElementById('chatMessagesArea');
        const contextArea = document.getElementById('activeAdContextArea');

        if (!currentUser) return;

        if (activeAdContext) {
          contextArea.innerHTML = `
            <div class="ad-context-card">
              <strong>الإعلان المستهدف:</strong> ${escapeHtml(activeAdContext.title)} (${escapeHtml(activeAdContext.price)}) • ${escapeHtml(activeAdContext.city)}
            </div>
          `;
        } else {
          contextArea.innerHTML = '';
        }

        try {
          const res = await fetch(`/api/messages?username=${encodeURIComponent(currentUser.username)}`, { cache: 'no-store' });
          if (!res.ok) throw new Error('خطأ في تحميل الرسائل');
          const msgs = await res.json();

          const myName = currentUser.username.toLowerCase();
          const partnerSet = new Set();
          msgs.forEach(m => {
            const peer = m.from.toLowerCase() === myName ? m.to : m.from;
            if (peer) partnerSet.add(peer);
          });
          if (activePartner) partnerSet.add(activePartner);

          const partners = Array.from(partnerSet);
          if (!activePartner && partners.length > 0) {
            activePartner = partners[0];
          }

          sidebar.innerHTML = partners.length > 0
            ? partners.map(p => `
                <div class="partner-item ${p.toLowerCase() === activePartner?.toLowerCase() ? 'active' : ''}" data-action="select-partner" data-partner="${escapeHtml(p)}">
                  <span>${escapeHtml(p)}</span>
                </div>
              `).join('')
            : '<div style="padding:10px; text-align:center; color:var(--muted); font-size:0.8rem;">لا توجد محادثات.</div>';

          if (!activePartner) {
            msgArea.innerHTML = '<div style="text-align:center; color:var(--muted); padding:20px;">اختر محادثة للبدء.</div>';
            return;
          }

          const thread = msgs.filter(m => {
            const f = m.from.toLowerCase();
            const t = m.to.toLowerCase();
            const p = activePartner.toLowerCase();
            return (f === myName && t === p) || (t === myName && f === p);
          });

          if (!thread.length) {
            msgArea.innerHTML = '<div style="text-align:center; color:var(--muted); padding:20px;">لا توجد رسائل في هذا السجل.</div>';
          } else {
            msgArea.innerHTML = thread.map(m => {
              const isMine = m.from.toLowerCase() === myName;
              return `
                <div class="msg-bubble ${isMine ? 'mine' : ''}">
                  ${m.adTitle ? `<div style="font-size:0.75rem; border-bottom:1px solid #ddd; margin-bottom:4px; padding-bottom:2px;">إعلان: <strong>${escapeHtml(m.adTitle)}</strong> ${m.adPrice ? `(${escapeHtml(m.adPrice)})` : ''}</div>` : ''}
                  <div>${escapeHtml(m.text)}</div>
                  <div style="font-size:0.65rem; color:#888; text-align:left; margin-top:4px;">${new Date(m.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</div>
                </div>
              `;
            }).join('');
            msgArea.scrollTop = msgArea.scrollHeight;
          }
        } catch (err) {
          msgArea.innerHTML = '<div style="text-align:center; color:red;">خطأ في تحميل الرسائل.</div>';
          showToast(err.message || 'خطأ في تحميل الرسائل', 'error');
        }
      }

      async function sendChatMessage(textOverride = null) {
        if (!currentUser || !activePartner) return;
        const input = document.getElementById('standaloneMsgInput');
        const text = textOverride || input.value.trim();
        if (!text) return;

        try {
          const res = await fetch('/api/messages', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              from: currentUser.username,
              to: activePartner,
              text,
              adId: activeAdContext ? activeAdContext.id : null,
              adTitle: activeAdContext ? activeAdContext.title : null,
              adPrice: activeAdContext ? activeAdContext.price : null
            })
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.message || 'فشل إرسال الرسالة');
          if (!textOverride) input.value = '';
          activeAdContext = null;
          await refreshMessages();
        } catch (err) {
          showToast(err.message || 'فشل إرسال الرسالة', 'error');
        }
      }

      document.getElementById('adImgFile').addEventListener('change', function () {
        const file = this.files && this.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function (ev) {
          selectedImageData = ev.target.result;
          const preview = document.getElementById('adImgPreview');
          preview.src = selectedImageData;
          preview.style.display = 'block';
        };
        reader.readAsDataURL(file);
      });

      document.getElementById('sortAds').addEventListener('change', fetchAds);

      document.addEventListener('click', async (e) => {
        const target = e.target.closest('[data-action]');
        if (!target) return;

        const action = target.dataset.action;

        if (action === 'open-auth') {
          switchAuthTab(target.dataset.type);
          openModal('authModal');
        } else if (action === 'switch-auth-tab') {
          switchAuthTab(target.dataset.tab);
        } else if (action === 'logout') {
          currentUser = null;
          currentMode = 'all';
          saveUser();
          showToast('تم تسجيل الخروج', 'info');
          fetchAds();
        } else if (action === 'open-create-ad') {
          if (!currentUser) {
            showToast('يرجى تسجيل الدخول لنشر إعلان', 'error');
            openModal('authModal');
            return;
          }
          document.getElementById('adForm').reset();
          document.getElementById('adEditId').value = '';
          document.getElementById('adFormTitle').textContent = 'نشر إعلان جديد';
          document.getElementById('adSubmitBtn').textContent = 'نشر الإعلان';
          selectedImageData = '';
          document.getElementById('adImgPreview').style.display = 'none';
          openModal('adFormModal');
        } else if (action === 'open-edit') {
          openEditAd(target.dataset.id);
        } else if (action === 'delete-ad') {
          if (!currentUser) return;
          try {
            const res = await fetch(`/api/ads/${encodeURIComponent(target.dataset.id)}`, {
              method: 'DELETE',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ ownerUsername: currentUser.username })
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.message || 'فشل حذف الإعلان');
            await fetchAds();
            showToast('تم حذف الإعلان', 'success');
          } catch (err) {
            showToast(err.message || 'فشل حذف الإعلان', 'error');
          }
        } else if (action === 'toggle-fav') {
          if (!currentUser) {
            showToast('سجل دخولك لحفظ الإعلانات في المفضلة', 'error');
            openModal('authModal');
            return;
          }
          const id = target.dataset.id;
          try {
            const res = await fetch('/api/favorites/toggle', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ username: currentUser.username, adId: id })
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.message || 'فشل تحديث المفضلة');
            currentUser.favorites = data.favorites;
            saveUser();
            filterAndRenderAds();
          } catch (err) {
            showToast(err.message || 'فشل تحديث المفضلة', 'error');
          }
        } else if (action === 'send-preset') {
          if (!currentUser) {
            showToast('سجل دخولك لإرسال رسالة لصاحب الإعلان', 'error');
            openModal('authModal');
            return;
          }
          const adId = target.dataset.id;
          const text = target.dataset.text;
          const ad = allAds.find(a => a.id === adId);
          if (!ad) return;
          await openStandaloneInbox(ad.ownerUsername, adId);
          await sendChatMessage(text);
          showToast('تم إرسال الرسالة مع تفاصيل الإعلان', 'success');
        } else if (action === 'chat-user') {
          if (!currentUser) {
            showToast('سجل دخولك لفتح المحادثة', 'error');
            openModal('authModal');
            return;
          }
          const partner = target.dataset.username;
          const adId = target.dataset.adId || null;
          closeModal('profileModal');
          await openStandaloneInbox(partner, adId);
        } else if (action === 'select-partner') {
          activePartner = target.dataset.partner;
          activeAdContext = null;
          await refreshMessages();
        } else if (action === 'open-inbox') {
          if (!currentUser) {
            showToast('سجل دخولك لعرض المحادثات', 'error');
            openModal('authModal');
            return;
          }
          await openStandaloneInbox(null, null);
        } else if (action === 'view-profile') {
          await openProfile(target.dataset.username);
        } else if (action === 'open-my-profile') {
          if (!currentUser) {
            showToast('سجل دخولك لعرض ملفك الشخصي', 'error');
            openModal('authModal');
            return;
          }
          await openProfile(currentUser.username);
        } else if (action === 'my-favorites') {
          if (!currentUser) {
            showToast('سجل دخولك لعرض المفضلة', 'error');
            openModal('authModal');
            return;
          }
          currentMode = 'favorites';
          document.getElementById('listHeading').textContent = '❤️ المفضلة';
          filterAndRenderAds();
        } else if (action === 'apply-filters' || action === 'reset-all') {
          if (action === 'reset-all') {
            document.getElementById('searchQ').value = '';
            document.getElementById('filterCity').value = 'all';
            document.getElementById('filterCategory').value = 'all';
            document.getElementById('filterCondition').value = 'all';
            document.getElementById('sortAds').value = 'newest';
            document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active'));
            document.querySelector('.cat-pill[data-cat="all"]').classList.add('active');
          }
          currentMode = 'all';
          document.getElementById('listHeading').textContent = 'أحدث الإعلانات';
          await fetchAds();
        } else if (action === 'zoom') {
          const src = target.dataset.src;
          if (src) {
            document.getElementById('lightboxTarget').src = src;
            openModal('lightboxModal');
          }
          if (target.dataset.id) {
            fetch(`/api/ads/${encodeURIComponent(target.dataset.id)}/view`, { method: 'POST' })
              .then(() => fetchAds())
              .catch(() => {});
          }
        } else if (action === 'open-comments') {
          const adId = target.dataset.id;
          const ad = allAds.find(a => a.id === adId);
          if (!ad) return;
          document.getElementById('commentAdIdInput').value = ad.id;
          document.getElementById('commentsHeading').textContent = `تعليقات: ${ad.title}`;
          const box = document.getElementById('commentsBox');
          const comments = ad.comments || [];
          box.innerHTML = comments.length
            ? comments.map(c => `
                <div class="msg-bubble">
                  <strong>${escapeHtml(c.username)}:</strong> ${escapeHtml(c.text)}
                </div>
              `).join('')
            : '<div style="text-align:center; color:var(--muted);">لا توجد تعليقات.</div>';
          openModal('commentsModal');
        }
      });

      document.addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = e.target.id;

        if (id === 'authForm') {
          const u = document.getElementById('authUsername').value.trim();
          const p = document.getElementById('authPassword').value.trim();
          const endpoint = authMode === 'register' ? '/api/auth/register' : '/api/auth/login';
          try {
            const res = await fetch(endpoint, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ username: u, password: p })
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.message || 'تعذرت العملية');
            if (authMode === 'register') {
              showToast('تم إنشاء الحساب، سجل دخولك الآن', 'success');
              switchAuthTab('login');
              document.getElementById('authPassword').value = '';
            } else {
              currentUser = data.user;
              saveUser();
              closeModal('authModal');
              showToast(`أهلاً بك يا ${currentUser.username}`, 'success');
              await fetchAds();
            }
          } catch (err) {
            showToast(err.message || 'حدث خطأ أثناء المصادقة', 'error');
          }
        } else if (id === 'adForm') {
          if (!currentUser) {
            showToast('سجل دخولك أولاً', 'error');
            openModal('authModal');
            return;
          }
          const editId = document.getElementById('adEditId').value.trim();
          const payload = {
            title: document.getElementById('adTitleInput').value.trim(),
            price: document.getElementById('adPriceInput').value.trim(),
            city: document.getElementById('adCityInput').value,
            category: document.getElementById('adCategoryInput').value,
            condition: document.getElementById('adConditionInput').value,
            negotiable: document.getElementById('adNegotiableInput').checked,
            description: document.getElementById('adDescInput').value.trim(),
            image: selectedImageData,
            ownerUsername: currentUser.username
          };
          const url = editId ? `/api/ads/${encodeURIComponent(editId)}` : '/api/ads';
          const method = editId ? 'PUT' : 'POST';
          try {
            const res = await fetch(url, {
              method,
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.message || 'فشل حفظ الإعلان');
            closeModal('adFormModal');
            currentMode = 'all';
            document.getElementById('listHeading').textContent = 'أحدث الإعلانات';
            await fetchAds();
            showToast(editId ? 'تم تحديث الإعلان' : 'تم نشر الإعلان بنجاح', 'success');
          } catch (err) {
            showToast(err.message || 'فشل حفظ الإعلان', 'error');
          }
        } else if (id === 'profileUpdateForm') {
          if (!currentUser) return;
          try {
            const res = await fetch('/api/profile/settings', {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                username: currentUser.username,
                city: document.getElementById('upCity').value.trim(),
                phone: document.getElementById('upPhone').value.trim(),
                bio: document.getElementById('upBio').value.trim()
              })
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.message || 'فشل التحديث');
            currentUser = data.user;
            saveUser();
            showToast('تم تحديث الملف الشخصي', 'success');
            await openProfile(currentUser.username);
            await fetchAds();
          } catch (err) {
            showToast(err.message || 'فشل التحديث', 'error');
          }
        } else if (id === 'standaloneMsgForm') {
          await sendChatMessage();
        } else if (id === 'commentSendForm') {
          if (!currentUser) {
            showToast('سجل دخولك لإضافة تعليق', 'error');
            openModal('authModal');
            return;
          }
          const adId = document.getElementById('commentAdIdInput').value;
          const text = document.getElementById('commentTextInput').value.trim();
          if (!text) return;
          try {
            const res = await fetch(`/api/ads/${encodeURIComponent(adId)}/comments`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ text, username: currentUser.username })
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.message || 'فشل إضافة التعليق');
            document.getElementById('commentTextInput').value = '';
            await fetchAds();
            const updatedAd = allAds.find(a => a.id === adId);
            if (updatedAd) {
              document.getElementById('commentsBox').innerHTML = (updatedAd.comments || []).map(c => `
                <div class="msg-bubble">
                  <strong>${escapeHtml(c.username)}:</strong> ${escapeHtml(c.text)}
                </div>
              `).join('');
            }
          } catch (err) {
            showToast(err.message || 'فشل إضافة التعليق', 'error');
          }
        }
      });

      document.querySelectorAll('[data-close]').forEach(btn => {
        btn.addEventListener('click', () => closeModal(btn.dataset.close));
      });

      document.querySelectorAll('.cat-pill').forEach(pill => {
        pill.addEventListener('click', () => {
          document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active'));
          pill.classList.add('active');
          document.getElementById('filterCategory').value = pill.dataset.cat;
          currentMode = 'all';
          fetchAds();
        });
      });

      loadUser();
      fetchAds();
    })();
  </script>
</body>
</html>
