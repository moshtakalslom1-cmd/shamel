<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>رخيص - اعرض واطلب كل شيء بسهولة وأمان</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏷️</text></svg>">
  <style>
    :root {
      --primary: #1f4e3d;
      --primary-dark: #15382b;
      --accent: #b92b27;
      --accent-hover: #96201d;
      --bg: #eef2ef;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    /* الشريط العلوي */
    header {
      background-color: var(--primary);
      color: #fff;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    }

    .logo {
      background: #4b2e2a;
      color: #fff;
      font-weight: bold;
      font-size: 1.2rem;
      padding: 6px 18px;
      border-radius: 20px;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .user-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .user-badge {
      background: rgba(255, 255, 255, 0.12);
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
    }

    /* الأزرار */
    button {
      cursor: pointer;
      border: none;
      border-radius: 6px;
      padding: 7px 14px;
      font-size: 0.9rem;
      font-weight: 600;
      transition: background 0.2s, transform 0.1s;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-green {
      background-color: #2e7d32;
      color: #fff;
    }

    .btn-green:hover {
      background-color: #236327;
    }

    .btn-red {
      background-color: var(--accent);
      color: #fff;
    }

    .btn-red:hover {
      background-color: var(--accent-hover);
    }

    .btn-outline {
      background: #fff;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-outline:hover {
      background: #f8fafc;
    }

    /* منطقة البحث والتصفية */
    .hero-search {
      background: #fff;
      padding: 16px;
      border-bottom: 1px solid var(--border);
      text-align: center;
    }

    .hero-search h1 {
      font-size: 1.25rem;
      margin-bottom: 12px;
      color: #111;
    }

    .search-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      max-width: 1100px;
      margin: 0 auto 12px;
    }

    .search-bar input,
    .search-bar select {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.9rem;
      min-width: 150px;
      background: #fff;
    }

    .search-bar input {
      flex: 1;
      min-width: 200px;
    }

    .quick-nav {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    /* شريط الأقسام الأفقي */
    .categories-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 12px 16px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .cat-pill {
      background: #fff;
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.88rem;
      cursor: pointer;
      white-space: nowrap;
    }

    .cat-pill.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    /* الحاوية الرئيسية */
    .container {
      max-width: 1150px;
      margin: 16px auto;
      padding: 0 16px;
    }

    .section-title {
      font-size: 1.15rem;
      margin-bottom: 14px;
      color: var(--primary-dark);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* شبكة الإعلانات */
    .ads-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 16px;
    }

    .ad-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.04);
    }

    .ad-image {
      width: 100%;
      height: 185px;
      object-fit: cover;
      background: #e2e8f0;
      cursor: zoom-in;
    }

    .ad-body {
      padding: 12px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .ad-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #0f172a;
    }

    .ad-price {
      font-weight: 700;
      color: #15803d;
      font-size: 1rem;
    }

    .ad-meta {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .ad-desc {
      font-size: 0.88rem;
      color: #334155;
      margin-top: 4px;
      white-space: pre-line;
    }

    .ad-actions {
      padding: 10px 12px;
      border-top: 1px solid #f1f5f9;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      background: #fafafa;
    }

    .ad-actions button {
      font-size: 0.8rem;
      padding: 5px 10px;
    }

    /* النوافذ المنبثقة (Modals) */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 9999;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-box {
      background: #fff;
      border-radius: 12px;
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
      position: relative;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }

    .close-modal {
      background: #e2e8f0;
      color: #1e293b;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 0.88rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.92rem;
    }

    .preview-img {
      max-width: 100%;
      max-height: 160px;
      margin-top: 8px;
      border-radius: 6px;
      display: none;
    }

    /* تكبير الصور */
    .lightbox-img {
      max-width: 95vw;
      max-height: 90vh;
      border-radius: 8px;
    }

    /* التعليقات والدردشة */
    .comments-list,
    .chat-messages {
      max-height: 240px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
      background: #f8fafc;
    }

    .comment-item,
    .chat-msg {
      padding: 8px;
      border-bottom: 1px solid #e2e8f0;
      font-size: 0.88rem;
    }

    .comment-item:last-child,
    .chat-msg:last-child {
      border-bottom: none;
    }

    .empty-state {
      text-align: center;
      padding: 40px 16px;
      color: var(--muted);
      grid-column: 1 / -1;
    }
  </style>
</head>
<body>

  <!-- الشريط العلوي -->
  <header>
    <div class="logo" data-action="reset-home">رخيص</div>
    <div class="user-controls" id="authArea"></div>
  </header>

  <!-- منطقة البحث والتنقل -->
  <section class="hero-search">
    <h1>اعرض واطلب كل شيء في رخيص بسهولة وأمان</h1>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="ابحث عن منتج أو عنوان..." />
      <select id="filterCategory">
        <option value="all">كل الأقسام</option>
        <option value="إلكترونيات">إلكترونيات</option>
        <option value="سيارات">سيارات</option>
        <option value="عقارات">عقارات</option>
        <option value="حيوانات">حيوانات</option>
        <option value="أثاث ومنزل">أثاث ومنزل</option>
        <option value="أخرى">أخرى</option>
      </select>
      <select id="filterCity">
        <option value="all">جميع المدن</option>
        <option value="أنطاليا">أنطاليا</option>
        <option value="إسطنبول">إسطنبول</option>
        <option value="أنقرة">أنقرة</option>
        <option value="إزمير">إزمير</option>
        <option value="مرسين">مرسين</option>
        <option value="غازي عنتاب">غازي عنتاب</option>
      </select>
      <button type="button" class="btn-green" data-action="search">بحث</button>
      <button type="button" class="btn-red" data-action="reset-home">الكل</button>
    </div>

    <div class="quick-nav">
      <button type="button" class="btn-green" data-action="my-profile">ملفي</button>
      <button type="button" class="btn-green" data-action="open-inbox">الرسائل</button>
      <button type="button" class="btn-red" data-action="open-add-ad">+ إعلان</button>
    </div>
  </section>

  <!-- شريط الأقسام -->
  <div class="categories-strip" id="categoriesStrip">
    <span class="cat-pill active" data-cat="all">الكل</span>
    <span class="cat-pill" data-cat="إلكترونيات">📱 إلكترونيات</span>
    <span class="cat-pill" data-cat="سيارات">🚗 سيارات</span>
    <span class="cat-pill" data-cat="عقارات">🏠 عقارات</span>
    <span class="cat-pill" data-cat="حيوانات">🐑 حيوانات</span>
    <span class="cat-pill" data-cat="أثاث ومنزل">🛋️ أثاث ومنزل</span>
    <span class="cat-pill" data-cat="أخرى">📦 أخرى</span>
  </div>

  <!-- المحتوى الرئيسي -->
  <main class="container">
    <div class="section-title">
      <span id="viewTitle">أحدث الإعلانات</span>
      <span id="adsCount" style="font-size: 0.85rem; color: var(--muted);"></span>
    </div>
    <div class="ads-grid" id="adsContainer"></div>
  </main>

  <!-- نافذة تسجيل الدخول -->
  <div class="modal-overlay" id="loginModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3>تسجيل الدخول</h3>
        <button type="button" class="close-modal" data-close-modal="loginModal">&times;</button>
      </div>
      <form id="loginForm">
        <div class="form-group">
          <label for="loginEmail">البريد الإلكتروني</label>
          <input type="email" id="loginEmail" required placeholder="example@gmail.com" />
        </div>
        <div class="form-group">
          <label for="loginName">الاسم المعروض (اختياري)</label>
          <input type="text" id="loginName" placeholder="اكتب اسمك" />
        </div>
        <button type="submit" class="btn-green" style="width: 100%;">دخول</button>
      </form>
    </div>
  </div>

  <!-- نافذة إضافة / تعديل إعلان -->
  <div class="modal-overlay" id="adModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="adModalTitle">إضافة إعلان جديد</h3>
        <button type="button" class="close-modal" data-close-modal="adModal">&times;</button>
      </div>
      <form id="adForm">
        <input type="hidden" id="editAdId" />
        <div class="form-group">
          <label for="adTitle">عنوان الإعلان *</label>
          <input type="text" id="adTitle" required placeholder="مثال: آيفون 15 برو نظيف" />
        </div>
        <div class="form-group">
          <label for="adPrice">السعر (ليرة تركية)</label>
          <input type="text" id="adPrice" placeholder="مثال: 15000" />
        </div>
        <div class="form-group">
          <label for="adCategory">القسم</label>
          <select id="adCategory">
            <option value="إلكترونيات">إلكترونيات</option>
            <option value="سيارات">سيارات</option>
            <option value="عقارات">عقارات</option>
            <option value="حيوانات">حيوانات</option>
            <option value="أثاث ومنزل">أثاث ومنزل</option>
            <option value="أخرى">أخرى</option>
          </select>
        </div>
        <div class="form-group">
          <label for="adCity">المدينة</label>
          <select id="adCity">
            <option value="أنطاليا">أنطاليا</option>
            <option value="إسطنبول">إسطنبول</option>
            <option value="أنقرة">أنقرة</option>
            <option value="إزمير">إزمير</option>
            <option value="مرسين">مرسين</option>
            <option value="غازي عنتاب">غازي عنتاب</option>
          </select>
        </div>
        <div class="form-group">
          <label for="adDescription">تفاصيل الإعلان</label>
          <textarea id="adDescription" rows="4" placeholder="اكتب مواصفات وحالة المنتج..."></textarea>
        </div>
        <div class="form-group">
          <label for="adImageInput">صورة الإعلان</label>
          <input type="file" id="adImageInput" accept="image/*" />
          <img id="adImagePreview" class="preview-img" alt="معاينة الصورة" />
        </div>
        <div style="display: flex; gap: 8px;">
          <button type="submit" class="btn-green" id="saveAdBtn" style="flex: 1;">حفظ الإعلان</button>
          <button type="button" class="btn-outline" data-close-modal="adModal">إلغاء</button>
        </div>
      </form>
    </div>
  </div>

  <!-- نافذة التعليقات -->
  <div class="modal-overlay" id="commentsModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="commentsModalTitle">التعليقات</h3>
        <button type="button" class="close-modal" data-close-modal="commentsModal">&times;</button>
      </div>
      <div class="comments-list" id="commentsList"></div>
      <form id="commentForm" style="display: flex; gap: 8px;">
        <input type="hidden" id="commentAdId" />
        <input type="text" id="commentInput" placeholder="اكتب تعليقك هنا..." required style="flex: 1; padding: 8px; border: 1px solid var(--border); border-radius: 6px;" />
        <button type="submit" class="btn-green">إرسال</button>
      </form>
    </div>
  </div>

  <!-- نافذة الدردشة والرسائل -->
  <div class="modal-overlay" id="chatModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="chatModalTitle">الرسائل</h3>
        <button type="button" class="close-modal" data-close-modal="chatModal">&times;</button>
      </div>
      <div class="chat-messages" id="chatMessagesList"></div>
      <form id="chatForm" style="display: flex; gap: 8px;">
        <input type="hidden" id="chatToEmail" />
        <input type="hidden" id="chatAdId" />
        <input type="hidden" id="chatAdTitle" />
        <input type="text" id="chatInput" placeholder="اكتب رسالتك..." required style="flex: 1; padding: 8px; border: 1px solid var(--border); border-radius: 6px;" />
        <button type="submit" class="btn-green">إرسال</button>
      </form>
    </div>
  </div>

  <!-- نافذة تكبير الصورة -->
  <div class="modal-overlay" id="lightboxModal" data-close-modal="lightboxModal">
    <img id="lightboxImg" class="lightbox-img" alt="صورة مكبرة" />
  </div>

  <script>
    (function () {
      'use strict';

      // حالة التطبيق
      let currentUser = null;
      let allAds = [];
      let isMyProfileView = false;
      let uploadedImageBase64 = '';

      // استرجاع بيانات المستخدم من localStorage بأمان
      function loadStoredUser() {
        try {
          const raw = localStorage.getItem('rakhis_user');
          currentUser = raw ? JSON.parse(raw) : null;
        } catch (e) {
          localStorage.removeItem('rakhis_user');
          currentUser = null;
        }
        renderAuthHeader();
      }

      function renderAuthHeader() {
        const authArea = document.getElementById('authArea');
        if (!authArea) return;

        if (currentUser && currentUser.email) {
          authArea.innerHTML = `
            <button type="button" class="btn-red" data-action="logout">خروج</button>
            <span class="user-badge">${escapeHtml(currentUser.email)}</span>
          `;
        } else {
          authArea.innerHTML = `
            <button type="button" class="btn-green" data-action="open-login">تسجيل الدخول</button>
          `;
        }
      }

      function escapeHtml(str) {
        return String(str || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function openModal(modalId) {
        const el = document.getElementById(modalId);
        if (el) el.classList.add('open');
      }

      function closeModal(modalId) {
        const el = document.getElementById(modalId);
        if (el) el.classList.remove('open');
      }

      function requireAuth() {
        if (currentUser && currentUser.email) return true;
        openModal('loginModal');
        return false;
      }

      // جلب الإعلانات من السيرفر
      async function fetchAds() {
        const q = document.getElementById('searchInput').value.trim();
        const category = document.getElementById('filterCategory').value;
        const city = document.getElementById('filterCity').value;

        const params = new URLSearchParams();
        if (q) params.set('q', q);
        if (category && category !== 'all') params.set('category', category);
        if (city && city !== 'all') params.set('city', city);
        if (isMyProfileView && currentUser) params.set('owner', currentUser.email);

        try {
          const res = await fetch('/api/ads?' + params.toString());
          if (!res.ok) throw new Error('فشل جلب الإعلانات');
          allAds = await res.json();
          renderAds(allAds);
        } catch (err) {
          console.error(err);
          document.getElementById('adsContainer').innerHTML =
            '<div class="empty-state">تعذر تحميل الإعلانات حالياً.</div>';
        }
      }

      function renderAds(ads) {
        const container = document.getElementById('adsContainer');
        const countEl = document.getElementById('adsCount');
        countEl.textContent = `(${ads.length} إعلان)`;

        if (!ads.length) {
          container.innerHTML = '<div class="empty-state">لا توجد إعلانات مطابقة.</div>';
          return;
        }

        container.innerHTML = ads.map(ad => {
          const isOwner = currentUser && currentUser.email.toLowerCase() === (ad.ownerEmail || '').toLowerCase();
          const imgSrc = ad.image || 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="250"><rect width="100%" height="100%" fill="%23e2e8f0"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="%2364748b" font-size="20">بدون صورة</text></svg>';
          const commentsCount = Array.isArray(ad.comments) ? ad.comments.length : 0;

          return `
            <div class="ad-card" data-id="${escapeHtml(ad.id)}">
              <img src="${imgSrc}" class="ad-image" data-action="zoom-img" alt="${escapeHtml(ad.title)}" />
              <div class="ad-body">
                <div class="ad-title">${escapeHtml(ad.title)}</div>
                <div class="ad-price">${escapeHtml(ad.price)} ل.ت</div>
                <div class="ad-meta">${escapeHtml(ad.category)} • ${escapeHtml(ad.city)} • ${escapeHtml(ad.ownerName)}</div>
                <div class="ad-desc">${escapeHtml(ad.description)}</div>
              </div>
              <div class="ad-actions">
                <button type="button" class="btn-outline" data-action="open-comments" data-ad-id="${escapeHtml(ad.id)}">
                  💬 تعليقات (${commentsCount})
                </button>
                ${!isOwner ? `
                  <button type="button" class="btn-green" data-action="open-chat" data-ad-id="${escapeHtml(ad.id)}">
                    ✉️ مراسلة
                  </button>
                ` : `
                  <button type="button" class="btn-green" data-action="edit-ad" data-ad-id="${escapeHtml(ad.id)}">
                    ✏️ تعديل
                  </button>
                  <button type="button" class="btn-red" data-action="delete-ad" data-ad-id="${escapeHtml(ad.id)}">
                    🗑️ حذف
                  </button>
                `}
              </div>
            </div>
          `;
        }).join('');
      }

      // فتح نافذة إضافة إعلان
      function handleOpenAddAd() {
        if (!requireAuth()) return;
        document.getElementById('adForm').reset();
        document.getElementById('editAdId').value = '';
        document.getElementById('adModalTitle').textContent = 'إضافة إعلان جديد';
        document.getElementById('saveAdBtn').textContent = 'نشر الإعلان';
        uploadedImageBase64 = '';
        const preview = document.getElementById('adImagePreview');
        preview.style.display = 'none';
        preview.src = '';
        openModal('adModal');
      }

      // فتح نافذة تعديل إعلان
      function handleOpenEditAd(adId) {
        if (!requireAuth()) return;
        const ad = allAds.find(a => a.id === adId);
        if (!ad) {
          alert('لم يتم العثور على الإعلان');
          return;
        }

        document.getElementById('editAdId').value = ad.id;
        document.getElementById('adModalTitle').textContent = 'تعديل الإعلان';
        document.getElementById('saveAdBtn').textContent = 'حفظ التعديلات';
        document.getElementById('adTitle').value = ad.title || '';
        document.getElementById('adPrice').value = ad.price || '';
        document.getElementById('adCategory').value = ad.category || 'أخرى';
        document.getElementById('adCity').value = ad.city || 'أنطاليا';
        document.getElementById('adDescription').value = ad.description || '';
        uploadedImageBase64 = ad.image || '';

        const preview = document.getElementById('adImagePreview');
        if (ad.image) {
          preview.src = ad.image;
          preview.style.display = 'block';
        } else {
          preview.style.display = 'none';
        }

        openModal('adModal');
      }

      // حذف إعلان
      async function handleDeleteAd(adId) {
        if (!requireAuth()) return;
        if (!confirm('هل أنت متأكد من حذف هذا الإعلان؟')) return;

        try {
          const res = await fetch(`/api/ads/${encodeURIComponent(adId)}`, {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ownerEmail: currentUser.email })
          });
          if (!res.ok) {
            const errData = await res.json().catch(() => ({}));
            throw new Error(errData.message || 'فشل الحذف');
          }
          await fetchAds();
        } catch (err) {
          alert(err.message);
        }
      }

      // التعليقات
      function handleOpenComments(adId) {
        const ad = allAds.find(a => a.id === adId);
        if (!ad) return;
        document.getElementById('commentAdId').value = ad.id;
        document.getElementById('commentsModalTitle').textContent = `تعليقات: ${ad.title}`;
        const list = document.getElementById('commentsList');
        const comments = Array.isArray(ad.comments) ? ad.comments : [];

        if (!comments.length) {
          list.innerHTML = '<div style="color: var(--muted); text-align:center;">لا توجد تعليقات بعد.</div>';
        } else {
          list.innerHTML = comments.map(c => `
            <div class="comment-item">
              <strong>${escapeHtml(c.userName)}:</strong> ${escapeHtml(c.text)}
            </div>
          `).join('');
        }
        openModal('commentsModal');
      }

      // الدردشة المباشرة وصندوق الوارد
      async function handleOpenChat(adId) {
        if (!requireAuth()) return;
        const ad = allAds.find(a => a.id === adId);
        if (!ad) return;

        document.getElementById('chatToEmail').value = ad.ownerEmail;
        document.getElementById('chatAdId').value = ad.id;
        document.getElementById('chatAdTitle').value = ad.title;
        document.getElementById('chatModalTitle').textContent = `مراسلة بخصوص: ${ad.title}`;
        document.getElementById('chatForm').style.display = 'flex';
        await loadMessages(ad.ownerEmail);
        openModal('chatModal');
      }

      async function handleOpenInbox() {
        if (!requireAuth()) return;
        document.getElementById('chatModalTitle').textContent = 'صندوق الرسائل';
        document.getElementById('chatForm').style.display = 'none';
        await loadMessages(null);
        openModal('chatModal');
      }

      async function loadMessages(partnerEmail) {
        const list = document.getElementById('chatMessagesList');
        list.innerHTML = 'جاري التحميل...';
        try {
          const res = await fetch(`/api/messages?email=${encodeURIComponent(currentUser.email)}`);
          const msgs = await res.json();
          const filtered = partnerEmail
            ? msgs.filter(m => m.from === partnerEmail || m.to === partnerEmail)
            : msgs;

          if (!filtered.length) {
            list.innerHTML = '<div style="color: var(--muted); text-align:center;">لا توجد رسائل.</div>';
            return;
          }

          list.innerHTML = filtered.map(m => `
            <div class="chat-msg">
              <div style="font-size:0.78rem; color:var(--muted);">
                من: <strong>${escapeHtml(m.from)}</strong> إلى: <strong>${escapeHtml(m.to)}</strong>
                ${m.adTitle ? ` (${escapeHtml(m.adTitle)})` : ''}
              </div>
              <div>${escapeHtml(m.text)}</div>
            </div>
          `).join('');
        } catch (e) {
          list.innerHTML = 'خطأ في تحميل الرسائل.';
        }
      }

      // مستمع نقرات موحد (Event Delegation) يعمل على سطح المكتب والجوال دون تعارض
      document.addEventListener('click', (e) => {
        // إغلاق المودال
        const closeTarget = e.target.closest('[data-close-modal]');
        if (closeTarget) {
          const modalId = closeTarget.getAttribute('data-close-modal');
          if (e.target === closeTarget || closeTarget.classList.contains('close-modal')) {
            closeModal(modalId);
            return;
          }
        }

        // النقر خارج صندوق المودال يغلقه
        if (e.target.classList.contains('modal-overlay')) {
          e.target.classList.remove('open');
          return;
        }

        // اختيار قسم من الشريط الأفقي
        const catPill = e.target.closest('.cat-pill');
        if (catPill) {
          document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active'));
          catPill.classList.add('active');
          document.getElementById('filterCategory').value = catPill.dataset.cat;
          isMyProfileView = false;
          document.getElementById('viewTitle').textContent =
            catPill.dataset.cat === 'all' ? 'أحدث الإعلانات' : `قسم: ${catPill.dataset.cat}`;
          fetchAds();
          return;
        }

        const actionEl = e.target.closest('[data-action]');
        if (!actionEl) return;

        const action = actionEl.dataset.action;
        const adId = actionEl.dataset.adId;

        if (action === 'open-login') {
          openModal('loginModal');
        } else if (action === 'logout') {
          localStorage.removeItem('rakhis_user');
          currentUser = null;
          isMyProfileView = false;
          renderAuthHeader();
          fetchAds();
        } else if (action === 'open-add-ad') {
          handleOpenAddAd();
        } else if (action === 'edit-ad') {
          handleOpenEditAd(adId);
        } else if (action === 'delete-ad') {
          handleDeleteAd(adId);
        } else if (action === 'open-comments') {
          handleOpenComments(adId);
        } else if (action === 'open-chat') {
          handleOpenChat(adId);
        } else if (action === 'open-inbox') {
          handleOpenInbox();
        } else if (action === 'my-profile') {
          if (!requireAuth()) return;
          isMyProfileView = true;
          document.getElementById('viewTitle').textContent = `إعلاناتي (${currentUser.email})`;
          fetchAds();
        } else if (action === 'search') {
          isMyProfileView = false;
          document.getElementById('viewTitle').textContent = 'نتائج البحث';
          fetchAds();
        } else if (action === 'reset-home') {
          isMyProfileView = false;
          document.getElementById('searchInput').value = '';
          document.getElementById('filterCategory').value = 'all';
          document.getElementById('filterCity').value = 'all';
          document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active'));
          document.querySelector('.cat-pill[data-cat="all"]').classList.add('active');
          document.getElementById('viewTitle').textContent = 'أحدث الإعلانات';
          fetchAds();
        } else if (action === 'zoom-img') {
          document.getElementById('lightboxImg').src = actionEl.src;
          openModal('lightboxModal');
        }
      });

      // معالجة رفع الصورة وتحويلها إلى Base64
      document.getElementById('adImageInput').addEventListener('change', function () {
        const file = this.files && this.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function (ev) {
          uploadedImageBase64 = ev.target.result;
          const preview = document.getElementById('adImagePreview');
          preview.src = uploadedImageBase64;
          preview.style.display = 'block';
        };
        reader.readAsDataURL(file);
      });

      // إرسال نموذج تسجيل الدخول
      document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value.trim();
        const name = document.getElementById('loginName').value.trim();

        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, name })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.message || 'فشل تسجيل الدخول');

          currentUser = data.user;
          localStorage.setItem('rakhis_user', JSON.stringify(currentUser));
          renderAuthHeader();
          closeModal('loginModal');
          fetchAds();
        } catch (err) {
          alert(err.message);
        }
      });

      // إرسال نموذج إضافة / تعديل إعلان
      document.getElementById('adForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!requireAuth()) return;

        const editId = document.getElementById('editAdId').value.trim();
        const payload = {
          title: document.getElementById('adTitle').value.trim(),
          price: document.getElementById('adPrice').value.trim(),
          category: document.getElementById('adCategory').value,
          city: document.getElementById('adCity').value,
          description: document.getElementById('adDescription').value.trim(),
          image: uploadedImageBase64,
          ownerEmail: currentUser.email,
          ownerName: currentUser.name
        };

        const url = editId ? `/api/ads/${encodeURIComponent(editId)}` : '/api/ads';
        const method = editId ? 'PUT' : 'POST';

        try {
          const res = await fetch(url, {
            method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.message || 'حدث خطأ أثناء الحفظ');

          closeModal('adModal');
          await fetchAds();
        } catch (err) {
          alert(err.message);
        }
      });

      // إرسال تعليق
      document.getElementById('commentForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!requireAuth()) return;

        const adId = document.getElementById('commentAdId').value;
        const text = document.getElementById('commentInput').value.trim();
        if (!text) return;

        try {
          const res = await fetch(`/api/ads/${encodeURIComponent(adId)}/comments`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              text,
              userEmail: currentUser.email,
              userName: currentUser.name
            })
          });
          if (!res.ok) throw new Error('فشل إضافة التعليق');

          document.getElementById('commentInput').value = '';
          await fetchAds();
          handleOpenComments(adId);
        } catch (err) {
          alert(err.message);
        }
      });

      // إرسال رسالة مباشرة
      document.getElementById('chatForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!requireAuth()) return;

        const to = document.getElementById('chatToEmail').value;
        const adId = document.getElementById('chatAdId').value;
        const adTitle = document.getElementById('chatAdTitle').value;
        const text = document.getElementById('chatInput').value.trim();
        if (!text) return;

        try {
          const res = await fetch('/api/messages', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              from: currentUser.email,
              to,
              adId,
              adTitle,
              text
            })
          });
          if (!res.ok) throw new Error('فشل إرسال الرسالة');

          document.getElementById('chatInput').value = '';
          await loadMessages(to);
        } catch (err) {
          alert(err.message);
        }
      });

      // تشغيل أولي عند تحميل الصفحة
      loadStoredUser();
      fetchAds();
    })();
  </script>
</body>
</html>
