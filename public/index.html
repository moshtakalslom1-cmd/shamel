<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رخيص - السوق الشامل</title>
    <style>
        :root {
            --gold-bright: #FFD700;
            --gold-deep: #B8860B;
            --gold-grad: linear-gradient(135deg, #AA771C 0%, #FCF6BA 35%, #D4AF37 60%, #FCF6BA 85%, #8A5A00 100%);
            --silver-grad: linear-gradient(135deg, #7A7F85 0%, #F5F7FA 35%, #AEB4BC 60%, #FFFFFF 80%, #5C6166 100%);
            --diamond-grad: linear-gradient(135deg, #4FD1C5 0%, #E0FFFF 35%, #87CEFA 65%, #FFFFFF 85%, #38BDF8 100%);
            --bg-obsidian: #0A0C10;
            --bg-panel: #12161F;
            --bg-card: #171C28;
            --bg-input: #0F131B;
            --border-gold: rgba(212, 175, 55, 0.45);
            --border-diamond: rgba(135, 206, 250, 0.35);
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --diamond-accent: #67E8F9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background:
                radial-gradient(circle at 15% 10%, rgba(212, 175, 55, 0.08), transparent 35%),
                radial-gradient(circle at 85% 15%, rgba(103, 232, 249, 0.08), transparent 40%),
                var(--bg-obsidian);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Header & Ornate Title */
        header {
            background: linear-gradient(180deg, rgba(23, 28, 40, 0.96), rgba(12, 15, 22, 0.96));
            border-bottom: 1px solid var(--border-gold);
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.65), 0 1px 0 rgba(103, 232, 249, 0.25);
            position: sticky;
            top: 0;
            z-index: 900;
            backdrop-filter: blur(10px);
        }

        .header-inner {
            max-width: 1440px;
            margin: 0 auto;
            padding: 10px 16px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-ornament {
            font-size: 16px;
            background: var(--diamond-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 6px rgba(103, 232, 249, 0.45));
        }

        .brand-title {
            font-size: 22px;
            font-weight: 800;
            background: var(--gold-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
            position: relative;
            padding: 0 6px;
            text-shadow: 0 0 18px rgba(212, 175, 55, 0.2);
        }

        .brand-title::before,
        .brand-title::after {
            content: "✦";
            font-size: 12px;
            vertical-align: middle;
            margin: 0 4px;
            background: var(--silver-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-gold {
            background: var(--gold-grad);
            color: #090B10;
            border: none;
            border-radius: 8px;
            padding: 7px 14px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 3px 12px rgba(212, 175, 55, 0.35);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-gold:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 16px rgba(212, 175, 55, 0.55);
        }

        .btn-silver-diamond {
            background: var(--bg-panel);
            color: var(--text-main);
            border: 1px solid rgba(203, 213, 225, 0.35);
            border-radius: 8px;
            padding: 7px 13px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: border-color 0.2s ease, background 0.2s ease;
        }

        .btn-silver-diamond:hover {
            border-color: var(--diamond-accent);
            background: rgba(103, 232, 249, 0.08);
        }

        /* Main Layout */
        .main-container {
            max-width: 1440px;
            width: 100%;
            margin: 0 auto;
            padding: 14px 16px 36px;
            flex: 1;
        }

        /* Filter & Search Bar */
        .toolbar {
            background: var(--bg-panel);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 12px;
            padding: 10px 12px;
            margin-bottom: 14px;
            display: grid;
            grid-template-columns: 2fr repeat(3, 1fr) auto;
            gap: 8px;
            align-items: center;
        }

        .toolbar input,
        .toolbar select {
            width: 100%;
            background: var(--bg-input);
            color: var(--text-main);
            border: 1px solid rgba(148, 163, 184, 0.25);
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .toolbar input:focus,
        .toolbar select:focus {
            border-color: var(--gold-bright);
        }

        .btn-reset {
            background: transparent;
            color: var(--diamond-accent);
            border: 1px solid var(--border-diamond);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn-reset:hover {
            background: rgba(103, 232, 249, 0.1);
        }

        /* Section Titles */
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 8px 0 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.25);
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            background: var(--silver-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .section-badge {
            font-size: 12px;
            color: var(--gold-bright);
            background: rgba(212, 175, 55, 0.12);
            border: 1px solid var(--border-gold);
            padding: 2px 10px;
            border-radius: 999px;
        }

        /* Horizontal Packed Categories without Horizontal Page Scroll */
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(132px, 1fr));
            gap: 8px;
            margin-bottom: 18px;
        }

        .category-tile {
            background: linear-gradient(155deg, rgba(30, 36, 51, 0.95), rgba(15, 19, 28, 0.95));
            border: 1px solid rgba(148, 163, 184, 0.22);
            border-radius: 10px;
            padding: 8px 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            cursor: pointer;
            font-size: 12.5px;
            font-weight: 600;
            color: var(--text-main);
            text-align: center;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            min-height: 44px;
        }

        .category-tile:hover {
            transform: translateY(-2px);
            border-color: var(--gold-bright);
            box-shadow: 0 4px 14px rgba(212, 175, 55, 0.2);
        }

        .category-tile.active {
            background: linear-gradient(145deg, rgba(212, 175, 55, 0.22), rgba(103, 232, 249, 0.12));
            border-color: var(--gold-bright);
            box-shadow: 0 0 14px rgba(212, 175, 55, 0.3);
            color: #FFFBEB;
        }

        .category-icon {
            font-size: 15px;
            filter: drop-shadow(0 0 4px rgba(103, 232, 249, 0.35));
        }

        /* Compact Multi-Column Ads Grid (4-5 per row on wide screens) */
        .ads-grid {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 10px;
        }

        @media (max-width: 1200px) {
            .ads-grid {
                grid-template-columns: repeat(4, minmax(0, 1fr));
            }
            .toolbar {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 900px) {
            .ads-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }

        @media (max-width: 640px) {
            .ads-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 8px;
            }
            .toolbar {
                grid-template-columns: 1fr;
            }
            .brand-title {
                font-size: 19px;
            }
        }

        .ad-card {
            background: linear-gradient(165deg, rgba(26, 32, 46, 0.96), rgba(14, 18, 26, 0.96));
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .ad-card:hover {
            transform: translateY(-3px);
            border-color: var(--gold-bright);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.55), 0 0 12px rgba(103, 232, 249, 0.16);
        }

        .ad-thumb {
            position: relative;
            width: 100%;
            height: 112px;
            background: #090C12;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-bottom: 1px solid rgba(212, 175, 55, 0.18);
        }

        .ad-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .ad-no-img {
            font-size: 11px;
            color: var(--text-muted);
            padding: 6px;
            text-align: center;
        }

        .ad-condition-tag {
            position: absolute;
            top: 6px;
            right: 6px;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 6px;
            background: rgba(10, 12, 16, 0.82);
            color: var(--diamond-accent);
            border: 1px solid var(--border-diamond);
        }

        .ad-body {
            padding: 8px 9px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1;
            justify-content: space-between;
        }

        .ad-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .ad-price {
            font-size: 13px;
            font-weight: 800;
            background: var(--diamond-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .ad-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 4px;
            font-size: 10.5px;
            color: var(--text-muted);
            border-top: 1px solid rgba(148, 163, 184, 0.12);
            padding-top: 5px;
        }

        .ad-meta span {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 36px 16px;
            background: var(--bg-panel);
            border: 1px dashed rgba(212, 175, 55, 0.35);
            border-radius: 12px;
            color: var(--text-muted);
            font-size: 14px;
        }

        /* Modals */
        .modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(3, 5, 9, 0.82);
            backdrop-filter: blur(4px);
            z-index: 1200;
            align-items: center;
            justify-content: center;
            padding: 14px;
        }

        .modal-backdrop.open {
            display: flex;
        }

        .modal-box {
            width: 100%;
            max-width: 540px;
            max-height: 90vh;
            overflow-y: auto;
            background: var(--bg-panel);
            border: 1px solid var(--border-gold);
            border-radius: 14px;
            padding: 18px;
            box-shadow: 0 14px 40px rgba(0, 0, 0, 0.75), 0 0 22px rgba(212, 175, 55, 0.18);
        }

        .modal-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.2);
        }

        .modal-title {
            font-size: 16px;
            font-weight: 700;
            background: var(--gold-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .modal-close {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 22px;
            cursor: pointer;
            line-height: 1;
        }

        .modal-close:hover {
            color: var(--diamond-accent);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 10px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-size: 12px;
            color: var(--gold-bright);
            font-weight: 600;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            background: var(--bg-input);
            color: var(--text-main);
            border: 1px solid rgba(148, 163, 184, 0.28);
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 13px;
            font-family: inherit;
        }

        .detail-img {
            width: 100%;
            max-height: 240px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 12px;
            border: 1px solid rgba(212, 175, 55, 0.25);
        }

        .detail-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
            font-size: 12.5px;
            color: var(--text-muted);
        }

        .detail-pill {
            background: var(--bg-input);
            border: 1px solid rgba(148, 163, 184, 0.22);
            padding: 4px 10px;
            border-radius: 999px;
        }

        .detail-desc {
            background: var(--bg-input);
            border-radius: 8px;
            padding: 10px;
            font-size: 13px;
            line-height: 1.6;
            color: var(--text-main);
            margin-bottom: 12px;
            white-space: pre-wrap;
        }

        .messages-box {
            max-height: 240px;
            overflow-y: auto;
            background: var(--bg-input);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .msg-bubble {
            background: rgba(23, 28, 40, 0.95);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 12.5px;
        }

        .msg-meta {
            font-size: 10.5px;
            color: var(--diamond-accent);
            margin-bottom: 3px;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-inner">
            <div class="brand-box">
                <span class="brand-ornament">💎</span>
                <h1 class="brand-title">رخيص - السوق الشامل</h1>
                <span class="brand-ornament">💎</span>
            </div>

            <div class="header-actions">
                <button class="btn-silver-diamond" onclick="openMessagesModal()">💬 المراسلات</button>
                <button class="btn-gold" onclick="openCreateModal()">＋ إضافة إعلان</button>
            </div>
        </div>
    </header>

    <main class="main-container">
        <!-- Search & Filter Bar -->
        <section class="toolbar" aria-label="أدوات البحث والفلترة">
            <input type="search" id="searchInput" placeholder="ابحث عن سيارة، هاتف، عقار، لابتوب..." oninput="applyFilters()">

            <select id="cityFilter" onchange="applyFilters()">
                <option value="">كل المحافظات والمدن</option>
                <option value="دمشق">دمشق</option>
                <option value="ريف دمشق">ريف دمشق</option>
                <option value="حلب">حلب</option>
                <option value="حمص">حمص</option>
                <option value="حماة">حماة</option>
                <option value="اللاذقية">اللاذقية</option>
                <option value="طرطوس">طرطوس</option>
                <option value="إدلب">إدلب</option>
                <option value="درعا">درعا</option>
                <option value="السويداء">السويداء</option>
                <option value="دير الزور">دير الزور</option>
                <option value="الرقة">الرقة</option>
                <option value="الحسكة">الحسكة</option>
            </select>

            <select id="conditionFilter" onchange="applyFilters()">
                <option value="">كل الحالات</option>
                <option value="جديد">جديد</option>
                <option value="مستعمل">مستعمل</option>
            </select>

            <select id="sortFilter" onchange="applyFilters()">
                <option value="newest">الأحدث أولاً</option>
                <option value="price-asc">السعر: من الأقل للأعلى</option>
                <option value="price-desc">السعر: من الأعلى للأقل</option>
            </select>

            <button class="btn-reset" onclick="resetFilters()">إعادة ضبط</button>
        </section>

        <!-- Compact Horizontal Categories -->
        <div class="section-header">
            <h2 class="section-title">✦ الأقسام الرئيسية</h2>
            <span class="section-badge" id="activeCategoryLabel">جميع الأقسام</span>
        </div>
        <section class="categories-grid" id="categoriesGrid"></section>

        <!-- Compact Multi-Column Ads Grid -->
        <div class="section-header">
            <h2 class="section-title">✦ أحدث الإعلانات</h2>
            <span class="section-badge" id="adsCountBadge">0 إعلان</span>
        </div>
        <section class="ads-grid" id="adsGrid"></section>
    </main>

    <!-- Create Ad Modal -->
    <div class="modal-backdrop" id="createAdModal">
        <div class="modal-box">
            <div class="modal-head">
                <h3 class="modal-title">نشر إعلان جديد</h3>
                <button class="modal-close" onclick="closeModal('createAdModal')">&times;</button>
            </div>
            <form id="createAdForm" onsubmit="handleCreateAd(event)">
                <div class="form-grid">
                    <div class="form-group full">
                        <label for="adTitle">عنوان الإعلان</label>
                        <input type="text" id="adTitle" required placeholder="مثال: آيفون 15 برو ماكس أو سيارة...">
                    </div>

                    <div class="form-group">
                        <label for="adPrice">السعر</label>
                        <input type="number" id="adPrice" required min="0" step="any" placeholder="مثال: 2500">
                    </div>

                    <div class="form-group">
                        <label for="adCurrency">العملة</label>
                        <select id="adCurrency">
                            <option value="USD">USD ($)</option>
                            <option value="SYP">ل.س</option>
                            <option value="TRY">TRY (₺)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="adCategory">القسم الرئيسي</label>
                        <select id="adCategory" required></select>
                    </div>

                    <div class="form-group">
                        <label for="adCondition">الحالة</label>
                        <select id="adCondition">
                            <option value="مستعمل">مستعمل</option>
                            <option value="جديد">جديد</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="adCity">المحافظة / المدينة</label>
                        <input type="text" id="adCity" value="دمشق" required>
                    </div>

                    <div class="form-group">
                        <label for="adNeighbourhood">الحي / المنطقة</label>
                        <input type="text" id="adNeighbourhood" placeholder="مثال: المزة، الشعلان...">
                    </div>

                    <div class="form-group full">
                        <label for="adImage">رابط الصورة (اختياري)</label>
                        <input type="url" id="adImage" placeholder="https://...">
                    </div>

                    <div class="form-group full">
                        <label for="adDescription">التفاصيل والوصف</label>
                        <textarea id="adDescription" rows="3" placeholder="اكتب مواصفات الإعلان وطريقة التواصل..."></textarea>
                    </div>
                </div>

                <button type="submit" class="btn-gold" style="width:100%; justify-content:center; padding:10px;">
                    نشر الإعلان الآن
                </button>
            </form>
        </div>
    </div>

    <!-- Ad Details Modal -->
    <div class="modal-backdrop" id="detailAdModal">
        <div class="modal-box">
            <div class="modal-head">
                <h3 class="modal-title" id="detailTitle">تفاصيل الإعلان</h3>
                <button class="modal-close" onclick="closeModal('detailAdModal')">&times;</button>
            </div>
            <div id="detailContent"></div>
        </div>
    </div>

    <!-- Messages Modal -->
    <div class="modal-backdrop" id="messagesModal">
        <div class="modal-box">
            <div class="modal-head">
                <h3 class="modal-title">صندوق المراسلات</h3>
                <button class="modal-close" onclick="closeModal('messagesModal')">&times;</button>
            </div>
            <div class="messages-box" id="messagesList"></div>
            <form onsubmit="handleSendMessage(event)">
                <div class="form-group">
                    <label for="msgRecipient">اسم المستلم / صاحب الإعلان</label>
                    <input type="text" id="msgRecipient" required placeholder="مثال: user أو اسم المعلن">
                </div>
                <div class="form-group">
                    <label for="msgText">نص الرسالة</label>
                    <textarea id="msgText" rows="2" required placeholder="اكتب رسالتك هنا..."></textarea>
                </div>
                <button type="submit" class="btn-gold" style="width:100%; justify-content:center; padding:9px;">
                    إرسال الرسالة
                </button>
            </form>
        </div>
    </div>

    <script>
        const API_BASE = '/api';

        const CATEGORIES = [
            { name: 'سيارات ومركبات', icon: '🚗' },
            { name: 'هواتف وأجهزة ذكية', icon: '📱' },
            { name: 'عقارات', icon: '🏠' },
            { name: 'إلكترونيات وكمبيوتر', icon: '💻' },
            { name: 'أثاث ومفروشات', icon: '🛋️' },
            { name: 'حيوانات أليفة وطيور', icon: '🐾' },
            { name: 'أزياء وموضة', icon: '👔' },
            { name: 'خدمات وأعمال', icon: '🛠️' }
        ];

        let allAds = [];
        let selectedCategory = '';

        function initCategories() {
            const grid = document.getElementById('categoriesGrid');
            const select = document.getElementById('adCategory');

            grid.innerHTML = CATEGORIES.map(cat => `
                <div class="category-tile ${selectedCategory === cat.name ? 'active' : ''}" onclick="toggleCategory('${escapeAttr(cat.name)}')">
                    <span class="category-icon">${cat.icon}</span>
                    <span>${escapeHtml(cat.name)}</span>
                </div>
            `).join('');

            select.innerHTML = CATEGORIES.map(cat => `
                <option value="${escapeAttr(cat.name)}">${escapeHtml(cat.name)}</option>
            `).join('');
        }

        function toggleCategory(categoryName) {
            selectedCategory = (selectedCategory === categoryName) ? '' : categoryName;
            document.getElementById('activeCategoryLabel').textContent = selectedCategory || 'جميع الأقسام';
            initCategories();
            applyFilters();
        }

        async function loadAds() {
            const grid = document.getElementById('adsGrid');
            try {
                const res = await fetch(`${API_BASE}/ads`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                allAds = Array.isArray(data) ? data : (Array.isArray(data.ads) ? data.ads : []);
                applyFilters();
            } catch (err) {
                console.error('Error loading ads:', err);
                grid.innerHTML = `<div class="empty-state">تعذر جلب الإعلانات من الخادم حالياً.</div>`;
                document.getElementById('adsCountBadge').textContent = '0 إعلان';
            }
        }

        function applyFilters() {
            const query = (document.getElementById('searchInput').value || '').trim().toLowerCase();
            const city = (document.getElementById('cityFilter').value || '').trim();
            const condition = (document.getElementById('conditionFilter').value || '').trim();
            const sort = document.getElementById('sortFilter').value;

            let filtered = allAds.filter(ad => {
                const title = (ad.title || '').toLowerCase();
                const desc = (ad.description || '').toLowerCase();
                const cat = ad.category || '';
                const adCity = ad.city || '';
                const adNeigh = ad.neighbourhood || '';
                const adCond = ad.condition || '';

                const matchQuery = !query || title.includes(query) || desc.includes(query) || cat.toLowerCase().includes(query) || adCity.toLowerCase().includes(query);
                const matchCat = !selectedCategory || cat === selectedCategory;
                const matchCity = !city || adCity.includes(city) || adNeigh.includes(city);
                const matchCond = !condition || adCond === condition;

                return matchQuery && matchCat && matchCity && matchCond;
            });

            if (sort === 'price-asc') {
                filtered.sort((a, b) => Number(a.price || 0) - Number(b.price || 0));
            } else if (sort === 'price-desc') {
                filtered.sort((a, b) => Number(b.price || 0) - Number(a.price || 0));
            } else {
                filtered.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
            }

            renderAds(filtered);
        }

        function renderAds(ads) {
            const grid = document.getElementById('adsGrid');
            const badge = document.getElementById('adsCountBadge');
            badge.textContent = `${ads.length} إعلان`;

            if (!ads.length) {
                grid.innerHTML = `<div class="empty-state">لا توجد إعلانات مطابقة للبحث أو الفلترة الحالية.</div>`;
                return;
            }

            grid.innerHTML = ads.map((ad, idx) => {
                const id = ad._id || ad.id || String(idx);
                const priceNum = Number(ad.price);
                const formattedPrice = Number.isFinite(priceNum) ? priceNum.toLocaleString() : escapeHtml(ad.price || '0');
                const currencyLabel = ad.currency === 'SYP' ? 'ل.س' : (ad.currency === 'TRY' ? '₺' : '$');
                const locationText = [ad.city, ad.neighbourhood].filter(Boolean).join(' - ') || 'غير محدد';

                return `
                    <article class="ad-card" onclick="openAdDetail('${escapeAttr(id)}')">
                        <div class="ad-thumb">
                            ${ad.image
                                ? `<img src="${escapeAttr(ad.image)}" alt="${escapeAttr(ad.title || 'إعلان')}" loading="lazy" onerror="this.parentElement.innerHTML='<span class=\\'ad-no-img\\'>تعذر تحميل الصورة</span>'">`
                                : `<span class="ad-no-img">بدون صورة</span>`
                            }
                            ${ad.condition ? `<span class="ad-condition-tag">${escapeHtml(ad.condition)}</span>` : ''}
                        </div>
                        <div class="ad-body">
                            <div>
                                <div class="ad-title" title="${escapeAttr(ad.title || '')}">${escapeHtml(ad.title || 'بدون عنوان')}</div>
                                <div class="ad-price">${formattedPrice} ${currencyLabel}</div>
                            </div>
                            <div class="ad-meta">
                                <span>📍 ${escapeHtml(locationText)}</span>
                                <span>${escapeHtml(ad.category || '')}</span>
                            </div>
                        </div>
                    </article>
                `;
            }).join('');
        }

        function openAdDetail(id) {
            const ad = allAds.find(item => (item._id || item.id) === id);
            if (!ad) return;

            document.getElementById('detailTitle').textContent = ad.title || 'تفاصيل الإعلان';
            const priceNum = Number(ad.price);
            const formattedPrice = Number.isFinite(priceNum) ? priceNum.toLocaleString() : escapeHtml(ad.price || '0');
            const currencyLabel = ad.currency === 'SYP' ? 'ل.س' : (ad.currency === 'TRY' ? '₺' : '$');

            document.getElementById('detailContent').innerHTML = `
                ${ad.image ? `<img class="detail-img" src="${escapeAttr(ad.image)}" alt="${escapeAttr(ad.title || '')}">` : ''}
                <div class="detail-row">
                    <span class="detail-pill">💎 السعر: <strong>${formattedPrice} ${currencyLabel}</strong></span>
                    <span class="detail-pill">📂 القسم: ${escapeHtml(ad.category || 'عام')}</span>
                    <span class="detail-pill">📍 الموقع: ${escapeHtml([ad.city, ad.neighbourhood].filter(Boolean).join(' - ') || 'غير محدد')}</span>
                    ${ad.condition ? `<span class="detail-pill">✨ الحالة: ${escapeHtml(ad.condition)}</span>` : ''}
                </div>
                <div class="detail-desc">${escapeHtml(ad.description || 'لا يوجد وصف إضافي لهذا الإعلان.')}</div>
                <button class="btn-silver-diamond" style="width:100%; justify-content:center; padding:9px;" onclick="quickMessageOwner('${escapeAttr(ad.ownerUsername || 'user')}', '${escapeAttr(ad.title || '')}')">
                    💬 مراسلة المعلن بخصوص هذا الإعلان
                </button>
            `;

            openModal('detailAdModal');
        }

        function quickMessageOwner(owner, title) {
            closeModal('detailAdModal');
            document.getElementById('msgRecipient').value = owner || 'user';
            document.getElementById('msgText').value = `مرحباً، أستفسر بخصوص إعلان: ${title}`;
            openMessagesModal();
        }

        async function handleCreateAd(e) {
            e.preventDefault();
            const payload = {
                title: document.getElementById('adTitle').value.trim(),
                price: Number(document.getElementById('adPrice').value),
                currency: document.getElementById('adCurrency').value,
                category: document.getElementById('adCategory').value,
                condition: document.getElementById('adCondition').value,
                city: document.getElementById('adCity').value.trim(),
                neighbourhood: document.getElementById('adNeighbourhood').value.trim(),
                image: document.getElementById('adImage').value.trim(),
                description: document.getElementById('adDescription').value.trim(),
                ownerUsername: 'user'
            };

            try {
                const res = await fetch(`${API_BASE}/ads`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);

                document.getElementById('createAdForm').reset();
                closeModal('createAdModal');
                await loadAds();
            } catch (err) {
                console.error('Error creating ad:', err);
                alert('تعذر نشر الإعلان، تحقق من اتصال الخادم.');
            }
        }

        async function openMessagesModal() {
            openModal('messagesModal');
            const list = document.getElementById('messagesList');
            list.innerHTML = `<div style="color:var(--text-muted); font-size:12px;">جاري تحميل الرسائل...</div>`;

            try {
                const res = await fetch(`${API_BASE}/messages`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                const msgs = Array.isArray(data) ? data : (Array.isArray(data.messages) ? data.messages : []);

                if (!msgs.length) {
                    list.innerHTML = `<div style="color:var(--text-muted); font-size:12px;">لا توجد رسائل بعد.</div>`;
                    return;
                }

                list.innerHTML = msgs.map(m => `
                    <div class="msg-bubble">
                        <div class="msg-meta">إلى: ${escapeHtml(m.to || m.recipient || 'مستخدم')}</div>
                        <div>${escapeHtml(m.text || m.message || '')}</div>
                    </div>
                `).join('');
            } catch (err) {
                console.error('Error loading messages:', err);
                list.innerHTML = `<div style="color:var(--text-muted); font-size:12px;">تعذر تحميل الرسائل من الخادم.</div>`;
            }
        }

        async function handleSendMessage(e) {
            e.preventDefault();
            const to = document.getElementById('msgRecipient').value.trim();
            const text = document.getElementById('msgText').value.trim();
            if (!to || !text) return;

            try {
                const res = await fetch(`${API_BASE}/messages`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ to, text, sender: 'user' })
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);

                document.getElementById('msgText').value = '';
                await openMessagesModal();
            } catch (err) {
                console.error('Error sending message:', err);
                alert('تعذر إرسال الرسالة.');
            }
        }

        function resetFilters() {
            selectedCategory = '';
            document.getElementById('searchInput').value = '';
            document.getElementById('cityFilter').value = '';
            document.getElementById('conditionFilter').value = '';
            document.getElementById('sortFilter').value = 'newest';
            document.getElementById('activeCategoryLabel').textContent = 'جميع الأقسام';
            initCategories();
            applyFilters();
        }

        function openCreateModal() {
            openModal('createAdModal');
        }

        function openModal(id) {
            document.getElementById(id).classList.add('open');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('open');
        }

        document.querySelectorAll('.modal-backdrop').forEach(backdrop => {
            backdrop.addEventListener('click', event => {
                if (event.target === backdrop) {
                    backdrop.classList.remove('open');
                }
            });
        });

        function escapeHtml(str) {
            return String(str ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function escapeAttr(str) {
            return escapeHtml(str);
        }

        initCategories();
        loadAds();
    </script>
</body>
</html>
