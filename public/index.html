<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>رخيص والسوق الشامل — المنظمة الفاخرة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #07090e;
      --bg-card: #0d111a;
      --bg-elevated: #131824;
      --border-subtle: rgba(245, 196, 81, 0.18);
      --gold: #f5c451;
      --gold-deep: #b8861b;
      --silver: #cbd5e1;
      --diamond: #7dd3fc;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #22c55e;
      --radius-lg: 12px;
      --radius-md: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }

    html, body {
      background: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      font-size: 14px;
    }

    header {
      position: sticky; top: 0; z-index: 50;
      background: rgba(9, 12, 18, 0.95);
      backdrop-filter: blur(15px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 8px 12px;
    }

    .header-inner {
      max-width: 1400px; margin: 0 auto; display: flex;
      flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px;
    }

    .brand { display: flex; align-items: center; gap: 8px; cursor: pointer; }

    .brand-badge {
      width: 36px; height: 36px; border-radius: 8px;
      background: linear-gradient(135deg, var(--gold), var(--gold-deep));
      display: grid; place-items: center; font-weight: 800; color: #07090e; font-size: 1.1rem;
    }

    .brand-title {
      font-size: 1.1rem; font-weight: 800;
      background: linear-gradient(90deg, var(--gold), #fff);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    .brand-sub { font-size: 0.7rem; color: var(--silver); }

    .header-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

    .btn {
      border: 1px solid var(--border-subtle); background: var(--bg-elevated);
      color: var(--text-main); padding: 6px 12px; border-radius: var(--radius-md);
      font-size: 0.85rem; font-weight: 700; cursor: pointer; display: inline-flex;
      align-items: center; gap: 4px; transition: all 0.2s ease;
    }

    .btn:hover { border-color: var(--gold); }

    .btn-gold { background: var(--gold); color: #07090e; border: none; }
    .btn-diamond { border-color: var(--diamond); color: var(--diamond); }
    .btn-danger { border-color: var(--danger); color: #fca5a5; }

    .container { max-width: 1400px; margin: 0 auto; padding: 12px; }

    .toolbar {
      background: var(--bg-card); border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg); padding: 10px; display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; margin-bottom: 12px;
    }

    .input, .select, .textarea {
      width: 100%; background: var(--bg-dark); border: 1px solid var(--border-subtle);
      color: var(--text-main); padding: 8px 12px; border-radius: var(--radius-md);
      font-size: 0.85rem; outline: none;
    }
    .input:focus, .select:focus { border-color: var(--gold); }

    .categories-strip {
      display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px;
    }

    .cat-chip {
      padding: 6px 12px; border-radius: 999px; background: var(--bg-card);
      border: 1px solid var(--border-subtle); color: var(--silver);
      font-size: 0.8rem; font-weight: 700; cursor: pointer;
    }
    .cat-chip.active { border-color: var(--gold); color: var(--gold); }

    .ads-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    @media (max-width: 1200px) { .ads-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 900px) { .ads-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 600px) { .ads-grid { grid-template-columns: 1fr; } }

    .ad-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle); border-radius: var(--radius-lg);
      overflow: hidden; display: flex; flex-direction: column; justify-content: space-between;
      cursor: pointer; transition: transform 0.15s;
    }
    .ad-card:hover { transform: translateY(-2px); border-color: var(--gold); }

    .ad-img-wrap { position: relative; height: 130px; background: #07090e; }
    .ad-img-wrap img { width: 100%; height: 100%; object-fit: cover; }

    .ad-badge-cat {
      position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,0.8);
      border: 1px solid var(--diamond); color: var(--diamond); padding: 2px 8px;
      border-radius: 999px; font-size: 0.7rem;
    }

    .ad-body { padding: 10px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
    .ad-title { font-size: 0.95rem; font-weight: 700; line-height: 1.3; }
    .ad-price { font-size: 1rem; font-weight: 800; color: var(--gold); }
    .ad-meta { font-size: 0.75rem; color: var(--text-muted); display: flex; justify-content: space-between; }

    .ad-footer { padding: 8px 10px; border-top: 1px solid var(--border-subtle); display: flex; gap: 4px; }
    .ad-footer .btn { padding: 4px 8px; font-size: 0.75rem; }

    .modal-backdrop {
      position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.8);
      display: none; align-items: center; justify-content: center; padding: 10px; overflow-y: auto;
    }
    .modal-backdrop.open { display: flex; }
    .modal-box {
      width: 100%; max-width: 600px; background: var(--bg-card);
      border: 1px solid var(--gold); border-radius: var(--radius-lg); padding: 16px;
    }
    .modal-header { display: flex; justify-content: space-between; border-bottom: 1px solid var(--border-subtle); padding-bottom: 8px; margin-bottom: 12px; }
    .modal-title { font-size: 1.1rem; font-weight: 800; color: var(--gold); }

    .chat-container { display: grid; grid-template-columns: 180px 1fr; gap: 10px; height: 50vh; }
    .chat-user-list { background: var(--bg-dark); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 6px; overflow-y: auto; }
    .user-item { padding: 8px; border-radius: var(--radius-md); cursor: pointer; font-size: 0.85rem; }
    .user-item.active { background: var(--bg-elevated); color: var(--gold); }
    .chat-messages { background: var(--bg-dark); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 10px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 6px; }
    .msg-bubble { max-width: 85%; padding: 8px 12px; border-radius: 12px; font-size: 0.85rem; }
    .msg-me { align-self: flex-start; background: var(--gold); color: #07090e; font-weight: 600; }
    .msg-other { align-self: flex-end; background: var(--bg-elevated); border: 1px solid var(--diamond); }
    .msg-time { display: block; font-size: 0.65rem; opacity: 0.7; margin-top: 2px; }

    .toast-container { position: fixed; bottom: 12px; left: 12px; right: 12px; z-index: 200; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
    .toast { pointer-events: auto; max-width: 400px; width: 100%; background: #111622; border: 1px solid var(--gold); color: var(--text-main); padding: 10px 16px; border-radius: var(--radius-md); font-size: 0.85rem; display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="brand" onclick="goHome()">
        <div class="brand-badge">✦</div>
        <div>
          <div class="brand-title">رخيص والسوق الشامل</div>
          <div class="brand-sub">إعلانات سريعة • تواصل مباشر</div>
        </div>
      </div>

      <div class="header-actions">
        <button class="btn btn-gold" onclick="openAdForm()">+ إعلان</button>
        <button class="btn btn-diamond" onclick="openChatModal()">💬 الدردشات</button>
        <button class="btn" onclick="openProfileModal()">👤 ملفك</button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="toolbar">
      <input id="searchInput" class="input" type="search" placeholder="بحث سريع..." oninput="renderAds()" />
      <select id="cityFilter" class="select" onchange="renderAds()">
        <option value="">كل المدن</option>
        <option value="دمشق">دمشق</option>
        <option value="حلب">حلب</option>
        <option value="أنطاليا">أنطاليا</option>
        <option value="إسطنبول">إسطنبول</option>
      </select>
      <select id="conditionFilter" class="select" onchange="renderAds()">
        <option value="">الحالة</option>
        <option value="جديد">جديد</option>
        <option value="مستعمل">مستعمل</option>
      </select>
      <select id="sortSelect" class="select" onchange="renderAds()">
        <option value="newest">الأحدث</option>
        <option value="price-asc">الأرخص</option>
      </select>
    </section>

    <section id="categoriesStrip" class="categories-strip"></section>
    <section id="adsGrid" class="ads-grid"></section>
  </main>

  <div id="detailsModal" class="modal-backdrop" onclick="handleBackdropClick(event, 'details')">
    <div class="modal-box" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div id="detailTitle" class="modal-title">تفاصل الإعلان</div>
        <button class="btn" onclick="closeActiveModal()">✕</button>
      </div>
      <div id="detailContent"></div>
    </div>
  </div>

  <div id="adFormModal" class="modal-backdrop" onclick="handleBackdropClick(event, 'adForm')">
    <div class="modal-box" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div id="adFormTitle" class="modal-title">إضافة إعلان</div>
        <button class="btn" onclick="closeActiveModal()">✕</button>
      </div>
      <form id="adForm" onsubmit="submitAdForm(event)">
        <input type="hidden" id="editAdId" />
        <div style="display:grid; grid-template-columns:1fr 120px; gap:8px;">
          <div class="input-group"><input id="adTitle" class="input" type="text" required placeholder="العنوان..." /></div>
          <div class="input-group"><input id="adPrice" class="input" type="number" required placeholder="السعر..." /></div>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:8px;">
          <select id="adCategory" class="select" required></select>
          <select id="adCondition" class="select"><option value="مستعمل">مستعمل</option><option value="جديد">جديد</option></select>
          <select id="adCurrency" class="select"><option value="USD">$</option><option value="SYP">SYP</option><option value="TRY">TRY</option></select>
        </div>
        <input id="adCity" class="input" type="text" placeholder="المدينة..." style="margin-top:8px;" />
        <textarea id="adDescription" class="textarea" rows="2" placeholder="الوصف..." style="margin-top:8px;"></textarea>
        
        <div style="margin-top:8px;">
          <input id="adImageFile" class="input" type="file" accept="image/*" onchange="handleImageFile(event, 'ad')" />
          <div id="adImagePreviewBox" class="preview-box" style="display:none;margin-top:4px;"><img id="adImagePreview" src="" style="max-height:100px;" /></div>
        </div>

        <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:12px;">
          <button type="button" class="btn" onclick="closeActiveModal()">إلغاء</button>
          <button type="submit" class="btn btn-gold">حفظ</button>
        </div>
      </form>
    </div>
  </div>

  <div id="chatModal" class="modal-backdrop" onclick="handleBackdropClick(event, 'chat')">
    <div class="modal-box" style="max-width:800px;" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div id="chatModalTitle" class="modal-title">💬 الدردشة</div>
        <button id="toggleBlockBtn" type="button" class="btn btn-danger" onclick="toggleBlockCurrentPeer()">🚫 حظر</button>
        <button class="btn" onclick="closeActiveModal()">✕</button>
      </div>
      <div class="chat-container">
        <div style="display:flex; flex-direction:column; gap:6px;">
          <input class="input" placeholder="مستخدم جديد..." onkeydown="if(event.key==='Enter'){event.preventDefault();addOrSelectPeer(this.value);this.value='';}" />
          <div id="chatUserList" class="chat-user-list"></div>
        </div>
        <div style="display:flex; flex-direction:column; justify-content:space-between;">
          <div id="chatMessages" class="chat-messages"></div>
          <form onsubmit="sendChatMessage(event)" style="display:flex; gap:6px; margin-top:8px;">
            <button id="voiceRecordBtn" type="button" class="btn btn-diamond" onclick="toggleVoiceRecording()">🎙️</button>
            <input id="chatTextInput" class="input" placeholder="رسالة..." required />
            <button type="submit" class="btn btn-gold">إرسال</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div id="profileModal" class="modal-backdrop" onclick="handleBackdropClick(event, 'profile')">
    <div class="modal-box" onclick="event.stopPropagation()">
      <div class="modal-header"><div class="modal-title">👤 الملف الشخصي</div><button class="btn" onclick="closeActiveModal()">✕</button></div>
      <form onsubmit="saveProfile(event)">
        <input id="profileName" class="input" type="text" required placeholder="الاسم الظاهر..." />
        <input id="profileCity" class="input" type="text" placeholder="المدينة..." style="margin-top:8px;" />
        <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:12px;">
          <button type="button" class="btn" onclick="closeActiveModal()">إلغاء</button>
          <button type="submit" class="btn btn-gold">حفظ</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <script src="app.js"></script>
</body>
</html>
